<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foundry Map AI-103</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  /* Layout: knowledge explorer, tree on the left, detail on the right; calm, precise, clear */
  --scrim:rgba(10,12,16,.4);
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6; --line:#e3e6eb; --line-strong:#cfd4dc;
  --text:#16191f; --text-2:#4a5260; --text-3:#6b7382;
  --accent:#2557d6; --accent-soft:#e8eefc; --accent-text:#1d47b3;
  --ok:#1f7a4d; --ok-soft:#e5f4ec; --warn:#a14a12; --warn-soft:#fbefe4;
  --d1:#2f62c9; --d2:#0f7f74; --d3:#a8620a; --d4:#b03a5b; --d5:#4a7a1f;
  --code-bg:#f3f5f8; --code-text:#1e2430; --code-com:#6b7382;
  --shadow:0 1px 2px rgba(22,25,31,.05),0 4px 16px rgba(22,25,31,.04);
  --r:10px; --font:"Geist","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono","Cascadia Code","JetBrains Mono",Consolas,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111318; --surface:#181b21; --surface-2:#1f232a; --line:#2a2f38; --line-strong:#3a404b;
  --text:#e8eaee; --text-2:#b4bac5; --text-3:#8a919e;
  --accent:#6b95f2; --accent-soft:#1e2a45; --accent-text:#9db8f7;
  --ok:#5cc28d; --ok-soft:#173326; --warn:#e79a5b; --warn-soft:#3a2617;
  --d1:#6b95f2; --d2:#3dbcae; --d3:#e0a245; --d4:#e27a97; --d5:#8fbf5c;
  --code-bg:#14171c; --code-text:#d9dde4; --code-com:#7d8592;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111318; --surface:#181b21; --surface-2:#1f232a; --line:#2a2f38; --line-strong:#3a404b;
  --text:#e8eaee; --text-2:#b4bac5; --text-3:#8a919e;
  --accent:#6b95f2; --accent-soft:#1e2a45; --accent-text:#9db8f7;
  --ok:#5cc28d; --ok-soft:#173326; --warn:#e79a5b; --warn-soft:#3a2617;
  --d1:#6b95f2; --d2:#3dbcae; --d3:#e0a245; --d4:#e27a97; --d5:#8fbf5c;
  --code-bg:#14171c; --code-text:#d9dde4; --code-com:#7d8592;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent-text)}
code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:.05em .35em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap;cursor:pointer;background:none;border:0;padding:4px 2px}
.brand b{font-size:16px;letter-spacing:-.01em}
.brand span{color:var(--text-3);font-size:13px}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;height:38px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);border-radius:9px;padding:0 64px 0 36px;font:inherit;font-size:14px}
.search input::placeholder{color:var(--text-3)}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--text-3)}
.search kbd{position:absolute;right:9px;top:8px;font:12px var(--mono);color:var(--text-3);border:1px solid var(--line-strong);border-radius:5px;padding:1px 6px;background:var(--surface-2)}
.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);white-space:nowrap}
.progress .bar{width:90px;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.progress .bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.iconbtn{height:36px;min-width:36px;border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:13px;color:var(--text-2)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:16px;height:16px}
.menu-btn{display:none}

.filters{display:flex;gap:8px;flex-wrap:wrap;padding-block:0 10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto;align-items:center}
.filters .lbl{font-size:12px;color:var(--text-3);margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:none;height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line-strong);background:var(--surface);font-size:12.5px;cursor:pointer;color:var(--text-2)}
.chip .sw{width:8px;height:8px;border-radius:2px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.chip.clear{border-style:dashed}

/* Layout */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1500px;margin:0 auto;min-height:calc(100vh - 110px)}
.side{border-right:1px solid var(--line);padding-block:14px 40px;padding-right:10px;padding-left:max(14px,env(safe-area-inset-left,0px));position:sticky;top:104px;align-self:start;max-height:calc(100vh - 104px);overflow:auto}
.main{padding-block:28px 80px;padding-left:36px;padding-right:max(36px,env(safe-area-inset-right,0px));min-width:0}

/* Tree */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:13px;padding-left:9px;border-left:1px solid var(--line)}
.tree li{margin:1px 0}
.row{display:flex;align-items:center;gap:2px}
.tog{width:22px;height:26px;border:0;background:none;cursor:pointer;color:var(--text-3);display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:5px}
.tog:hover{background:var(--surface-2)}
.tog svg{width:12px;height:12px;transition:transform .15s}
.tog[aria-expanded="true"] svg{transform:rotate(90deg)}
.tog.leaf{visibility:hidden}
.node{flex:1;min-width:0;text-align:left;border:0;background:none;cursor:pointer;padding:4px 8px;border-radius:7px;font-size:13.5px;color:var(--text-2);display:flex;align-items:center;gap:8px}
.node:hover{background:var(--surface-2);color:var(--text)}
.node.active{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.node .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .done{margin-left:auto;width:14px;height:14px;color:var(--ok);flex:none}
.tree>li>.row .node{font-weight:600;color:var(--text);font-size:14px}
.tree>li{margin-bottom:4px}

/* Overview */
.hero h1,.dhead h1{text-wrap:balance}
.hero h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:0 0 8px}
.hero p{color:var(--text-2);max-width:68ch;margin:0 0 6px}
.domains{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:22px 0 28px}
.dom{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.dom .pct{font:600 13px var(--mono);color:var(--text-3)}
.dom .nm{font-weight:600;font-size:14px;margin-top:2px}
.dom .meter{height:4px;border-radius:4px;margin-top:10px;background:var(--surface-2);overflow:hidden}
.dom .meter i{display:block;height:100%}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.gcard.feature{grid-column:1/-1;background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.gcard h3{margin:0;font-size:16px;letter-spacing:-.01em}
.gcard h3 button{all:unset;cursor:pointer}
.gcard h3 button:hover{color:var(--accent-text)}
.gcard h3 button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.gcard p{margin:0;color:var(--text-2);font-size:13.5px}
.gcard .kids{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.kid{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:3px 9px;font-size:12.5px;cursor:pointer;color:var(--text-2)}
.kid:hover{border-color:var(--accent);color:var(--accent-text)}
.kid.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));color:var(--ok)}
.gfoot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px;font-size:12px;color:var(--text-3)}
.dtags{display:flex;gap:5px}
.dtag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-2);border:1px solid var(--line);border-radius:99px;padding:1px 8px;background:var(--surface)}
.dtag i{width:7px;height:7px;border-radius:2px;display:inline-block}

/* Detail */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--text-3);margin-bottom:10px}
.crumbs button{border:0;background:none;padding:0;cursor:pointer;color:var(--text-3)}
.crumbs button:hover{color:var(--accent-text);text-decoration:underline}
.dhead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.dhead h1{font-size:27px;line-height:1.2;letter-spacing:-.02em;margin:0 0 4px}
.dhead .sub{color:var(--text-2);margin:0 0 10px}
.know{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:13.5px;color:var(--text-2);white-space:nowrap}
.know svg{width:16px;height:16px}
.know[aria-pressed="true"]{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 50%,var(--line));color:var(--ok);font-weight:600}
.know:active,.iconbtn:active,.chip:active{transform:translateY(1px)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec>h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin:0 0 10px;font-weight:600}
.sec p{margin:0 0 10px;max-width:80ch}
.sec p:last-child{margin-bottom:0}
.sec ul,.sec ol{margin:0;padding-left:20px}
.sec li{margin:4px 0}
.sec table{width:100%;border-collapse:collapse;font-size:13.5px;margin:4px 0 2px}
.sec th{text-align:left;font-weight:600;color:var(--text-2);background:var(--surface-2);padding:8px 10px;border-bottom:1px solid var(--line)}
.sec td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.sec tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.sec.when h2{color:var(--accent-text)}
.sec.cfg h2{color:var(--d2)}
.sec.trap{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,var(--line))}
.sec.trap h2{color:var(--warn)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols .sec{margin-bottom:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tab{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--text-2)}
.tab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.codebox{position:relative}
.codebox pre{margin:0;background:var(--code-bg);color:var(--code-text);border:1px solid var(--line);border-radius:9px;padding:14px 16px;overflow:auto;font:12.8px/1.6 var(--mono);tab-size:4}
.codebox .com{color:var(--code-com);font-style:italic}
.copy{position:absolute;top:8px;right:8px;height:28px;font-size:12px;padding:0 9px}
.subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.subcard{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.subcard:hover{border-color:var(--accent)}
.subcard b{font-size:14px}
.subcard span{font-size:12.5px;color:var(--text-2)}
.subcard .ok{color:var(--ok);font-size:12px;font-weight:600}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.pager button{flex:1;max-width:48%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer}
.pager button:hover{border-color:var(--accent)}
.pager small{display:block;color:var(--text-3);font-size:12px}
.pager .next{text-align:right;margin-left:auto}

/* Results */
.results h1{font-size:22px;margin:0 0 14px}
.res{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;margin-bottom:8px;cursor:pointer}
.res:hover{border-color:var(--accent)}
.res .path{font-size:12px;color:var(--text-3)}
.res b{font-size:15px}
.res p{margin:3px 0 0;font-size:13px;color:var(--text-2)}
mark{background:color-mix(in srgb,var(--d3) 30%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.empty{border:1px dashed var(--line-strong);border-radius:12px;padding:28px;text-align:center;color:var(--text-2)}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.foot{color:var(--text-3);font-size:12px;margin-top:40px;border-top:1px solid var(--line);padding-top:14px}


/* Diagram */
.flows{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.plaatgrid{display:grid;grid-template-columns:1fr;gap:14px}
.plaat{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow);min-width:0}
.plaatscroll{overflow-x:auto}
.plaat svg{display:block;width:100%;min-width:880px;height:auto;color:var(--text);font-family:var(--font)}
.plaat figcaption{font-size:12.5px;color:var(--text-3);padding:8px 4px 0}
.pr rect{fill:var(--surface-2);stroke:var(--line);stroke-width:1}
.pr text{font-size:12px;font-weight:600;fill:var(--text-3);letter-spacing:.04em;text-transform:uppercase}
.pe path{fill:none;stroke:var(--line-strong);stroke-width:1.2}
.pe.hi path{stroke:var(--accent);stroke-width:2.2}
.pe text{font-size:11.5px;fill:var(--accent-text);font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.mk-m{fill:var(--line-strong)} .mk-h{fill:var(--accent)}
.pn{cursor:pointer}
.pn rect{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2}
.pn text{font-size:13px;fill:var(--text-2);font-weight:500}
.pn.on rect{stroke:var(--accent);stroke-width:1.8;fill:var(--accent-soft)}
.pn.on text{fill:var(--accent-text);font-weight:600}
.pn.sel rect{stroke-width:3}
.pn:hover rect{stroke:var(--accent)}
.pn:focus-visible{outline:none}.pn:focus-visible rect{stroke:var(--accent);stroke-width:3}
.plaatcta{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;border:1px solid var(--accent);background:var(--accent-soft);color:var(--text);border-radius:12px;padding:12px 16px;margin-top:18px;cursor:pointer}
.plaatcta b{color:var(--accent-text)}
.plaatcta span{font-size:13.5px;color:var(--text-2)}
.plaatside{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
.plaatside .sec{margin-bottom:0}
.plaatside .iconbtn{margin-top:6px}
.navlink{white-space:nowrap}
@media (max-width:1100px){.domains{grid-template-columns:repeat(3,minmax(0,1fr))}.cols{grid-template-columns:1fr}}
@media (max-width:860px){
  .navlink span{display:none}
  .layout{grid-template-columns:1fr}
  .menu-btn{display:inline-flex}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);max-height:none;top:0;z-index:40;background:var(--surface);transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow);padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));overflow:auto}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;display:none}
  .scrim.open{display:block}
  .main{padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top-inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
  .search{order:3;flex-basis:100%;max-width:none}
  .brand span,.progress .bar{display:none}
  .filters{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto;flex-wrap:nowrap}
  .domains{grid-template-columns:1fr 1fr}
  .sec{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<header class="top">
  <div class="top-inner">
    <button class="iconbtn menu-btn" id="menuBtn" aria-label="Show topics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button class="brand" id="home" aria-label="Go to overview"><b>Foundry Map</b><span>AI-103 · everything the exam asks</span></button>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search a service, term or setting (e.g. PTU, mask, phrase list)" aria-label="Search" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <div class="progress" title="Topics you marked as 'got it'"><div class="bar"><i id="pbar"></i></div><span id="ptxt">0/0</span></div>
    <button class="iconbtn navlink" id="plaatBtn" aria-label="Diagram with connections"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="6" height="5" rx="1"/><rect x="15" y="4" width="6" height="5" rx="1"/><rect x="9" y="15" width="6" height="5" rx="1"/><path d="M9 6.5h6M6 9v3.5h6V15M18 9v3.5h-6"/></svg><span>Diagram</span></button>
    <button class="iconbtn" id="theme" aria-label="Light or dark theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
  <div class="filters" id="filters" role="group" aria-label="Filter by exam domain"></div>
</header>
<div class="scrim" id="scrim"></div>
<div class="layout">
  <nav class="side" id="side" aria-label="Topics"><ul class="tree" id="tree"></ul></nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<script>
const N=[];
// ===== Groups (layer 1) =====
N.push(
{id:"platform",p:null,t:"Foundry platform",s:"Resource, projects, models, deployments, security, monitoring",d:[1],ico:"▦",
what:"The foundation: how Microsoft Foundry is structured in Azure, how you choose and deploy models, how you secure it and how you keep an eye on it. This is exam domain 1 <b>Plan &amp; manage</b> (25-30%).",
when:["Questions about <b>which resource</b>, <b>which deployment type</b>, <b>which role</b>, <b>how to monitor</b> or <b>how to reduce cost</b>."]},
{id:"rai",p:null,t:"Responsible AI & guardrails",s:"Content filters, Prompt Shields, evaluations, governance",d:[1,3],ico:"⛨",

// ===== Foundry platform =====
N.push(
{id:"resource",p:"platform",t:"Foundry resource & projects",s:"The hierarchy: resource → project → deployments, agents, connections",d:[1],
what:"<p>The <b>Foundry resource</b> is the Azure resource everything runs in (technically: <code>Microsoft.CognitiveServices/accounts</code> with <code>kind: AIServices</code>). One resource gives you access to models and to all <b>Foundry Tools</b> (formerly Azure AI services: Language, Speech, Vision, Translator, Content Understanding, Document Intelligence, Content Safety).</p><p>Inside the resource you create <b>projects</b>: workspaces per team or app, each with its own agents, files, evaluations and connections. You deploy models at the resource level and they can be used in every project.</p><p><b>Hierarchy:</b> subscription → resource group → Foundry resource → project(s).</p>",
when:["Setting up a new AI app or agent → Foundry resource + project.","Separating teams that still share the same models → several projects in one resource.","Fully separate billing, network or region → separate resources."],
code:[{l:"Project endpoint (format)",src:"https://<resource-name>.services.ai.azure.com/api/projects/<project-name>"},
{l:"Create with Azure CLI",src:"az cognitiveservices account create \\\n  --name my-foundry --resource-group rg-ai \\\n  --kind AIServices --sku S0 --location swedencentral \\\n  --custom-domain my-foundry --allow-project-management\n\naz cognitiveservices account project create \\\n  --name my-foundry --resource-group rg-ai \\\n  --project-name customer-service"},
{l:"Bicep (infrastructure as code)",src:"resource foundry 'Microsoft.CognitiveServices/accounts@2025-06-01' = {\n  name: 'my-foundry'\n  location: 'swedencentral'\n  kind: 'AIServices'\n  sku: { name: 'S0' }\n  identity: { type: 'SystemAssigned' }\n  properties: {\n    allowProjectManagement: true\n    customSubDomainName: 'my-foundry'\n    disableLocalAuth: true          // no API keys\n    publicNetworkAccess: 'Disabled' // private endpoint only\n  }\n}\n\nresource project 'Microsoft.CognitiveServices/accounts/projects@2025-06-01' = {\n  parent: foundry\n  name: 'customer-service'\n  location: 'swedencentral'\n  identity: { type: 'SystemAssigned' }\n  properties: {}\n}"}],
cfg:["<b>Region</b>: decides which models and features are available.","<b>customSubDomainName</b>: required for Entra ID authentication (keyless).","<b>disableLocalAuth: true</b>: turns off API keys.","<b>Managed identity</b> on the resource and project: for access to Storage, Search and so on."],
traps:["<b>Foundry (classic)</b> used a <i>hub</i> + an Azure ML workspace. The new Foundry uses the Foundry resource with projects. If a question mentions a 'hub', it is about the old setup.","You deploy models on the <b>resource</b>; you create agents in a <b>project</b>."],
rel:["deployments","security","connections","sdk"]},

{id:"modelkeuze",p:"platform",t:"Choosing a model",s:"LLM, SLM, multimodal, reasoning, embeddings, Foundry Tools",d:[1,2],
what:"<p>The <b>model catalog</b> in Foundry holds thousands of models. On the exam you have to pick the right type for each task:</p><ul><li><b>LLM</b> (large language model), such as GPT-4.1 or GPT-5: broad, strong, more expensive.</li><li><b>SLM</b> (small language model), such as Phi-4 or the mini/nano variants: cheap, fast, good enough for simple tasks such as classification.</li><li><b>Reasoning model</b> (o-series, GPT-5 with reasoning): thinks first, for complex multistep problems. Slower and more expensive.</li><li><b>Multimodal model</b>: understands text + images (+ audio).</li><li><b>Embedding model</b> (text-embedding-3-small/large): turns text into vectors for search.</li><li><b>Image/video models</b>: gpt-image-1, Sora.</li><li><b>Foundry Tools</b>: specialized services (Speech, Language, ...) when they do exactly the task.</li></ul><p><b>Source:</b> models <i>sold directly by Azure</i> (OpenAI, Phi, DeepSeek, Mistral and others, under Microsoft terms) and <i>partner/community</i> models (through Marketplace).</p>",
when:["Simple task, high volume, lower cost → <b>SLM</b>.","Complex reasoning, code, math, planning → <b>reasoning model</b>.","Image + text together → <b>multimodal</b>.","Searching by meaning → <b>embedding model</b>.","Not sure which model is best per request → <b>model router</b> (a deployment that picks the right model for each request).","Comparing → <b>benchmarks / leaderboards</b> in the catalog, then evaluate on your own data."],
cfg:["Reasoning models: <code>reasoning_effort</code> (low/medium/high) instead of temperature.","Model version and <b>auto-update</b> policy per deployment.","Watch the <b>model retirement</b> dates: old versions get phased out."],
traps:["Bigger is not better. If a simple task costs too much, the answer is almost always a smaller model.","Fine-tuning is rarely the first answer. First prompt engineering, then RAG, and only then fine-tuning."],
rel:["deployments","finetuning","kosten","embeddings"]},

{id:"deployments",p:"platform",t:"Deployments & deployment types",s:"Standard, Global, Data Zone, Provisioned (PTU), Batch",d:[1],
what:"<p>A <b>deployment</b> is a deployed model with its own name that your app sends requests to. The <b>deployment type</b> decides where the request is processed and how you pay.</p><table><tr><th>Type</th><th>What</th><th>When</th></tr><tr><td><b>Global Standard</b></td><td>Pay per token, processed in any Azure datacenter worldwide</td><td>Default choice, highest quota</td></tr><tr><td><b>Data Zone Standard</b></td><td>Pay per token, processed inside one zone (EU or US)</td><td>Data must stay inside the EU</td></tr><tr><td><b>Standard</b> (regional)</td><td>Pay per token, in one region</td><td>Data strictly in one region</td></tr><tr><td><b>Provisioned</b> (Global / Data Zone / Regional)</td><td>Reserved capacity in <b>PTUs</b> (provisioned throughput units), fixed price per hour</td><td>High, steady volume, predictable latency</td></tr><tr><td><b>Global / Data Zone Batch</b></td><td>Asynchronous, results within 24 hours, ~50% cheaper</td><td>Large volumes that are not urgent</td></tr><tr><td><b>Developer</b></td><td>For testing fine-tuned models</td><td>Evaluation, not production</td></tr></table>",
when:["Data may not leave the EU → <b>Data Zone</b> (EU).","High steady traffic + guarantee / predictable latency → <b>Provisioned (PTU)</b>, also called provisioned throughput.","Processing millions of documents overnight, no rush → <b>Batch</b>.","Variable or unpredictable traffic → <b>Standard / Global Standard</b>."],
code:[{l:"Create a deployment (CLI)",src:"az cognitiveservices account deployment create \\\n  --name my-foundry --resource-group rg-ai \\\n  --deployment-name gpt-41 \\\n  --model-name gpt-4.1 --model-version 2025-04-14 --model-format OpenAI \\\n  --sku-name GlobalStandard --sku-capacity 100   # 100 = 100K TPM"}],
cfg:["<b>SKU</b> = deployment type.","<b>Capacity</b>: for Standard in units of 1,000 TPM, for Provisioned in PTUs.","<b>Deployment name</b>: this is what you use in your code as <code>model=</code>.","The <b>content filter / guardrail</b> is attached per deployment.","<b>Spillover</b>: with Provisioned you can set up overflow to a Standard deployment for peaks."],
traps:["In code you use the <b>deployment name</b>, not necessarily the model name.","Global = data may be processed outside your region. If the question says 'data residency', choose Data Zone or Regional."],
rel:["quota","kosten","modelkeuze"]},

{id:"quota",p:"platform",t:"Quota, rate limits & 429",s:"TPM, RPM, HTTP 429, retry, scaling",d:[1],
what:"<p><b>Quota</b> = how much capacity you are allowed to use per model, per region, per subscription. Measured in <b>TPM</b> (tokens per minute). Linked to it is <b>RPM</b> (requests per minute): roughly 6 RPM per 1,000 TPM.</p><p>If you go over the limit, you get <b>HTTP 429 Too Many Requests</b>, with a <code>retry-after</code> header that tells you how long to wait.</p><p>A <b>token</b> is a piece of text (roughly ¾ of a word in English, less in other languages such as Dutch). Both input and output count, and <code>max_tokens</code> already counts toward the estimate.</p>",
when:["Occasional 429 → <b>retry with exponential backoff</b> (1 s, 2 s, 4 s...).","Constant 429 → <b>increase quota</b> (request it) or raise the deployment's capacity.","Need more capacity than one region gives → several deployments + <b>load balancing</b> (for example through API Management as an AI gateway).","Need a guarantee → <b>Provisioned</b>."],
code:[{l:"Retry with backoff (Python)",src:"import time\nfrom openai import RateLimitError\n\nfor attempt in range(5):\n    try:\n        response = openai.responses.create(model=\"gpt-41\", input=question)\n        break\n    except RateLimitError:\n        time.sleep(2 ** attempt)   # 1, 2, 4, 8, 16 seconds"}],
cfg:["Response headers: <code>x-ratelimit-remaining-tokens</code>, <code>x-ratelimit-remaining-requests</code>.","Keep <code>max_tokens</code> / <code>max_output_tokens</code> low: a value that is too high 'reserves' quota.","Azure Monitor metrics: <i>Processed tokens</i>, <i>Requests</i>, <i>Throttled requests</i>."],
traps:["A higher <code>max_tokens</code> does not fix 429; it makes it worse.","Quota applies per <b>subscription + region + model</b>, not per project."],
rel:["deployments","kosten","monitoring"]},

{id:"security",p:"platform",t:"Security & identity",s:"Managed identity, RBAC, keyless, network, Key Vault",d:[1],
what:"<p><b>Keyless</b> = without API keys. Your app signs in through <b>Microsoft Entra ID</b> (Microsoft's identity system) with a <b>managed identity</b>: an identity that Azure manages for your App Service, Function or container. What that identity is allowed to do, you decide with <b>RBAC</b> (role-based access control: permissions through roles).</p><p><b>Important roles:</b></p><ul><li><b>Azure AI User</b>: use models and agents in a project (data actions). The default role for apps and developers.</li><li><b>Azure AI Project Manager</b>: manage projects and give people access.</li><li><b>Azure AI Account Owner</b>: manage the resource and projects.</li><li><b>Cognitive Services OpenAI User</b>: call OpenAI models only.</li><li><b>Cognitive Services User</b>: call Foundry Tools (Language, Speech, ...).</li><li><b>Search Index Data Reader / Contributor</b>: read / write an index in AI Search.</li><li><b>Storage Blob Data Reader</b>: read blobs (for example for indexers).</li></ul><p><b>Network:</b> <b>private endpoint</b> = the resource gets a private IP in your virtual network (VNet). With <code>publicNetworkAccess: Disabled</code> it can no longer be reached over the internet.</p>",
when:["'No keys / keyless / no secrets' → <b>managed identity + RBAC</b>.","Reachable only from the company network → <b>private endpoint</b> + public access off.","Still need a secret (for example a third-party API) → <b>Key Vault</b> or a <b>project connection</b>.","Your own encryption key is required → <b>customer-managed keys (CMK)</b> in Key Vault.","Principle: <b>least privilege</b> = as few permissions as possible."],
code:[{l:"Keyless sign-in in Python",src:"from azure.identity import DefaultAzureCredential\nfrom azure.ai.projects import AIProjectClient\n\n# Locally: uses your 'az login'. In Azure: the managed identity.\nproject = AIProjectClient(\n    endpoint=\"https://my-foundry.services.ai.azure.com/api/projects/customer-service\",\n    credential=DefaultAzureCredential(),\n)"},
{l:"Assign a role (CLI)",src:"az role assignment create \\\n  --assignee <principal-id-of-managed-identity> \\\n  --role \"Azure AI User\" \\\n  --scope /subscriptions/<sub>/resourceGroups/rg-ai/providers/Microsoft.CognitiveServices/accounts/my-foundry"}],
cfg:["Turning on a managed identity: <b>system-assigned</b> (belongs to one resource, is deleted with it) or <b>user-assigned</b> (a separate object, reusable by several resources).","<code>disableLocalAuth: true</code> on the resource = keys off.","Agent Service <b>standard setup</b>: your own Storage, Cosmos DB and AI Search in your own network (for data isolation)."],
traps:["Key Vault is safer than app settings, but it is <b>not keyless</b>.","SAS tokens belong to Storage, not to Foundry models.","A managed identity only works with an <b>RBAC role</b> assigned. Without a role you get 401/403."],
rel:["resource","connections","agentsetup"]},

{id:"connections",p:"platform",t:"Connections",s:"Linking a project to AI Search, Storage, APIs, MCP servers",d:[1,2],
what:"A <b>connection</b> is a saved link from your project to another service: Azure AI Search, Storage, Application Insights, an external API or an MCP server. The credentials are stored centrally and securely. Agent tools point to a connection instead of holding a key themselves.",
when:["Agent needs your AI Search index → connection to AI Search.","MCP server or API with a key → connection with that key; the tool points to the <code>project_connection_id</code>.","Tracing → connection to Application Insights."],
code:[{l:"List connections",src:"for c in project.connections.list():\n    print(c.name, c.type)\n\nsearch_conn = project.connections.get(\"my-search\")"}],
cfg:["Authentication per connection: <b>Entra ID</b> (preferred) or <b>API key</b>.","Shared with all project members or only with you."],
traps:["Never put a key in an agent's instructions or code. Use a connection."],
rel:["security","tools","tracing"]},

{id:"cicd",p:"platform",t:"CI/CD & infrastructure as code",s:"Bicep, azd, GitHub Actions / Azure DevOps, evaluation as a gate",d:[1],
what:"<p><b>CI/CD</b> (continuous integration / continuous deployment) = automatically testing and deploying on every change. For Foundry that means:</p><ul><li><b>Infrastructure as code (IaC)</b>: define the resource, project, deployments and roles in <b>Bicep</b> or <b>Terraform</b>, so every environment (dev/test/prod) is identical.</li><li><b>azd</b> (Azure Developer CLI): <code>azd up</code> stands up a complete app + infrastructure from a template.</li><li><b>Pipeline</b> (GitHub Actions or Azure DevOps): builds, tests, runs <b>evaluations</b> and deploys.</li><li><b>Evaluation gate</b>: the pipeline stops if the quality score (for example groundedness) drops below a threshold.</li><li><b>Agent versions</b>: every change to an agent is a new version, so you can roll back.</li></ul>",
when:["Rebuild the same environment in test and production → <b>IaC (Bicep/Terraform)</b>.","Prevent a worse prompt from going live → <b>evaluation as a step in the pipeline</b>.","Pipeline must sign in to Azure without secrets → <b>workload identity federation (OIDC)</b>, a trust relationship between GitHub/DevOps and Entra ID."],
code:[{l:"GitHub Actions (sketch)",src:"jobs:\n  deploy:\n    runs-on: ubuntu-latest\n    permissions: { id-token: write, contents: read }  # OIDC, no secret\n    steps:\n      - uses: actions/checkout@v4\n      - uses: azure/login@v2\n        with:\n          client-id: ${{ vars.AZURE_CLIENT_ID }}\n          tenant-id: ${{ vars.AZURE_TENANT_ID }}\n          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}\n      - run: az deployment group create -g rg-ai -f infra/main.bicep\n      - run: python evals/run_eval.py   # fails if the score is too low\n      - run: python deploy_agent.py     # new agent version"}],
cfg:["Separate resources or projects per environment (dev/test/prod).","Keep deployment names the same across environments, so the code does not change.","Endpoint and names through <b>environment variables</b>, not hardcoded."],
traps:["A service principal with a <b>client secret</b> works, but <b>OIDC / workload identity federation</b> is the keyless answer."],
rel:["evaluaties","resource","security"]},

{id:"monitoring",p:"platform",t:"Monitoring",s:"Azure Monitor, metrics, diagnostic settings, alerts, drift",d:[1],
what:"<p>Monitoring has three layers:</p><ul><li><b>Metrics</b> (Azure Monitor): numbers over time, such as tokens, requests, latency, throttling and PTU utilization. You set <b>alerts</b> on these.</li><li><b>Logs</b> through <b>diagnostic settings</b>: platform logs (who called what, when) sent to Log Analytics, Storage or Event Hub. You query them with <b>KQL</b> (Kusto Query Language).</li><li><b>Tracing</b> through Application Insights: every step inside your app or agent, per request (see Tracing).</li></ul><p>On top of that: <b>continuous evaluation</b> (continuously scoring samples of live traffic for quality and safety) to spot <b>drift</b>: quality that slowly gets worse.</p>",
when:["How many tokens/how much cost per day, alert on a spike → <b>metrics + alert</b>.","Keep an audit log of who used the API → <b>diagnostic settings → Log Analytics</b>.","See per request which step was slow or failed → <b>tracing</b>.","Watch the quality of live answers → <b>continuous evaluation</b> / online evaluation.","Index health → AI Search metrics (query latency, throttled queries) and indexer status."],
cfg:["Metrics: <i>Processed Prompt Tokens</i>, <i>Generated Completion Tokens</i>, <i>Time to Response</i>, <i>Provisioned-managed Utilization</i>.","Safety signals: number of blocked requests per filter category."],
traps:["CPU/memory are not relevant for Foundry: Microsoft manages the servers.","Diagnostic settings do <b>not</b> show the steps inside an agent. For that you need tracing."],
rel:["tracing","evaluaties","quota"]},

{id:"tracing",p:"platform",t:"Tracing & observability",s:"Application Insights, OpenTelemetry, spans, tokens, latency",d:[1,2],
what:"<p><b>Tracing</b> records the whole chain for each request as <b>spans</b> (steps): model call → tool call → result → answer, each with time, tokens and input/output. You see it as a timeline in Foundry (<i>Tracing</i>) or in <b>Application Insights</b>.</p><p>Technically this uses <b>OpenTelemetry</b> (an open standard for instrumenting software) with the GenAI conventions. <b>Observability</b> is the umbrella term: understanding what your system does through traces, logs and metrics.</p>",
when:["'Per request / each step / tool calls / latency breakdown / token analytics' → <b>tracing with Application Insights</b>.","Analyzing failures in an agent (error analysis) → search the traces.","Cost per user or feature → token attributes in traces."],
code:[{l:"Turn on tracing (sketch)",src:"from azure.monitor.opentelemetry import configure_azure_monitor\nfrom opentelemetry.instrumentation.openai_v2 import OpenAIInstrumentor\n\n# Connection string of the Application Insights resource linked to the project\nconfigure_azure_monitor(connection_string=os.environ[\"APPLICATIONINSIGHTS_CONNECTION_STRING\"])\nOpenAIInstrumentor().instrument()   # every OpenAI call becomes a span\n\n# Also record prompts and answers (mind privacy!):\n# OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=true"}],
cfg:["<b>Connect</b> an Application Insights resource <b>to the Foundry project</b> (portal: Tracing).","Message content is <b>off</b> by default for privacy. Turn it on deliberately.","Agents in the Agent Service are traced server-side automatically once Application Insights is connected."],
traps:["Do not confuse it with diagnostic settings (platform logs) or metrics (totals)."],
rel:["monitoring","evaluaties","agenteval"]},

{id:"kosten",p:"platform",t:"Cost & scaling",s:"Tokens, PTU, batch, caching, smaller models, AI gateway",d:[1],
what:"<p>Cost for language models = <b>tokens in × price</b> + <b>tokens out × price</b> (output is usually more expensive). Levers you can pull:</p><ul><li><b>Smaller model</b> (SLM, mini/nano) for simple tasks.</li><li><b>Model router</b>: picks a cheap or a heavy model per request.</li><li><b>Batch</b>: ~50% discount if it is not urgent.</li><li><b>Prompt caching</b>: repeated long prompt prefixes (such as the system prompt) are cheaper. So put fixed text at the start.</li><li><b>Shorter</b>: compact prompts, cap <code>max_output_tokens</code>, send fewer RAG chunks.</li><li><b>Provisioned</b> is cheaper per token with high, constant usage. More expensive with low usage.</li><li><b>API Management as an AI gateway</b>: token limits per app (<i>token limit policy</i>), load balancing, <i>semantic caching</i>.</li></ul>",
when:["'Reduce cost' + simple task → smaller model.","'Reduce cost' + not urgent → batch.","Enforce a token budget per team → API Management token limit policy."],
traps:["PTU is not automatically cheaper. Only with high and steady usage."],
rel:["modelkeuze","deployments","quota"]}
);

// ===== Platform extra: CLI and containers =====
N.push(
{id:"cli",p:"platform",t:"Azure CLI & azd",s:"The commands that come up on the exam, with their values",d:[1],
what:"<p>The <b>Azure CLI</b> (<code>az</code>) is the command-line tool for managing Azure. On the exam you sometimes have to pick the right command or the right parameter value. Pattern: <code>az &lt;service&gt; &lt;component&gt; &lt;action&gt; --parameters</code>.</p><p><b>azd</b> (Azure Developer CLI) stands up a complete app from a template: infrastructure (Bicep) + code + configuration, with one command.</p>",
when:["Sign in → <code>az login</code> (after that <code>DefaultAzureCredential</code> works locally).","Create a Foundry/AI resource → <code>az cognitiveservices account create</code>.","Get the endpoint or keys → <code>az cognitiveservices account show</code> / <code>keys list</code>.","Deploy a model → <code>az cognitiveservices account deployment create</code>.","Assign a role → <code>az role assignment create</code>.","Whole AI app from a template → <code>azd init</code> + <code>azd up</code>."],
code:[{l:"Common commands",src:"# Sign in and choose a subscription\naz login\naz account set --subscription \"<name-or-id>\"\n\n# Foundry resource (kind = AIServices). Single services: --kind TextAnalytics, SpeechServices,\n# ComputerVision, FormRecognizer, ContentSafety, TextTranslation\naz cognitiveservices account create -n my-foundry -g rg-ai \\\n  --kind AIServices --sku S0 -l swedencentral --custom-domain my-foundry\n\n# Get endpoint and keys\naz cognitiveservices account show -n my-foundry -g rg-ai --query properties.endpoint\naz cognitiveservices account keys list -n my-foundry -g rg-ai\naz cognitiveservices account keys regenerate -n my-foundry -g rg-ai --key-name key1\n\n# Deploy a model\naz cognitiveservices account deployment create -n my-foundry -g rg-ai \\\n  --deployment-name gpt-41 --model-name gpt-4.1 --model-version 2025-04-14 \\\n  --model-format OpenAI --sku-name GlobalStandard --sku-capacity 50\n\n# Azure AI Search\naz search service create -n my-search -g rg-ai --sku basic -l swedencentral\n\n# Managed identity + role\naz webapp identity assign -n my-app -g rg-ai\naz role assignment create --assignee <principal-id> --role \"Azure AI User\" --scope <resource-id>\n\n# Azure Developer CLI\nazd init --template <template-name>\nazd up        # provision + deploy\nazd down      # clean everything up again"}],
cfg:["<b>--kind</b>: <code>AIServices</code> (Foundry, all-in-one), or a single service such as <code>TextAnalytics</code> (Language), <code>SpeechServices</code>, <code>ComputerVision</code>, <code>FormRecognizer</code> (Document Intelligence), <code>ContentSafety</code>, <code>TextTranslation</code>.","<b>--sku</b>: <code>F0</code> = free (limited, one per subscription per service), <code>S0</code> = standard paid.","<b>--custom-domain</b>: required for Entra ID authentication and private endpoints.","<b>--sku-name</b> for deployments: <code>GlobalStandard</code>, <code>Standard</code>, <code>DataZoneStandard</code>, <code>ProvisionedManaged</code>, <code>GlobalProvisionedManaged</code>, <code>GlobalBatch</code>."],
traps:["<b>Read a command as a sentence:</b> <code>az</code> &lt;service&gt; <code>account</code> [&lt;part&gt;] &lt;verb&gt; <code>--details</code>, e.g. <code>az cognitiveservices account keys regenerate --key-name key1</code>. A Foundry resource is an <code>account</code>; keys and deployments are parts of it.","<b>Spot the fake command:</b> no <code>account</code> in it (<code>az cognitiveservices model deploy</code>), an invented verb (<code>regenerate-key</code>) or a service that doesn't exist (<code>az openai</code>) → wrong. <code>az ml</code> = Azure Machine Learning, not Foundry.","Roles are never assigned through <code>cognitiveservices</code>: always <code>az role assignment create</code>, for every Azure service.","<code>--sku-capacity</code>: Standard / GlobalStandard / DataZoneStandard = units of <b>1,000 TPM</b> (50 = 50,000 TPM). Provisioned = number of <b>PTUs</b>.","<code>keys regenerate</code> rotates a key. There are two (key1 and key2) so you can switch without downtime: move the app to key2, regenerate key1, move the app to the new key1, regenerate key2. Never regenerate the key the app is using.","azd: <code>azd provision</code> = infrastructure only, <code>azd deploy</code> = code only, <code>azd up</code> = both.","F0 does not exist for every service and has low limits. Not for production."],
rel:["resource","deployments","containers","security"]},

{id:"containers",p:"platform",t:"Docker containers (running locally)",s:"Foundry Tools on-premises or at the edge, with Eula, Billing and ApiKey",d:[1,4],
what:"<p>Several Foundry Tools can run as a <b>Docker container</b>: on your own server, in your own datacenter or on a device at the edge of the network (<b>edge</b>). The model then runs <b>locally</b>, so the data does not leave your network and latency is low.</p><p><b>Available as a container</b> (selection): Language (sentiment, key phrases, language detection, NER, PII, summarization, CLU), Speech (speech to text, custom speech, neural text to speech, language identification), Translator, Document Intelligence (Read, Layout, prebuilt models), Vision Read (OCR).</p><p><b>Two variants:</b></p><ul><li><b>Connected containers</b>: run locally, but send <b>billing data</b> to your Azure resource. So they need internet access now and then. The data itself does not go to Azure.</li><li><b>Disconnected containers</b>: run with no internet at all (for example on a ship or in a secured environment). They require an <b>approved application</b> and a <b>commitment tier</b> contract (prepaid volume).</li></ul>",
when:["'Data may not leave our own network / the factory' or 'low latency on-premises' → <b>container</b>.","'No internet connection possible' → <b>disconnected container</b> (with a commitment tier).","Normal cloud app → no container needed, just call the endpoint."],
code:[{l:"Start a container (sentiment example)",src:"docker run --rm -it -p 5000:5000 --memory 8g --cpus 1 \\\n  mcr.microsoft.com/azure-cognitive-services/textanalytics/sentiment:latest \\\n  Eula=accept \\\n  Billing=https://my-language.cognitiveservices.azure.com/ \\\n  ApiKey=<key-of-that-resource>"},
{l:"Then call it: local endpoint",src:"from azure.ai.textanalytics import TextAnalyticsClient\nfrom azure.core.credentials import AzureKeyCredential\n\n# The endpoint is now your own container, not Azure\nclient = TextAnalyticsClient(endpoint=\"http://localhost:5000\",\n                             credential=AzureKeyCredential(\"not-used\"))\nprint(client.analyze_sentiment([\"The service was great!\"])[0].sentiment)"}],
cfg:["Three <b>required</b> parameters for <code>docker run</code>:<br><code>Eula=accept</code> (accept the license)<br><code>Billing=&lt;endpoint-of-your-Azure-resource&gt;</code><br><code>ApiKey=&lt;key-of-that-resource&gt;</code>","Images live in the <b>Microsoft Container Registry</b>: <code>mcr.microsoft.com/azure-cognitive-services/...</code>.","Default port inside the container: <b>5000</b>. With <code>-p 5000:5000</code> you map it to your machine.","Memory and CPU according to the minimum requirements per container (<code>--memory</code>, <code>--cpus</code>).","Runs on: local Docker, Azure Container Instances, Azure Kubernetes Service, IoT Edge."],
traps:["Billing and ApiKey must belong to the <b>same</b> Azure resource, of the <b>right type</b> (Language container → Language or Foundry resource).","Without <code>Eula=accept</code> the container does not start.","Connected containers are not offline: they report usage for billing. Offline = disconnected.","Not every feature exists as a container. Generative models (GPT) do not run this way in a Foundry Tools container."],
rel:["cli","language","speechstt","docintel"]}
);

// ===== Responsible AI =====
N.push(
{id:"guardrails",p:"rai",t:"Guardrails & content filters",s:"Categories, severity levels, input/output, blocklists",d:[1,3],
what:"<p>Every model deployment and agent in Foundry has a <b>guardrail</b> (formerly: content filter configuration). It checks the <b>input</b> (prompt) and the <b>output</b> (completion) and blocks or annotates harmful content.</p><p><b>Four harm categories</b>, each with a <b>severity</b> level: <b>hate</b>, <b>sexual</b>, <b>violence</b>, <b>self-harm</b>. Severity: safe, low, medium, high. Per category you set the level from which content is blocked.</p><p><b>Extra checks:</b> Prompt Shields (jailbreak and indirect attacks), protected material (text and code), groundedness, PII detection, and <b>blocklists</b> (your own lists of banned words).</p>",
when:["Stricter or looser filtering than the default → create a <b>custom guardrail</b> and attach it to the deployment.","Block specific terms (competitor names, profanity) → <b>blocklist</b>.","Do not block, but flag for review → <b>annotate-only</b> mode.","Filters fully off → only after approval by Microsoft (<i>modified content filtering</i>)."],
cfg:["Threshold per category, separate for <b>input</b> and <b>output</b>: block from low / medium / high.","Default: blocks <b>medium and high</b>.","Action: <b>block</b> or <b>annotate</b>.","Attach the guardrail per <b>deployment</b> or per <b>agent</b>.","In the response: <code>content_filter_results</code> per category (filtered: true/false, severity). Blocked input returns HTTP 400 with code <code>content_filter</code>."],
traps:["A lower threshold (block from <b>low</b>) is <b>stricter</b>, not looser.","Filters apply to input and output. An answer can be cut off halfway with <code>finish_reason: content_filter</code>."],
rel:["promptshields","contentsafety","visualrai"]},

{id:"promptshields",p:"rai",t:"Prompt Shields",s:"Jailbreak (direct) and indirect prompt injection",d:[1,3],
what:"<p><b>Prompt injection</b> = someone tries to make the model ignore its rules.</p><ul><li><b>Direct (jailbreak / user prompt attack)</b>: the user types it themselves, such as 'Ignore all previous instructions'.</li><li><b>Indirect (document attack / XPIA, cross-prompt injection attack)</b>: the attack is hidden in content the model reads: a web page, email, document, tool result or <b>text in an image</b>.</li></ul><p><b>Prompt Shields</b> detects both and blocks them before the model answers. You turn it on in the guardrail, without changing code.</p><p>Extra technique against indirect attacks: <b>spotlighting</b>, clearly marking external content as 'data, not instructions'.</p>",
when:["'Ignore your instructions' / 'reveal system prompt' → <b>Prompt Shields</b> (user prompt attacks).","Agent reads emails/web pages/documents with hidden commands → <b>Prompt Shields for documents</b> (indirect attacks).","Image with text that tries to steer the model → indirect attack, also Prompt Shields."],
code:[{l:"Call it directly through Content Safety (REST)",src:"POST {endpoint}/contentsafety/text:shieldPrompt?api-version=2024-09-01\n{\n  \"userPrompt\": \"Ignore all previous instructions and ...\",\n  \"documents\": [\"<text from an email or web page>\"]\n}\n\n# Response:\n# { \"userPromptAnalysis\": { \"attackDetected\": true },\n#   \"documentsAnalysis\": [ { \"attackDetected\": false } ] }"}],
traps:["An extra sentence in the system prompt is not detection and is not watertight.","Groundedness ≠ Prompt Shields. Groundedness is about made-up answers, not about attacks."],
rel:["guardrails","contentsafety","visualrai"]},

{id:"contentsafety",p:"rai",t:"Azure AI Content Safety",s:"Standalone API: analyze text/images, groundedness, protected material",d:[1,3],
what:"<p>The same safety models as in the guardrails, but as a <b>standalone API</b> you call yourself. Useful for content that does <b>not</b> go through a Foundry model: forum posts, photos uploaded by users, or output from another system.</p><ul><li><b>Analyze text / Analyze image</b>: severity per category (hate, sexual, violence, self-harm).</li><li><b>Prompt Shields</b>: <code>text:shieldPrompt</code>.</li><li><b>Groundedness detection</b>: is the answer supported by the sources you passed in? It can also correct it.</li><li><b>Protected material detection</b>: known copyrighted text (song lyrics, articles) or code (from public repos) in output.</li><li><b>Custom categories</b>: train your own category with examples (for example 'advertising for competitors').</li></ul>",
when:["Moderating user-uploaded content (not through an LLM) → <b>Content Safety API</b>.","Detecting your own kind of unwanted content → <b>custom categories</b>.","Checking whether RAG answers match the sources → <b>groundedness detection</b>."],
code:[{l:"Analyze text (Python)",src:"from azure.ai.contentsafety import ContentSafetyClient\nfrom azure.ai.contentsafety.models import AnalyzeTextOptions\nfrom azure.identity import DefaultAzureCredential\n\nclient = ContentSafetyClient(\"https://my-foundry.cognitiveservices.azure.com/\",\n                             DefaultAzureCredential())\nresult = client.analyze_text(AnalyzeTextOptions(text=\"text from the user\"))\nfor c in result.categories_analysis:\n    print(c.category, c.severity)   # e.g. Hate 0, Violence 2"},
{l:"Analyze an image",src:"from azure.ai.contentsafety.models import AnalyzeImageOptions, ImageData\n\nwith open(\"upload.jpg\", \"rb\") as f:\n    req = AnalyzeImageOptions(image=ImageData(content=f.read()))\nresult = client.analyze_image(req)"}],
cfg:["Severity for text: 0-7 (returned as 0, 2, 4, 6 by default). For images: 0, 2, 4, 6.","Choose your own threshold in code: for example block if severity ≥ 4.","Package: <code>azure-ai-contentsafety</code>."],
traps:["Content Safety does not <b>remove</b> content. It returns scores. Your code decides what happens."],
rel:["guardrails","promptshields","evaluaties"]},

{id:"evaluaties",p:"rai",t:"Evaluations",s:"Measuring quality, safety and agent behavior with evaluators",d:[1,2],
what:"<p>An <b>evaluator</b> gives an answer a score. You run them on a <b>test set</b> (questions + expected answers/context) before going live, in your CI/CD pipeline and continuously on live traffic.</p><table><tr><th>Kind</th><th>Evaluators</th><th>Measures</th></tr><tr><td>RAG quality</td><td><b>Groundedness</b>, <b>Relevance</b>, Retrieval, Response Completeness</td><td>Does the model make things up? Does it answer the question? Does it retrieve the right chunks?</td></tr><tr><td>Text quality</td><td><b>Coherence</b>, <b>Fluency</b></td><td>Logically structured? Well written?</td></tr><tr><td>Compare with a reference</td><td><b>Similarity</b>, F1, BLEU, ROUGE, GLEU, METEOR</td><td>Does the answer look like the expected answer?</td></tr><tr><td>Safety</td><td>Violence, Sexual, Self-harm, Hate/Unfairness, <b>Indirect attack</b>, <b>Protected material</b>, Code vulnerability</td><td>Harmful output, vulnerabilities</td></tr><tr><td>Agents</td><td><b>Intent resolution</b>, <b>Task adherence</b>, <b>Tool call accuracy</b></td><td>Did the agent understand the request, follow the task, pick the right tools?</td></tr></table><p><b>AI-assisted</b> evaluators use an LLM as the judge (<i>LLM-as-a-judge</i>). <b>NLP metrics</b> (F1, BLEU) calculate word overlap and need a reference answer.</p><p><b>AI Red Teaming Agent</b>: attacks your app automatically (based on PyRIT) to find weaknesses.</p>",
when:["Detecting made-up answers (fabrications) → <b>Groundedness</b>.","Does it answer the question? → <b>Relevance</b>.","Agent picks the wrong tools → <b>Tool call accuracy</b>.","Comparing two models or prompts → same test set, same evaluators, scores side by side.","Finding weaknesses before going live → <b>red teaming</b>."],
code:[{l:"Evaluate with azure-ai-evaluation",src:"from azure.ai.evaluation import GroundednessEvaluator, RelevanceEvaluator, evaluate\n\nmodel_config = {\n    \"azure_endpoint\": \"https://my-foundry.openai.azure.com/\",\n    \"azure_deployment\": \"gpt-41\",   # the 'judge model'\n}\ngroundedness = GroundednessEvaluator(model_config)\nrelevance = RelevanceEvaluator(model_config)\n\n# Score a single answer\nprint(groundedness(query=\"How many vacation days?\",\n                   context=\"Employees have 25 vacation days.\",\n                   response=\"You have 30 vacation days.\"))   # low score\n\n# A whole test set (JSONL with query/context/response per line)\nresult = evaluate(\n    data=\"testset.jsonl\",\n    evaluators={\"groundedness\": groundedness, \"relevance\": relevance},\n)"}],
cfg:["Scores of AI-assisted evaluators: usually 1-5, with a threshold (for example ≥ 3 = pass).","Safety evaluators need a Foundry project (<code>azure_ai_project</code>) instead of your own judge model.","Test data as <b>JSONL</b> (one JSON object per line)."],
traps:["BLEU/ROUGE/F1 need a <b>ground truth</b> (reference answer). Groundedness needs <b>context</b>.","Fluency measures language, not correctness. A fluent answer can be completely made up."],
rel:["agenteval","cicd","monitoring","contentsafety"]},

{id:"governance",p:"rai",t:"Agent governance & auditing",s:"Oversight, approvals, tool access, trace logs, provenance",d:[1,2],
what:"<p>How do you stay in control of agents that make their own decisions?</p><ul><li><b>Oversight modes</b>: how much may the agent do on its own? Fully autonomous, semi-autonomous (permission needed for risky actions) or only make suggestions.</li><li><b>Approval workflows / human-in-the-loop</b>: a human approves a tool call before it runs.</li><li><b>Tool-access controls</b>: per agent only the tools it needs (<b>least privilege</b>), with limited permissions per tool.</li><li><b>Constraints</b>: hard limits in code (amounts, counts), not just in the prompt.</li><li><b>Auditing</b>: <b>trace logging</b> of every step, <b>provenance metadata</b> (where information came from, which model/agent version), and who approved what.</li><li><b>Agent identity</b>: agents get their own Entra identity, so you can manage their permissions separately and see what they did.</li></ul>",
when:["Money, deleting data, sending email → <b>approval before execution</b>.","Being able to show afterwards what the agent did and why → <b>tracing + audit logs + provenance</b>.","Agent may only read, not write → <b>limit the permissions of the tool/identity</b>."],
traps:["'Reliably enforce' never means 'put it in the prompt'. The answer is always code, configuration or an approval flow."],
rel:["hitl","tracing","agentidentity"]},

{id:"raiprincipes",p:"rai",t:"Responsible AI principles",s:"Microsoft's 6 principles",d:[1],
what:"<ul><li><b>Fairness</b>: no unequal treatment of groups.</li><li><b>Reliability &amp; safety</b>: works as intended, also in edge cases.</li><li><b>Privacy &amp; security</b>: data protected, PII handled carefully.</li><li><b>Inclusiveness</b>: usable by everyone, including people with a disability (for example alt text).</li><li><b>Transparency</b>: clear that it is AI and how it works (transparency notes).</li><li><b>Accountability</b>: people stay responsible, with oversight.</li></ul><p>Approach in four steps: <b>identify</b> (find risks) → <b>measure</b> (evaluations) → <b>mitigate</b> (filters, prompts, UX) → <b>operate</b> (monitoring, incident plan).</p>",
when:["Question about which principle is violated: look for the key word (groups → fairness, explanation → transparency, human responsible → accountability)."],
rel:["guardrails","evaluaties","governance"]}
);

// ===== Generative AI apps =====
N.push(
{id:"sdk",p:"genai",t:"Foundry SDK & clients",s:"AIProjectClient, OpenAI client, Responses API, endpoints",d:[2],
what:"<p>Your app talks to Foundry through the <b>Foundry SDK</b>. In Python: the package <code>azure-ai-projects</code> (version 2.x) with <code>azure-identity</code> for signing in.</p><ul><li><b>AIProjectClient</b>: the main client, connected to your <b>project endpoint</b>. Gives access to agents, connections, deployments, evaluations.</li><li><b>get_openai_client()</b>: returns an OpenAI-compatible client for model calls.</li><li><b>Responses API</b> (<code>responses.create</code>): the modern API for models and agents, with built-in tools and conversation history.</li><li><b>Chat Completions API</b> (<code>chat.completions.create</code>): the older API with a list of <code>messages</code>. You still see it a lot.</li></ul><p><b>Two kinds of endpoints:</b> the <b>project endpoint</b> (<code>.services.ai.azure.com/api/projects/...</code>) for the SDK, and the <b>resource endpoint</b> (<code>.openai.azure.com</code> or <code>.cognitiveservices.azure.com</code>) for direct API calls to models or Foundry Tools.</p>",
when:["Connecting an app to a Foundry project → <b>AIProjectClient</b> with the project endpoint + <code>DefaultAzureCredential</code>.","Only calling a model → <code>get_openai_client()</code> + <code>responses.create</code>.","Follow-up question with memory → <code>previous_response_id</code> or a <b>conversation</b>."],
code:[{l:"Call a model (current quickstart, SDK 2.x)",src:"# pip install \"azure-ai-projects>=2.3.0\" azure-identity\nfrom azure.identity import DefaultAzureCredential\nfrom azure.ai.projects import AIProjectClient\n\nproject = AIProjectClient(\n    endpoint=\"https://my-foundry.services.ai.azure.com/api/projects/customer-service\",\n    credential=DefaultAzureCredential(),\n)\nopenai = project.get_openai_client()\n\nresponse = openai.responses.create(\n    model=\"gpt-5-mini\",            # = the DEPLOYMENT name\n    input=\"What is the capital of France?\",\n)\nprint(response.output_text)\n\n# Follow-up question that remembers the previous one\nresponse2 = openai.responses.create(\n    model=\"gpt-5-mini\",\n    input=\"And how many people live in that city?\",\n    previous_response_id=response.id,\n)"},
{l:"Chat Completions (older style)",src:"completion = openai.chat.completions.create(\n    model=\"gpt-41\",\n    messages=[\n        {\"role\": \"system\", \"content\": \"You are a helpful HR assistant.\"},\n        {\"role\": \"user\", \"content\": \"How many vacation days do I have?\"},\n    ],\n    temperature=0.2,\n)\nprint(completion.choices[0].message.content)"},
{l:"Directly with the OpenAI library (keyless)",src:"from openai import OpenAI\nfrom azure.identity import DefaultAzureCredential, get_bearer_token_provider\n\ntoken_provider = get_bearer_token_provider(\n    DefaultAzureCredential(), \"https://cognitiveservices.azure.com/.default\")\n\nclient = OpenAI(base_url=\"https://my-foundry.openai.azure.com/openai/v1/\",\n                api_key=token_provider)"}],
cfg:["Environment variables: do not hardcode the project endpoint and deployment name.","Token scope: <code>https://cognitiveservices.azure.com/.default</code> (resource) or <code>https://ai.azure.com/.default</code> (project API).","Role for the app identity: <b>Azure AI User</b> on the project or the resource."],
traps:["<code>model=</code> is the <b>deployment name</b>.","SDK 2.x is not compatible with 1.x. In 1.x you created agents with <code>create_agent</code> + threads + runs. In 2.x with <code>create_version</code> + conversations + responses.","<code>response.output_text</code> (Responses) vs. <code>choices[0].message.content</code> (Chat Completions)."],
rel:["parameters","structured","agentservice","security"]},

{id:"parameters",p:"genai",t:"Generation parameters",s:"temperature, top_p, max tokens, seed, stop, penalties, reasoning_effort",d:[2],
what:"<table><tr><th>Parameter</th><th>What it does</th><th>Typical value</th></tr><tr><td><b>temperature</b></td><td>Randomness. 0 = always the most likely word, higher = more creative</td><td>0-0.3 for facts/extraction, 0.7-1 for creative work</td></tr><tr><td><b>top_p</b></td><td>Only the top words that together make up p% probability are considered</td><td>1 (default). Change either temperature or top_p, not both</td></tr><tr><td><b>max_tokens</b> / <b>max_output_tokens</b></td><td>Maximum length of the answer</td><td>As low as reasonable</td></tr><tr><td><b>seed</b></td><td>Fixed starting number for the randomness: (almost) the same answer for the same input</td><td>e.g. 42</td></tr><tr><td><b>stop</b></td><td>Stops as soon as this text appears</td><td>e.g. <code>[\"\\n\\n\"]</code></td></tr><tr><td><b>frequency_penalty</b></td><td>Penalizes words that are repeated often</td><td>0-1 against repetition</td></tr><tr><td><b>presence_penalty</b></td><td>Penalizes words that already appeared, encourages new topics</td><td>0-1 for more variety</td></tr><tr><td><b>reasoning_effort</b></td><td>Reasoning models only: how much thinking</td><td>low / medium / high</td></tr><tr><td><b>tool_choice</b></td><td>May/must the model use a tool</td><td>auto / required / none / a specific tool</td></tr></table>",
when:["Same question → same answer → <b>temperature 0</b> (+ <b>seed</b>).","Answers too long or too expensive → lower <b>max_output_tokens</b>.","Model repeats itself → raise <b>frequency_penalty</b>.","Complex planning/math → reasoning model with <b>reasoning_effort: high</b>."],
traps:["Higher temperature = more made-up content, not less.","Reasoning models often do not support temperature/top_p.","Parameters do not fix missing knowledge. Missing facts → RAG."],
rel:["prompting","structured","modelkeuze"]},

{id:"prompting",p:"genai",t:"Prompt engineering",s:"System message, few-shot, chain-of-thought, grounding instructions",d:[2],
what:"<ul><li><b>System message / instructions</b>: role, tone, rules and limits. 'You are an HR assistant. Answer only from the sources. If you don't know, say so.'</li><li><b>Zero-shot</b>: only the task. <b>Few-shot</b>: add 2-5 examples of input → desired output. Helps with a fixed format or a tricky classification.</li><li><b>Chain-of-thought (CoT)</b>: let the model reason step by step first. Better for arithmetic and logic.</li><li><b>Grounding instructions</b>: 'Use only the context below. Cite the source.'</li><li><b>Delimiters</b>: put context between, for example, <code>###</code> or XML tags, so the model keeps data and instructions apart.</li><li><b>Output instruction</b>: format, length, language.</li></ul>",
when:["Model answers in the wrong format → <b>few-shot examples</b> or structured outputs.","Model makes things up beyond the sources → <b>grounding instruction</b> + RAG + groundedness evaluation.","Calculation errors in multistep problems → <b>chain-of-thought</b> or a reasoning model."],
traps:["Prompt engineering is always the first and cheapest step, before RAG and fine-tuning.","An instruction in the prompt is not security (see Prompt Shields and approvals)."],
rel:["parameters","rag","reflection"]},

{id:"structured",p:"genai",t:"Structured outputs & function calling",s:"Enforcing a JSON schema, letting the model make your code do something",d:[2,4],
what:"<p><b>Structured outputs</b>: you pass a <b>JSON schema</b> and the model is <b>guaranteed</b> to return JSON that matches it (with <code>strict: true</code>). Useful for extraction and for systems that process the output automatically.</p><p><b>JSON mode</b> (<code>{\"type\": \"json_object\"}</code>) only guarantees valid JSON, not your fields.</p><p><b>Function calling</b>: you describe functions (name, description, parameters as a JSON schema). The model decides when a function is needed and returns the <b>arguments</b>. <b>Your code runs the function</b> and sends the result back, after which the model writes the final answer.</p>",
when:["A downstream system parses the output → <b>structured outputs</b> with a schema.","Pulling entities/fields out of text as JSON → structured outputs.","The model has to fetch live data or take an action in your own code → <b>function calling</b>."],
code:[{l:"Structured output (Responses API)",src:"response = openai.responses.create(\n    model=\"gpt-41\",\n    input=\"Ticket: 'My invoice is wrong, I was charged twice.'\",\n    text={\"format\": {\n        \"type\": \"json_schema\",\n        \"name\": \"ticket\",\n        \"strict\": True,\n        \"schema\": {\n            \"type\": \"object\",\n            \"properties\": {\n                \"category\": {\"type\": \"string\", \"enum\": [\"billing\", \"technical\", \"account\"]},\n                \"urgent\": {\"type\": \"boolean\"},\n            },\n            \"required\": [\"category\", \"urgent\"],\n            \"additionalProperties\": False,\n        },\n    }},\n    temperature=0,\n)\nprint(response.output_text)   # {\"category\":\"billing\",\"urgent\":false}"},
{l:"Function calling (flow)",src:"tools = [{\n    \"type\": \"function\",\n    \"name\": \"get_order_status\",\n    \"description\": \"Get the current status of an order\",\n    \"parameters\": {\"type\": \"object\",\n                   \"properties\": {\"order_id\": {\"type\": \"string\"}},\n                   \"required\": [\"order_id\"]},\n}]\nr = openai.responses.create(model=\"gpt-41\", input=\"Where is order 48213?\", tools=tools)\n\nfor item in r.output:\n    if item.type == \"function_call\":\n        args = json.loads(item.arguments)          # {\"order_id\": \"48213\"}\n        result = get_order_status(**args)          # YOUR code\n        r = openai.responses.create(\n            model=\"gpt-41\", previous_response_id=r.id,\n            input=[{\"type\": \"function_call_output\",\n                    \"call_id\": item.call_id,\n                    \"output\": json.dumps(result)}],\n            tools=tools)\nprint(r.output_text)"}],
cfg:["<code>strict: true</code> + <code>additionalProperties: false</code> + all fields in <code>required</code>.","<code>enum</code> to fix the allowed values.","Combine with <b>temperature 0</b> for consistency."],
traps:["'Respond in JSON' in the prompt is a request, not a guarantee.","With function calling the <b>model</b> runs nothing. It only says <i>what</i> should be run."],
rel:["parameters","tools","llmtekst"]},

{id:"rag",p:"genai",t:"RAG (retrieval-augmented generation)",s:"Retrieving your own data and basing the answer on it",d:[2,5],
what:"<p><b>RAG</b>: before answering, first retrieve relevant chunks from your own data and send them along. The model bases its answer on them (<b>grounding</b>), with citations.</p><p><b>Two phases:</b></p><ol><li><b>Ingestion</b> (up front): bring documents in → extract the text (OCR/layout) → split it into pieces (<b>chunking</b>) → create <b>embeddings</b> → store them in an <b>index</b>.</li><li><b>Query</b> (per question): question → search the index (preferably <b>hybrid + semantic ranker</b>) → top chunks into the prompt → the model answers with sources.</li></ol><p><b>In Foundry there are three ways:</b> build it yourself with Azure AI Search + the SDK; an agent with the <b>Azure AI Search tool</b> or <b>file search</b>; or <b>agentic retrieval</b> through a knowledge base (Foundry IQ).</p>",
when:["Your own/current/company data + made-up answers → <b>RAG</b>.","Data changes often → RAG (update the index), not fine-tuning.","Answers must cite sources → RAG with citations."],
code:[{l:"Minimal RAG flow",src:"# 1. Retrieve\nresults = search_client.search(search_text=question, vector_queries=[vq],\n                                query_type=\"semantic\",\n                                semantic_configuration_name=\"default\", top=5)\ncontext = \"\\n\\n\".join(f\"[{r['title']}] {r['content']}\" for r in results)\n\n# 2. Generate with a grounding instruction\nresponse = openai.responses.create(\n    model=\"gpt-41\",\n    instructions=\"Answer only from the sources. Cite the source in []. \"\n                 \"If it is not in there, say you don't know.\",\n    input=f\"Sources:\\n{context}\\n\\nQuestion: {question}\",\n    temperature=0,\n)"}],
cfg:["<b>Chunk size</b>: often 500-1000 tokens with 10-20% <b>overlap</b>, so context does not break in the middle of a sentence.","<b>top / k</b>: how many chunks to send (more = more expensive, not always better).","<b>Embedding model</b> at indexing = embedding model at query time (same dimensions)."],
traps:["Fine-tuning does not teach current facts. That is what RAG is for.","Bad answers often come from bad <b>retrieval</b>, not from the model. Measure both (retrieval and groundedness evaluation)."],
rel:["searchquery","index","embeddings","toolsknowledge","agenticretrieval"]},

{id:"embeddings",p:"genai",t:"Embeddings & vectors",s:"Meaning as numbers, cosine similarity, dimensions",d:[2,5],
what:"<p>An <b>embedding</b> is a list of numbers (a <b>vector</b>) that captures the meaning of text (or an image). Texts with a similar meaning get vectors that are close together. 'Distance' is usually measured with <b>cosine similarity</b>.</p><p>Models: <b>text-embedding-3-small</b> (1536 dimensions, cheap) and <b>text-embedding-3-large</b> (3072 dimensions, more accurate). With these models you can reduce the dimensions with the <code>dimensions</code> parameter.</p>",
when:["Searching by meaning, recommendations, clustering, finding duplicates → embeddings.","Images and text in the same search space → multimodal embeddings."],
code:[{l:"Create an embedding",src:"emb = openai.embeddings.create(model=\"text-embedding-3-small\",\n                               input=\"How do I reset the device?\")\nvector = emb.data[0].embedding   # list of 1536 numbers"}],
cfg:["Vector field in the index: <b>dimensions</b> = exactly the number your model returns (for example 1536)."],
traps:["Index with 1536 dimensions + a model that returns 3072 = error. The dimensions must match.","Embeddings are not a chat model. They do not generate text."],
rel:["index","searchquery","rag"]},

{id:"reflection",p:"genai",t:"Workflows, reflection & orchestration",s:"Multistep pipelines, self-critique, multiple models, LLM + rules",d:[2],
what:"<ul><li><b>Multistep reasoning pipeline</b>: split a task into steps (classify → retrieve → answer → check), each with its own prompt or model.</li><li><b>Reflection / self-critique loop</b>: the model (or a second model) judges its own answer against criteria and improves it. 'Check whether every fact is in the sources. Rewrite if it is not.'</li><li><b>Chain-of-thought evaluation</b>: judging the reasoning itself, not just the outcome.</li><li><b>Orchestrating multiple models</b>: a cheap model for routing/classification, a heavy model for the hard question. Or let the <b>model router</b> choose.</li><li><b>Hybrid LLM + rules engine</b>: hard business rules (amounts, legislation, calculations) in regular code. The LLM handles language and interpretation.</li></ul>",
when:["Answers contain errors the model could spot itself → <b>self-critique loop</b>.","Deterministic rules (calculating VAT, limits) → <b>rules engine in code</b>, not the LLM.","Lower cost without losing quality → a small model routes, a large model only where needed."],
traps:["Never leave arithmetic and hard rules to the LLM if it has to be reliable."],
rel:["multiagent","prompting","kosten"]},

{id:"finetuning",p:"genai",t:"Fine-tuning",s:"SFT, DPO, RFT, distillation: when to use it and when not",d:[2,1],
what:"<p><b>Fine-tuning</b> = training an existing model further on your own examples. It changes <b>behavior, style and format</b>, not knowledge that has to stay current.</p><ul><li><b>SFT</b> (supervised fine-tuning): examples of a question + the ideal answer.</li><li><b>DPO</b> (direct preference optimization): examples of a better and a worse answer.</li><li><b>RFT</b> (reinforcement fine-tuning): a grader gives points, for reasoning models.</li><li><b>Distillation</b>: training a small model on the answers of a large model, so it becomes small + cheap + good enough.</li></ul>",
when:["Fixed writing style, tone or complex format that prompts do not enforce well → fine-tuning.","Lower cost: let a small model learn from a large one → <b>distillation</b>.","Current facts or documents → <b>do not</b> fine-tune; use RAG."],
cfg:["Training data in <b>JSONL</b> (chat format: messages with system/user/assistant).","Deploying a trained model: Standard, Global Standard or <b>Developer</b> (for testing)."],
traps:["Order on the exam: prompt engineering → RAG → fine-tuning."],
rel:["rag","modelkeuze","prompting"]}
);

// ===== Agents =====
N.push(
{id:"agentservice",p:"agents",t:"Foundry Agent Service",s:"Prompt agents, versions, conversations, responses",d:[2],
what:"<p>The <b>Foundry Agent Service</b> hosts and runs agents for you. An agent consists of: <b>model</b> + <b>instructions</b> (role, goal, rules) + <b>tools</b> + conversation history.</p><ul><li><b>Prompt agent</b>: defined declaratively (model, instructions, tools). The service runs the loop of reasoning and calling tools.</li><li><b>Hosted agent</b>: your own agent code (for example Microsoft Agent Framework or LangGraph) in a container, hosted by Foundry.</li><li><b>Workflow</b>: several agents and steps in a fixed or dynamic order (see Multi-agent).</li></ul><p>Every change creates a new <b>version</b> (<code>create_version</code>). A <b>conversation</b> keeps the history of a chat across multiple turns.</p><p><b>Classic</b> (SDK 1.x, still in older material): <code>create_agent</code> → <b>thread</b> → <b>message</b> → <b>run</b>.</p>",
when:["Assistant that picks its own tools and takes several steps → <b>agent</b>.","One fixed question-answer step without tools → a plain model call is enough.","Hosting existing agent code (LangGraph, Agent Framework) → <b>hosted agent</b>."],
code:[{l:"Create an agent and chat with it (SDK 2.x)",src:"from azure.ai.projects.models import PromptAgentDefinition\n\nagent = project.agents.create_version(\n    agent_name=\"hr-assistant\",\n    definition=PromptAgentDefinition(\n        model=\"gpt-5-mini\",\n        instructions=\"You answer HR questions based on the handbook. \"\n                     \"If you don't know, refer people to hr@company.com.\",\n        tools=[],            # see Tools\n    ),\n)\n\n# OpenAI client bound to this agent\nopenai = project.get_openai_client(agent_name=\"hr-assistant\")\nconversation = openai.conversations.create()   # memory for this conversation\n\nr1 = openai.responses.create(conversation=conversation.id,\n                             input=\"How many vacation days do I have?\")\nr2 = openai.responses.create(conversation=conversation.id,\n                             input=\"And can I carry them over to next year?\")\nprint(r2.output_text)"},
{l:"Classic (SDK 1.x): threads and runs",src:"agent = project_client.agents.create_agent(model=\"gpt-4o\", name=\"hr\",\n                                          instructions=\"...\")\nthread = project_client.agents.threads.create()\nproject_client.agents.messages.create(thread_id=thread.id, role=\"user\",\n                                      content=\"How many vacation days?\")\nrun = project_client.agents.runs.create_and_process(thread_id=thread.id,\n                                                    agent_id=agent.id)"}],
cfg:["<b>Basic setup</b>: Microsoft manages the storage (quick start).","<b>Standard setup</b>: you connect your own <b>Cosmos DB</b> (conversations), <b>Storage</b> (files) and <b>AI Search</b> (vector stores). For data isolation, compliance and your own network.","Agent instructions: role, goal, limits, when to use which tool, what to do when in doubt."],
traps:["Instructions are not security. Limits that really have to hold → approvals and tool permissions."],
rel:["tools","memory","multiagent","hitl","agentsetup"]},

{id:"agentsetup",p:"agents",t:"Agent setup: basic vs. standard",s:"Where do conversations, files and vectors live?",d:[1,2],
