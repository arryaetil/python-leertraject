<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Foundry-kaart AI-103</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6; --line:#e3e6eb; --line-strong:#cfd4dc;
  --text:#16191f; --text-2:#4a5260; --text-3:#6b7382;
  --accent:#2557d6; --accent-soft:#e8eefc; --accent-text:#1d47b3;
  --ok:#1f7a4d; --ok-soft:#e5f4ec; --warn:#a14a12; --warn-soft:#fbefe4;
  --d1:#2f62c9; --d2:#0f7f74; --d3:#a8620a; --d4:#b03a5b; --d5:#4a7a1f;
  --code-bg:#f3f5f8; --code-text:#1e2430; --code-com:#6b7382;
  --shadow:0 1px 2px rgba(22,25,31,.05),0 4px 16px rgba(22,25,31,.04);
  --r:10px; --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111318; --surface:#181b21; --surface-2:#1f232a; --line:#2a2f38; --line-strong:#3a404b;
  --text:#e8eaee; --text-2:#b4bac5; --text-3:#8a919e;
  --accent:#6b95f2; --accent-soft:#1e2a45; --accent-text:#9db8f7;
  --ok:#5cc28d; --ok-soft:#173326; --warn:#e79a5b; --warn-soft:#3a2617;
  --d1:#6b95f2; --d2:#3dbcae; --d3:#e0a245; --d4:#e27a97; --d5:#8fbf5c;
  --code-bg:#14171c; --code-text:#d9dde4; --code-com:#7d8592;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#111318; --surface:#181b21; --surface-2:#1f232a; --line:#2a2f38; --line-strong:#3a404b;
  --text:#e8eaee; --text-2:#b4bac5; --text-3:#8a919e;
  --accent:#6b95f2; --accent-soft:#1e2a45; --accent-text:#9db8f7;
  --ok:#5cc28d; --ok-soft:#173326; --warn:#e79a5b; --warn-soft:#3a2617;
  --d1:#6b95f2; --d2:#3dbcae; --d3:#e0a245; --d4:#e27a97; --d5:#8fbf5c;
  --code-bg:#14171c; --code-text:#d9dde4; --code-com:#7d8592;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent-text)}
code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:.05em .35em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:14px;padding:10px 20px;max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap;cursor:pointer;background:none;border:0;padding:4px 2px}
.brand b{font-size:16px;letter-spacing:-.01em}
.brand span{color:var(--text-3);font-size:13px}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;height:38px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);border-radius:9px;padding:0 64px 0 36px;font:inherit;font-size:14px}
.search input::placeholder{color:var(--text-3)}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--text-3)}
.search kbd{position:absolute;right:9px;top:8px;font:12px var(--mono);color:var(--text-3);border:1px solid var(--line-strong);border-radius:5px;padding:1px 6px;background:var(--surface-2)}
.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);white-space:nowrap}
.progress .bar{width:90px;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.progress .bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.iconbtn{height:36px;min-width:36px;border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:13px;color:var(--text-2)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:16px;height:16px}
.menu-btn{display:none}

.filters{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 10px;max-width:1500px;margin:0 auto;align-items:center}
.filters .lbl{font-size:12px;color:var(--text-3);margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:none;height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line-strong);background:var(--surface);font-size:12.5px;cursor:pointer;color:var(--text-2)}
.chip .sw{width:8px;height:8px;border-radius:2px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.chip.clear{border-style:dashed}

/* Layout */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1500px;margin:0 auto;min-height:calc(100vh - 110px)}
.side{border-right:1px solid var(--line);padding:14px 10px 40px 14px;position:sticky;top:104px;align-self:start;max-height:calc(100vh - 104px);overflow:auto}
.main{padding:28px 36px 80px;min-width:0}

/* Tree */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:13px;padding-left:9px;border-left:1px solid var(--line)}
.tree li{margin:1px 0}
.row{display:flex;align-items:center;gap:2px}
.tog{width:22px;height:26px;border:0;background:none;cursor:pointer;color:var(--text-3);display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:5px}
.tog:hover{background:var(--surface-2)}
.tog svg{width:12px;height:12px;transition:transform .15s}
.tog[aria-expanded="true"] svg{transform:rotate(90deg)}
.tog.leaf{visibility:hidden}
.node{flex:1;min-width:0;text-align:left;border:0;background:none;cursor:pointer;padding:4px 8px;border-radius:7px;font-size:13.5px;color:var(--text-2);display:flex;align-items:center;gap:8px}
.node:hover{background:var(--surface-2);color:var(--text)}
.node.active{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.node .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .done{margin-left:auto;width:14px;height:14px;color:var(--ok);flex:none}
.tree>li>.row .node{font-weight:600;color:var(--text);font-size:14px}
.tree>li{margin-bottom:4px}

/* Overview */
.hero h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:0 0 8px}
.hero p{color:var(--text-2);max-width:68ch;margin:0 0 6px}
.domains{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:22px 0 28px}
.dom{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.dom .pct{font:600 13px var(--mono);color:var(--text-3)}
.dom .nm{font-weight:600;font-size:14px;margin-top:2px}
.dom .meter{height:4px;border-radius:4px;margin-top:10px;background:var(--surface-2);overflow:hidden}
.dom .meter i{display:block;height:100%}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.gcard.feature{grid-column:1/-1;background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.gcard h3{margin:0;font-size:16px;letter-spacing:-.01em}
.gcard h3 button{all:unset;cursor:pointer}
.gcard h3 button:hover{color:var(--accent-text)}
.gcard h3 button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.gcard p{margin:0;color:var(--text-2);font-size:13.5px}
.gcard .kids{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.kid{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:3px 9px;font-size:12.5px;cursor:pointer;color:var(--text-2)}
.kid:hover{border-color:var(--accent);color:var(--accent-text)}
.kid.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));color:var(--ok)}
.gfoot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px;font-size:12px;color:var(--text-3)}
.dtags{display:flex;gap:5px}
.dtag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-2);border:1px solid var(--line);border-radius:99px;padding:1px 8px;background:var(--surface)}
.dtag i{width:7px;height:7px;border-radius:2px;display:inline-block}

/* Detail */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--text-3);margin-bottom:10px}
.crumbs button{border:0;background:none;padding:0;cursor:pointer;color:var(--text-3)}
.crumbs button:hover{color:var(--accent-text);text-decoration:underline}
.dhead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.dhead h1{font-size:27px;line-height:1.2;letter-spacing:-.02em;margin:0 0 4px}
.dhead .sub{color:var(--text-2);margin:0 0 10px}
.know{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:13.5px;color:var(--text-2);white-space:nowrap}
.know svg{width:16px;height:16px}
.know[aria-pressed="true"]{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 50%,var(--line));color:var(--ok);font-weight:600}
.know:active,.iconbtn:active,.chip:active{transform:translateY(1px)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec>h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin:0 0 10px;font-weight:600}
.sec p{margin:0 0 10px;max-width:80ch}
.sec p:last-child{margin-bottom:0}
.sec ul,.sec ol{margin:0;padding-left:20px}
.sec li{margin:4px 0}
.sec table{width:100%;border-collapse:collapse;font-size:13.5px;margin:4px 0 2px}
.sec th{text-align:left;font-weight:600;color:var(--text-2);background:var(--surface-2);padding:8px 10px;border-bottom:1px solid var(--line)}
.sec td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.sec tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.sec.when{border-left:3px solid var(--accent)}
.sec.cfg{border-left:3px solid var(--d2)}
.sec.trap{border-left:3px solid var(--warn);background:linear-gradient(90deg,var(--warn-soft),var(--surface) 60%)}
.sec.trap h2{color:var(--warn)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols .sec{margin-bottom:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tab{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--text-2)}
.tab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.codebox{position:relative}
.codebox pre{margin:0;background:var(--code-bg);color:var(--code-text);border:1px solid var(--line);border-radius:9px;padding:14px 16px;overflow:auto;font:12.8px/1.6 var(--mono);tab-size:4}
.codebox .com{color:var(--code-com);font-style:italic}
.copy{position:absolute;top:8px;right:8px;height:28px;font-size:12px;padding:0 9px}
.subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.subcard{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.subcard:hover{border-color:var(--accent)}
.subcard b{font-size:14px}
.subcard span{font-size:12.5px;color:var(--text-2)}
.subcard .ok{color:var(--ok);font-size:12px;font-weight:600}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.pager button{flex:1;max-width:48%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer}
.pager button:hover{border-color:var(--accent)}
.pager small{display:block;color:var(--text-3);font-size:12px}
.pager .next{text-align:right;margin-left:auto}

/* Results */
.results h1{font-size:22px;margin:0 0 14px}
.res{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;margin-bottom:8px;cursor:pointer}
.res:hover{border-color:var(--accent)}
.res .path{font-size:12px;color:var(--text-3)}
.res b{font-size:15px}
.res p{margin:3px 0 0;font-size:13px;color:var(--text-2)}
mark{background:color-mix(in srgb,var(--d3) 30%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.empty{border:1px dashed var(--line-strong);border-radius:12px;padding:28px;text-align:center;color:var(--text-2)}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.foot{color:var(--text-3);font-size:12px;margin-top:40px;border-top:1px solid var(--line);padding-top:14px}

@media (max-width:1100px){.domains{grid-template-columns:repeat(3,minmax(0,1fr))}.cols{grid-template-columns:1fr}}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .menu-btn{display:inline-flex}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);max-height:none;top:0;z-index:40;background:var(--surface);transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow);padding-top:18px}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none}
  .scrim.open{display:block}
  .main{padding:20px 16px 60px}
  .top-inner{padding:10px 16px;flex-wrap:wrap}
  .search{order:3;flex-basis:100%;max-width:none}
  .brand span,.progress .bar{display:none}
  .filters{padding:0 16px 10px;overflow-x:auto;flex-wrap:nowrap}
  .domains{grid-template-columns:1fr 1fr}
  .sec{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <button class="iconbtn menu-btn" id="menuBtn" aria-label="Onderwerpen tonen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button class="brand" id="home" aria-label="Naar overzicht"><b>Foundry-kaart</b><span>AI-103 · alles wat het examen vraagt</span></button>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Zoek dienst, begrip of instelling (bijv. PTU, mask, phrase list)" aria-label="Zoeken" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <div class="progress" title="Onderwerpen die je als 'snap ik' hebt gemarkeerd"><div class="bar"><i id="pbar"></i></div><span id="ptxt">0/0</span></div>
    <button class="iconbtn" id="theme" aria-label="Licht of donker thema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
  <div class="filters" id="filters" role="group" aria-label="Filter op examendomein"></div>
</header>
<div class="scrim" id="scrim"></div>
<div class="layout">
  <nav class="side" id="side" aria-label="Onderwerpen"><ul class="tree" id="tree"></ul></nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<script>
const N=[];
// ===== Groepen (laag 1) =====
N.push(
{id:"platform",p:null,t:"Foundry-platform",s:"Resource, projecten, modellen, deployments, security, monitoring",d:[1],ico:"▦",
what:"Het fundament: hoe Microsoft Foundry in Azure is opgebouwd, hoe je modellen kiest en uitrolt, hoe je het beveiligt en hoe je het in de gaten houdt. Dit is examendomein 1 <b>Plan &amp; manage</b> (25-30%).",
when:["Vragen over <b>welke resource</b>, <b>welk deploymenttype</b>, <b>welke rol</b>, <b>hoe monitoren</b> of <b>kosten verlagen</b>."]},
{id:"rai",p:null,t:"Responsible AI & guardrails",s:"Content filters, Prompt Shields, evaluaties, governance",d:[1,3],ico:"⛨",
what:"Alles om AI veilig, eerlijk en controleerbaar te maken: filters op input en output, aanvallen blokkeren, kwaliteit meten en mensen laten meekijken.",
when:["Vragen met <b>harmful content</b>, <b>jailbreak</b>, <b>fabrications</b>, <b>audit</b>, <b>approval</b> of <b>evaluate</b>."]},
{id:"genai",p:null,t:"Generatieve AI-apps",s:"SDK, parameters, prompts, structured output, RAG, fine-tuning",d:[2],ico:"✦",
what:"Apps bouwen die een taalmodel aanroepen: via de Foundry SDK, met de juiste parameters, prompts en output-formaten, en met RAG voor eigen data. Examendomein 2 (30-35%, het zwaarst).",
when:["Vragen over <b>model aanroepen</b>, <b>consistente output</b>, <b>eigen data</b>, <b>verzonnen antwoorden</b>."]},
{id:"agents",p:null,t:"Agents",s:"Agent Service, tools, memory, multi-agent, approvals",d:[2],ico:"◈",
what:"Een <b>agent</b> is een model met instructies, tools en geheugen dat zelf stappen kiest om een doel te bereiken. In Foundry bouw je die met de <b>Foundry Agent Service</b>.",
when:["Vragen met <b>agent</b>, <b>tool</b>, <b>conversation</b>, <b>multi-agent</b>, <b>orchestration</b>, <b>approval</b>."]},
{id:"search",p:null,t:"Azure AI Search",s:"Index, indexers, skills, vector/hybrid/semantic, agentic retrieval",d:[5,2],ico:"⌕",
what:"De zoekmachine achter RAG. Haalt content binnen (ingest), verrijkt die (skills), slaat hem op in een <b>index</b> en zoekt erin op woorden, betekenis of allebei.",
when:["Vragen over <b>indexeren</b>, <b>zoeken</b>, <b>grounding</b>, <b>vector/hybrid/semantic</b>, <b>OCR in een pipeline</b>."]},
{id:"docs",p:null,t:"Documenten & Content Understanding",s:"Analyzers, velden, OCR, layout, Document Intelligence",d:[5,3],ico:"▤",
what:"Ongestructureerde content (PDF's, scans, beeld, audio, video) omzetten naar <b>gestructureerde velden</b> of schone <b>markdown</b> voor agents en RAG.",
when:["Vragen met <b>extract fields</b>, <b>invoices</b>, <b>forms</b>, <b>layout</b>, <b>structured output from documents</b>."]},
{id:"vision",p:null,t:"Computer vision",s:"Multimodaal begrijpen, beeld/video genereren en bewerken, visuele RAI",d:[3],ico:"◐",
what:"Beelden en video <b>begrijpen</b> (beschrijven, vragen beantwoorden, objecten vinden) en <b>maken</b> (genereren, bewerken). Examendomein 3 (10-15%).",
when:["Vragen met <b>image</b>, <b>video</b>, <b>caption</b>, <b>alt-text</b>, <b>inpainting</b>, <b>mask</b>, <b>watermark</b>."]},
{id:"text",p:null,t:"Tekst & taal",s:"LLM-tekstanalyse, Azure Language, Translator",d:[4],ico:"¶",
what:"Tekst analyseren: entiteiten, sentiment, PII, samenvattingen, classificatie, vertaling. Met een LLM (via prompt) of met kant-en-klare <b>Foundry Tools</b> (Azure Language, Translator). Deel van domein 4 (10-15%).",
when:["Vragen met <b>sentiment</b>, <b>entities</b>, <b>PII</b>, <b>summarize</b>, <b>translate</b>, <b>classify text</b>."]},
{id:"speech",p:null,t:"Spraak",s:"Speech-to-text, text-to-speech, custom speech, vertaling, voice agents",d:[4],ico:"◉",
what:"Spraak omzetten naar tekst en andersom, spraak vertalen en spraak gebruiken als <b>modaliteit</b> (manier van communiceren) van een agent. Deel van domein 4.",
when:["Vragen met <b>transcribe</b>, <b>audio</b>, <b>voice</b>, <b>SSML</b>, <b>custom speech</b>, <b>real-time</b>."]},
{id:"kompas",p:null,t:"Examenkompas",s:"Keuzeregels: welk antwoord bij welke situatie",d:[1,2,3,4,5],ico:"✓",
what:"De snelle beslisregels per type vraag. Lees deze lijst elke dag. Elke regel linkt naar het onderwerp waar je de details vindt.",
when:["Gebruik dit vlak voor een oefentoets of het examen."]}
);

// ===== Foundry-platform =====
N.push(
{id:"resource",p:"platform",t:"Foundry resource & projecten",s:"De hiërarchie: resource → project → deployments, agents, connecties",d:[1],
what:"<p>De <b>Foundry resource</b> is de Azure-resource waarin alles draait (technisch: <code>Microsoft.CognitiveServices/accounts</code> met <code>kind: AIServices</code>). Eén resource geeft toegang tot modellen én alle <b>Foundry Tools</b> (de vroegere Azure AI services: Language, Speech, Vision, Translator, Content Understanding, Document Intelligence, Content Safety).</p><p>Binnen de resource maak je <b>projecten</b>: werkruimtes per team of app, met eigen agents, bestanden, evaluaties en connecties. Modellen deploy je op resourceniveau en ze zijn in alle projecten bruikbaar.</p><p><b>Hiërarchie:</b> subscription → resource group → Foundry resource → project(en).</p>",
when:["Nieuwe AI-app of agent opzetten → Foundry resource + project.","Teams scheiden die wel dezelfde modellen delen → meerdere projecten in één resource.","Volledig gescheiden facturering, netwerk of regio → aparte resources."],
code:[{l:"Project-endpoint (formaat)",src:"https://<resource-naam>.services.ai.azure.com/api/projects/<project-naam>"},
{l:"Aanmaken met Azure CLI",src:"az cognitiveservices account create \\\n  --name mijn-foundry --resource-group rg-ai \\\n  --kind AIServices --sku S0 --location swedencentral \\\n  --custom-domain mijn-foundry --allow-project-management\n\naz cognitiveservices account project create \\\n  --name mijn-foundry --resource-group rg-ai \\\n  --project-name klantenservice"},
{l:"Bicep (infrastructure as code)",src:"resource foundry 'Microsoft.CognitiveServices/accounts@2025-06-01' = {\n  name: 'mijn-foundry'\n  location: 'swedencentral'\n  kind: 'AIServices'\n  sku: { name: 'S0' }\n  identity: { type: 'SystemAssigned' }\n  properties: {\n    allowProjectManagement: true\n    customSubDomainName: 'mijn-foundry'\n    disableLocalAuth: true          // geen API-keys\n    publicNetworkAccess: 'Disabled' // alleen via private endpoint\n  }\n}\n\nresource project 'Microsoft.CognitiveServices/accounts/projects@2025-06-01' = {\n  parent: foundry\n  name: 'klantenservice'\n  location: 'swedencentral'\n  identity: { type: 'SystemAssigned' }\n  properties: {}\n}"}],
cfg:["<b>Regio</b>: bepaalt welke modellen en features beschikbaar zijn.","<b>customSubDomainName</b>: nodig voor Entra ID-authenticatie (keyless).","<b>disableLocalAuth: true</b>: zet API-keys uit.","<b>Managed identity</b> op resource en project: voor toegang tot Storage, Search enz."],
traps:["<b>Foundry (classic)</b> werkte met een <i>hub</i> + Azure ML-workspace. De nieuwe Foundry gebruikt de Foundry resource met projecten. Zie je 'hub' in een vraag, dan gaat het om de oude opzet.","Modellen deploy je op de <b>resource</b>, agents maak je in een <b>project</b>."],
rel:["deployments","security","connections","sdk"]},

{id:"modelkeuze",p:"platform",t:"Model kiezen",s:"LLM, SLM, multimodaal, reasoning, embeddings, Foundry Tools",d:[1,2],
what:"<p>De <b>model catalog</b> in Foundry bevat duizenden modellen. Op het examen moet je per taak het juiste type kiezen:</p><ul><li><b>LLM</b> (large language model), zoals GPT-4.1 of GPT-5: breed, sterk, duurder.</li><li><b>SLM</b> (small language model), zoals Phi-4 of mini/nano-varianten: goedkoop, snel, goed genoeg voor eenvoudige taken zoals classificeren.</li><li><b>Reasoning model</b> (o-serie, GPT-5 met reasoning): denkt eerst na, voor complexe meerstapsproblemen. Trager en duurder.</li><li><b>Multimodaal model</b>: begrijpt tekst + beeld (+ audio).</li><li><b>Embeddingmodel</b> (text-embedding-3-small/large): zet tekst om in vectoren voor zoeken.</li><li><b>Beeld/video-modellen</b>: gpt-image-1, Sora.</li><li><b>Foundry Tools</b>: gespecialiseerde diensten (Speech, Language, ...) als die precies de taak doen.</li></ul><p><b>Herkomst:</b> modellen <i>sold directly by Azure</i> (OpenAI, Phi, DeepSeek, Mistral e.a., met Microsoft-voorwaarden) en <i>partner/community</i>-modellen (via Marketplace).</p>",
when:["Eenvoudige taak, veel volume, kosten omlaag → <b>SLM</b>.","Complexe redenering, code, wiskunde, plannen → <b>reasoning model</b>.","Beeld + tekst samen → <b>multimodaal</b>.","Zoeken op betekenis → <b>embeddingmodel</b>.","Weet je niet welk model het beste is per vraag → <b>model router</b> (een deployment die per verzoek het passende model kiest).","Vergelijken → <b>benchmarks / leaderboards</b> in de catalog, daarna zelf evalueren op je eigen data."],
cfg:["Reasoning models: <code>reasoning_effort</code> (low/medium/high) in plaats van temperature.","Modelversie en <b>auto-update</b>-beleid per deployment.","Let op <b>model retirement</b>-data: oude versies worden uitgefaseerd."],
traps:["Groter is niet beter. Kost het te veel bij een simpele taak, dan is het antwoord vrijwel altijd een kleiner model.","Fine-tuning is zelden het eerste antwoord. Eerst promptengineering, dan RAG, dan pas fine-tuning."],
rel:["deployments","finetuning","kosten","embeddings"]},

{id:"deployments",p:"platform",t:"Deployments & deploymenttypes",s:"Standard, Global, Data Zone, Provisioned (PTU), Batch",d:[1],
what:"<p>Een <b>deployment</b> is een uitgerold model met een eigen naam waarop je app verzoeken stuurt. Het <b>deploymenttype</b> bepaalt waar het verzoek verwerkt wordt en hoe je betaalt.</p><table><tr><th>Type</th><th>Wat</th><th>Wanneer</th></tr><tr><td><b>Global Standard</b></td><td>Pay-per-token, verwerkt in elk Azure-datacenter wereldwijd</td><td>Standaardkeuze, hoogste quota</td></tr><tr><td><b>Data Zone Standard</b></td><td>Pay-per-token, verwerkt binnen een zone (EU of VS)</td><td>Data moet binnen de EU blijven</td></tr><tr><td><b>Standard</b> (regionaal)</td><td>Pay-per-token, in één regio</td><td>Data strikt in één regio</td></tr><tr><td><b>Provisioned</b> (Global / Data Zone / Regional)</td><td>Gereserveerde capaciteit in <b>PTU's</b>, vast bedrag per uur</td><td>Hoog en stabiel volume, voorspelbare latency</td></tr><tr><td><b>Global / Data Zone Batch</b></td><td>Asynchroon, resultaat binnen 24 uur, ~50% goedkoper</td><td>Grote hoeveelheden die niet direct hoeven</td></tr><tr><td><b>Developer</b></td><td>Voor het testen van fine-tuned modellen</td><td>Evaluatie, geen productie</td></tr></table>",
when:["Data mag de EU niet uit → <b>Data Zone</b> (EU).","Hoog stabiel verkeer + garantie / voorspelbare latency → <b>Provisioned (PTU)</b>.","Miljoenen documenten 's nachts verwerken, geen haast → <b>Batch</b>.","Wisselend of onvoorspelbaar verkeer → <b>Standard / Global Standard</b>."],
code:[{l:"Deployment aanmaken (CLI)",src:"az cognitiveservices account deployment create \\\n  --name mijn-foundry --resource-group rg-ai \\\n  --deployment-name gpt-41 \\\n  --model-name gpt-4.1 --model-version 2025-04-14 --model-format OpenAI \\\n  --sku-name GlobalStandard --sku-capacity 100   # 100 = 100K TPM"}],
cfg:["<b>SKU</b> = deploymenttype.","<b>Capacity</b>: bij Standard in eenheden van 1.000 TPM, bij Provisioned in PTU's.","<b>Deploymentnaam</b>: die gebruik je in je code als <code>model=</code>.","<b>Content filter / guardrail</b> wordt per deployment gekoppeld.","<b>Spillover</b>: bij Provisioned kun je overloop naar een Standard-deployment instellen voor pieken."],
traps:["In code gebruik je de <b>deploymentnaam</b>, niet per se de modelnaam.","Global = data kan buiten je regio verwerkt worden. Staat er 'data residency', kies dan Data Zone of Regional."],
rel:["quota","kosten","modelkeuze"]},

{id:"quota",p:"platform",t:"Quota, rate limits & 429",s:"TPM, RPM, HTTP 429, retry, schalen",d:[1],
what:"<p><b>Quota</b> = hoeveel capaciteit je per model, per regio, per subscription mag gebruiken. Gemeten in <b>TPM</b> (tokens per minute). Daaraan gekoppeld is <b>RPM</b> (requests per minute): ongeveer 6 RPM per 1.000 TPM.</p><p>Ga je over de limiet, dan krijg je <b>HTTP 429 Too Many Requests</b>, met een <code>retry-after</code>-header die zegt hoe lang je moet wachten.</p><p>Een <b>token</b> is een stukje tekst (ongeveer ¾ woord in het Engels, minder in het Nederlands). Zowel input als output telt mee, en ook <code>max_tokens</code> telt al mee bij de schatting.</p>",
when:["Af en toe 429 → <b>retry met exponential backoff</b> (1 s, 2 s, 4 s...).","Structureel 429 → <b>quota verhogen</b> (aanvragen) of capaciteit van de deployment verhogen.","Meer capaciteit dan één regio geeft → meerdere deployments + <b>load balancing</b> (bijv. via API Management als AI gateway).","Garantie nodig → <b>Provisioned</b>."],
code:[{l:"Retry met backoff (Python)",src:"import time\nfrom openai import RateLimitError\n\nfor poging in range(5):\n    try:\n        response = openai.responses.create(model=\"gpt-41\", input=vraag)\n        break\n    except RateLimitError:\n        time.sleep(2 ** poging)   # 1, 2, 4, 8, 16 seconden"}],
cfg:["Response-headers: <code>x-ratelimit-remaining-tokens</code>, <code>x-ratelimit-remaining-requests</code>.","<code>max_tokens</code> / <code>max_output_tokens</code> laag houden: een te hoge waarde 'reserveert' quota.","Azure Monitor-metrics: <i>Processed tokens</i>, <i>Requests</i>, <i>Throttled requests</i>."],
traps:["Een hogere <code>max_tokens</code> lost 429 niet op, maar maakt het erger.","Quota geldt per <b>subscription + regio + model</b>, niet per project."],
rel:["deployments","kosten","monitoring"]},

{id:"security",p:"platform",t:"Security & identiteit",s:"Managed identity, RBAC, keyless, netwerk, Key Vault",d:[1],
what:"<p><b>Keyless</b> = zonder API-sleutels. Je app logt in via <b>Microsoft Entra ID</b> (het identiteitssysteem van Microsoft) met een <b>managed identity</b>: een identiteit die Azure zelf beheert voor je App Service, Function of container. Wat die identiteit mag, bepaal je met <b>RBAC</b> (role-based access control: rechten via rollen).</p><p><b>Belangrijke rollen:</b></p><ul><li><b>Azure AI User</b>: modellen en agents gebruiken in een project (data-acties). Standaardrol voor apps en ontwikkelaars.</li><li><b>Azure AI Project Manager</b>: projecten beheren en mensen toegang geven.</li><li><b>Azure AI Account Owner</b>: resource en projecten beheren.</li><li><b>Cognitive Services OpenAI User</b>: alleen OpenAI-modellen aanroepen.</li><li><b>Cognitive Services User</b>: Foundry Tools aanroepen (Language, Speech, ...).</li><li><b>Search Index Data Reader / Contributor</b>: index lezen / schrijven in AI Search.</li><li><b>Storage Blob Data Reader</b>: blobs lezen (bijv. voor indexers).</li></ul><p><b>Netwerk:</b> <b>private endpoint</b> = de resource krijgt een privé-IP in je virtuele netwerk (VNet). Met <code>publicNetworkAccess: Disabled</code> is hij niet meer via internet bereikbaar.</p>",
when:["'No keys / keyless / no secrets' → <b>managed identity + RBAC</b>.","Alleen bereikbaar vanuit het bedrijfsnetwerk → <b>private endpoint</b> + public access uit.","Toch een geheim nodig (bijv. API van een derde) → <b>Key Vault</b> of een <b>project connection</b>.","Eigen encryptiesleutel verplicht → <b>customer-managed keys (CMK)</b> in Key Vault.","Principe: <b>least privilege</b> = zo min mogelijk rechten."],
code:[{l:"Keyless inloggen in Python",src:"from azure.identity import DefaultAzureCredential\nfrom azure.ai.projects import AIProjectClient\n\n# Lokaal: gebruikt je 'az login'. In Azure: de managed identity.\nproject = AIProjectClient(\n    endpoint=\"https://mijn-foundry.services.ai.azure.com/api/projects/klantenservice\",\n    credential=DefaultAzureCredential(),\n)"},
{l:"Rol toekennen (CLI)",src:"az role assignment create \\\n  --assignee <principal-id-van-managed-identity> \\\n  --role \"Azure AI User\" \\\n  --scope /subscriptions/<sub>/resourceGroups/rg-ai/providers/Microsoft.CognitiveServices/accounts/mijn-foundry"}],
cfg:["Managed identity aanzetten: <b>system-assigned</b> (hoort bij één resource, verdwijnt mee) of <b>user-assigned</b> (los object, herbruikbaar door meerdere resources).","<code>disableLocalAuth: true</code> op de resource = keys uit.","Agent Service <b>standard setup</b>: eigen Storage, Cosmos DB en AI Search in je eigen netwerk (voor data-isolatie)."],
traps:["Key Vault is veiliger dan app settings, maar is <b>niet keyless</b>.","SAS-tokens horen bij Storage, niet bij Foundry-modellen.","Managed identity werkt alleen met een <b>RBAC-rol</b> erbij. Zonder rol krijg je 401/403."],
rel:["resource","connections","agentsetup"]},

{id:"connections",p:"platform",t:"Connections",s:"Project koppelen aan AI Search, Storage, API's, MCP-servers",d:[1,2],
what:"Een <b>connection</b> is een opgeslagen koppeling van je project naar een andere dienst: Azure AI Search, Storage, Application Insights, een externe API of MCP-server. De inloggegevens worden centraal en veilig bewaard. Tools van agents verwijzen naar een connection in plaats van zelf een sleutel te bevatten.",
when:["Agent moet bij jouw AI Search-index → connection naar AI Search.","MCP-server of API met een sleutel → connection met die sleutel, tool verwijst naar de <code>project_connection_id</code>.","Tracing → connection met Application Insights."],
code:[{l:"Connections opvragen",src:"for c in project.connections.list():\n    print(c.name, c.type)\n\nsearch_conn = project.connections.get(\"mijn-search\")"}],
cfg:["Authenticatie per connection: <b>Entra ID</b> (voorkeur) of <b>API key</b>.","Gedeeld met alle projectleden of alleen met jou."],
traps:["Zet nooit een sleutel in de instructies of code van een agent. Gebruik een connection."],
rel:["security","tools","tracing"]},

{id:"cicd",p:"platform",t:"CI/CD & infrastructure as code",s:"Bicep, azd, GitHub Actions / Azure DevOps, evaluatie als poort",d:[1],
what:"<p><b>CI/CD</b> (continuous integration / continuous deployment) = automatisch testen en uitrollen bij elke wijziging. Voor Foundry betekent dat:</p><ul><li><b>Infrastructure as code (IaC)</b>: resource, project, deployments en rollen vastleggen in <b>Bicep</b> of <b>Terraform</b>, zodat elke omgeving (dev/test/prod) identiek is.</li><li><b>azd</b> (Azure Developer CLI): <code>azd up</code> zet een complete app + infra neer vanuit een template.</li><li><b>Pipeline</b> (GitHub Actions of Azure DevOps): bouwt, test, draait <b>evaluaties</b> en rolt uit.</li><li><b>Evaluation gate</b>: de pipeline stopt als de kwaliteitsscore (bijv. groundedness) onder een drempel zakt.</li><li><b>Agent versions</b>: elke wijziging van een agent is een nieuwe versie, zodat je kunt terugrollen.</li></ul>",
when:["Zelfde omgeving opnieuw opbouwen in test en productie → <b>IaC (Bicep/Terraform)</b>.","Voorkomen dat een slechtere prompt live gaat → <b>evaluatie als stap in de pipeline</b>.","Pipeline moet in Azure inloggen zonder secrets → <b>workload identity federation (OIDC)</b>, een vertrouwensrelatie tussen GitHub/DevOps en Entra ID."],
code:[{l:"GitHub Actions (schets)",src:"jobs:\n  deploy:\n    runs-on: ubuntu-latest\n    permissions: { id-token: write, contents: read }  # OIDC, geen secret\n    steps:\n      - uses: actions/checkout@v4\n      - uses: azure/login@v2\n        with:\n          client-id: ${{ vars.AZURE_CLIENT_ID }}\n          tenant-id: ${{ vars.AZURE_TENANT_ID }}\n          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}\n      - run: az deployment group create -g rg-ai -f infra/main.bicep\n      - run: python evals/run_eval.py   # faalt bij te lage score\n      - run: python deploy_agent.py     # nieuwe agentversie"}],
cfg:["Aparte resources of projecten per omgeving (dev/test/prod).","Deploymentnamen gelijk houden tussen omgevingen, zodat code niet verandert.","Endpoint en namen via <b>omgevingsvariabelen</b>, niet hardcoded."],
traps:["Een service principal met <b>client secret</b> werkt, maar <b>OIDC / workload identity federation</b> is het keyless antwoord."],
rel:["evaluaties","resource","security"]},

{id:"monitoring",p:"platform",t:"Monitoring",s:"Azure Monitor, metrics, diagnostic settings, alerts, drift",d:[1],
what:"<p>Monitoring heeft drie lagen:</p><ul><li><b>Metrics</b> (Azure Monitor): getallen over tijd, zoals tokens, requests, latency, throttling en PTU-gebruik. Hierop zet je <b>alerts</b>.</li><li><b>Logs</b> via <b>diagnostic settings</b>: platformlogs (wie riep wat aan, wanneer) naar Log Analytics, Storage of Event Hub. Doorzoeken met <b>KQL</b> (Kusto Query Language).</li><li><b>Tracing</b> via Application Insights: per verzoek alle stappen binnen je app of agent (zie Tracing).</li></ul><p>Daarnaast: <b>continuous evaluation</b> (doorlopend steekproeven van live verkeer beoordelen op kwaliteit en veiligheid) om <b>drift</b> te zien: langzaam slechter wordende kwaliteit.</p>",
when:["Hoeveel tokens/kosten per dag, alert bij piek → <b>metrics + alert</b>.","Auditlog bewaren van wie de API gebruikte → <b>diagnostic settings → Log Analytics</b>.","Per verzoek zien welke stap traag of fout was → <b>tracing</b>.","Kwaliteit van live antwoorden bewaken → <b>continuous evaluation</b> / online evaluatie.","Index-gezondheid → AI Search-metrics (query latency, throttled queries) en indexer-status."],
cfg:["Metrics: <i>Processed Prompt Tokens</i>, <i>Generated Completion Tokens</i>, <i>Time to Response</i>, <i>Provisioned-managed Utilization</i>.","Safety-signalen: aantallen geblokkeerde verzoeken per filtercategorie."],
traps:["CPU/geheugen zijn niet relevant bij Foundry: Microsoft beheert de servers.","Diagnostic settings tonen <b>niet</b> de stappen binnen een agent. Daarvoor heb je tracing nodig."],
rel:["tracing","evaluaties","quota"]},

{id:"tracing",p:"platform",t:"Tracing & observability",s:"Application Insights, OpenTelemetry, spans, tokens, latency",d:[1,2],
what:"<p><b>Tracing</b> legt per verzoek de hele keten vast als <b>spans</b> (stappen): modelaanroep → tool-aanroep → resultaat → antwoord, elk met tijd, tokens en input/output. Je ziet het als tijdlijn in Foundry (<i>Tracing</i>) of in <b>Application Insights</b>.</p><p>Technisch gebeurt het met <b>OpenTelemetry</b> (open standaard voor meten in software) met de GenAI-conventies. <b>Observability</b> is het verzamelbegrip: met traces, logs en metrics begrijpen wat je systeem doet.</p>",
when:["'Per request / each step / tool calls / latency breakdown / token analytics' → <b>tracing met Application Insights</b>.","Fouten in een agent analyseren (error analysis) → traces doorzoeken.","Kosten per gebruiker of feature → token-attributen in traces."],
code:[{l:"Tracing aanzetten (schets)",src:"from azure.monitor.opentelemetry import configure_azure_monitor\nfrom opentelemetry.instrumentation.openai_v2 import OpenAIInstrumentor\n\n# Connection string van de Application Insights die aan het project hangt\nconfigure_azure_monitor(connection_string=os.environ[\"APPLICATIONINSIGHTS_CONNECTION_STRING\"])\nOpenAIInstrumentor().instrument()   # elke OpenAI-aanroep wordt een span\n\n# Ook prompts en antwoorden vastleggen (let op privacy!):\n# OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=true"}],
cfg:["Application Insights-resource <b>koppelen aan het Foundry-project</b> (portal: Tracing).","Message content standaard <b>uit</b> i.v.m. privacy. Bewust aanzetten.","Agents in de Agent Service worden server-side automatisch getraced zodra Application Insights gekoppeld is."],
traps:["Niet verwarren met diagnostic settings (platformlogs) of metrics (totalen)."],
rel:["monitoring","evaluaties","agenteval"]},

{id:"kosten",p:"platform",t:"Kosten & schalen",s:"Tokens, PTU, batch, caching, kleinere modellen, AI gateway",d:[1],
what:"<p>Kosten bij taalmodellen = <b>tokens in × prijs</b> + <b>tokens uit × prijs</b> (output is meestal duurder). Knoppen om te draaien:</p><ul><li><b>Kleiner model</b> (SLM, mini/nano) voor eenvoudige taken.</li><li><b>Model router</b>: kiest per vraag een goedkoop of zwaar model.</li><li><b>Batch</b>: ~50% korting als het niet direct hoeft.</li><li><b>Prompt caching</b>: herhaalde lange prompt-beginstukken (zoals de system prompt) zijn goedkoper. Zet vaste tekst daarom vooraan.</li><li><b>Korter</b>: compacte prompts, <code>max_output_tokens</code> begrenzen, minder RAG-chunks meesturen.</li><li><b>Provisioned</b> is goedkoper per token bij hoog, constant gebruik. Duurder bij weinig gebruik.</li><li><b>API Management als AI gateway</b>: token-limieten per app (<i>token limit policy</i>), load balancing, <i>semantic caching</i>.</li></ul>",
when:["'Reduce cost' + eenvoudige taak → kleiner model.","'Reduce cost' + niet urgent → batch.","Per team een tokenbudget afdwingen → API Management token limit policy."],
traps:["PTU is niet automatisch goedkoper. Alleen bij hoog en stabiel gebruik."],
rel:["modelkeuze","deployments","quota"]}
);

// ===== Platform extra: CLI en containers =====
N.push(
{id:"cli",p:"platform",t:"Azure CLI & azd",s:"De commands die op het examen terugkomen, met welke waarden",d:[1],
what:"<p>De <b>Azure CLI</b> (<code>az</code>) is de command-line tool om Azure te beheren. Op het examen moet je soms het juiste command of de juiste parameterwaarde kiezen. Patroon: <code>az &lt;dienst&gt; &lt;onderdeel&gt; &lt;actie&gt; --parameters</code>.</p><p><b>azd</b> (Azure Developer CLI) zet een complete app neer vanuit een template: infra (Bicep) + code + configuratie, met één command.</p>",
when:["Inloggen → <code>az login</code> (daarna werkt <code>DefaultAzureCredential</code> lokaal).","Foundry/AI-resource maken → <code>az cognitiveservices account create</code>.","Endpoint of sleutels opvragen → <code>az cognitiveservices account show</code> / <code>keys list</code>.","Model uitrollen → <code>az cognitiveservices account deployment create</code>.","Rol geven → <code>az role assignment create</code>.","Hele AI-app uit een template → <code>azd init</code> + <code>azd up</code>."],
code:[{l:"Veelgebruikte commands",src:"# Inloggen en subscription kiezen\naz login\naz account set --subscription \"<naam-of-id>\"\n\n# Foundry resource (kind = AIServices). Losse diensten: --kind TextAnalytics, SpeechServices,\n# ComputerVision, FormRecognizer, ContentSafety, TextTranslation\naz cognitiveservices account create -n mijn-foundry -g rg-ai \\\n  --kind AIServices --sku S0 -l swedencentral --custom-domain mijn-foundry\n\n# Endpoint en keys opvragen\naz cognitiveservices account show -n mijn-foundry -g rg-ai --query properties.endpoint\naz cognitiveservices account keys list -n mijn-foundry -g rg-ai\naz cognitiveservices account keys regenerate -n mijn-foundry -g rg-ai --key-name key1\n\n# Model deployen\naz cognitiveservices account deployment create -n mijn-foundry -g rg-ai \\\n  --deployment-name gpt-41 --model-name gpt-4.1 --model-version 2025-04-14 \\\n  --model-format OpenAI --sku-name GlobalStandard --sku-capacity 50\n\n# Azure AI Search\naz search service create -n mijn-search -g rg-ai --sku basic -l swedencentral\n\n# Managed identity + rol\naz webapp identity assign -n mijn-app -g rg-ai\naz role assignment create --assignee <principal-id> --role \"Azure AI User\" --scope <resource-id>\n\n# Azure Developer CLI\nazd init --template <template-naam>\nazd up        # provisionen + deployen\nazd down      # alles weer opruimen"}],
cfg:["<b>--kind</b>: <code>AIServices</code> (Foundry, alles-in-één), of een losse dienst zoals <code>TextAnalytics</code> (Language), <code>SpeechServices</code>, <code>ComputerVision</code>, <code>FormRecognizer</code> (Document Intelligence), <code>ContentSafety</code>, <code>TextTranslation</code>.","<b>--sku</b>: <code>F0</code> = gratis (beperkt, één per subscription per dienst), <code>S0</code> = standaard betaald.","<b>--custom-domain</b>: vereist voor Entra ID-authenticatie en private endpoints.","<b>--sku-name</b> bij deployments: <code>GlobalStandard</code>, <code>Standard</code>, <code>DataZoneStandard</code>, <code>ProvisionedManaged</code>, <code>GlobalProvisionedManaged</code>, <code>GlobalBatch</code>."],
traps:["<code>keys regenerate</code> roteert een sleutel. Er zijn er twee (key1 en key2), zodat je zonder downtime kunt wisselen: app op key2 zetten, key1 vernieuwen, terugzetten.","F0 bestaat niet voor alle diensten en heeft lage limieten. Niet voor productie."],
rel:["resource","deployments","containers","security"]},

{id:"containers",p:"platform",t:"Docker-containers (lokaal draaien)",s:"Foundry Tools on-premises of op de edge, met Eula, Billing en ApiKey",d:[1,4],
what:"<p>Een aantal Foundry Tools kun je als <b>Docker-container</b> draaien: op je eigen server, in je eigen datacenter of op een apparaat aan de rand van het netwerk (<b>edge</b>). Het model draait dan <b>lokaal</b>, dus de data verlaat je netwerk niet en de latency is laag.</p><p><b>Beschikbaar als container</b> (selectie): Language (sentiment, key phrases, taaldetectie, NER, PII, samenvatten, CLU), Speech (speech-to-text, custom speech, neural text-to-speech, taal-identificatie), Translator, Document Intelligence (Read, Layout, prebuilt modellen), Vision Read (OCR).</p><p><b>Twee varianten:</b></p><ul><li><b>Connected containers</b>: draaien lokaal, maar sturen <b>factureringsgegevens</b> naar je Azure-resource. Ze hebben dus af en toe internet nodig. Data zelf gaat niet naar Azure.</li><li><b>Disconnected containers</b>: helemaal zonder internet (bijv. op een schip of in een beveiligde omgeving). Vereisen een <b>goedgekeurde aanvraag</b> en een <b>commitment tier</b>-contract (vooraf betaald volume).</li></ul>",
when:["'Data mag het eigen netwerk / de fabriek niet verlaten' of 'lage latency on-premises' → <b>container</b>.","'Geen internetverbinding mogelijk' → <b>disconnected container</b> (met commitment tier).","Gewone cloud-app → geen container nodig, gewoon het endpoint aanroepen."],
code:[{l:"Container starten (voorbeeld sentiment)",src:"docker run --rm -it -p 5000:5000 --memory 8g --cpus 1 \\\n  mcr.microsoft.com/azure-cognitive-services/textanalytics/sentiment:latest \\\n  Eula=accept \\\n  Billing=https://mijn-language.cognitiveservices.azure.com/ \\\n  ApiKey=<sleutel-van-die-resource>"},
{l:"Daarna aanroepen: lokaal endpoint",src:"from azure.ai.textanalytics import TextAnalyticsClient\nfrom azure.core.credentials import AzureKeyCredential\n\n# Endpoint is nu je eigen container, niet Azure\nclient = TextAnalyticsClient(endpoint=\"http://localhost:5000\",\n                             credential=AzureKeyCredential(\"niet-gebruikt\"))\nprint(client.analyze_sentiment([\"De service was top!\"])[0].sentiment)"}],
cfg:["Drie <b>verplichte</b> parameters bij <code>docker run</code>:<br><code>Eula=accept</code> (licentie accepteren)<br><code>Billing=&lt;endpoint-van-je-Azure-resource&gt;</code><br><code>ApiKey=&lt;sleutel-van-die-resource&gt;</code>","Images staan in <b>Microsoft Container Registry</b>: <code>mcr.microsoft.com/azure-cognitive-services/...</code>.","Standaardpoort in de container: <b>5000</b>. Met <code>-p 5000:5000</code> koppel je die aan je machine.","Geheugen en CPU volgens de minimumvereisten per container (<code>--memory</code>, <code>--cpus</code>).","Draaien op: Docker lokaal, Azure Container Instances, Azure Kubernetes Service, IoT Edge."],
traps:["Billing en ApiKey moeten bij <b>dezelfde</b> Azure-resource horen, en van het <b>juiste type</b> (Language-container → Language- of Foundry-resource).","Zonder <code>Eula=accept</code> start de container niet.","Connected containers zijn niet offline: ze rapporteren gebruik voor facturering. Offline = disconnected.","Niet alle functies bestaan als container. Generatieve modellen (GPT) draai je niet zo in een Foundry Tools-container."],
rel:["cli","language","speechstt","docintel"]}
);

// ===== Responsible AI =====
N.push(
{id:"guardrails",p:"rai",t:"Guardrails & content filters",s:"Categorieën, ernstniveaus, input/output, blocklists",d:[1,3],
what:"<p>Elke modeldeployment en agent in Foundry heeft een <b>guardrail</b> (vroeger: content filter-configuratie). Die controleert de <b>input</b> (prompt) en de <b>output</b> (antwoord) en blokkeert of markeert schadelijke content.</p><p><b>Vier schadecategorieën</b>, elk met een ernstniveau (<b>severity</b>): <b>hate</b> (haat), <b>sexual</b> (seksueel), <b>violence</b> (geweld), <b>self-harm</b> (zelfbeschadiging). Ernst: safe, low, medium, high. Je stelt per categorie in vanaf welk niveau er geblokkeerd wordt.</p><p><b>Extra controles:</b> Prompt Shields (jailbreak en indirecte aanvallen), protected material (tekst en code), groundedness, PII-detectie, en <b>blocklists</b> (eigen lijsten met verboden woorden).</p>",
when:["Strenger of soepeler filteren dan standaard → <b>eigen guardrail</b> maken en aan de deployment koppelen.","Specifieke termen (concurrentnamen, scheldwoorden) blokkeren → <b>blocklist</b>.","Niet blokkeren maar wel markeren voor review → <b>annotate-only</b> modus.","Filters volledig uit → alleen na goedkeuring door Microsoft (<i>modified content filtering</i>)."],
cfg:["Drempel per categorie, apart voor <b>input</b> en <b>output</b>: blokkeer vanaf low / medium / high.","Standaard: blokkeert <b>medium en high</b>.","Actie: <b>block</b> of <b>annotate</b>.","Guardrail koppelen per <b>deployment</b> of per <b>agent</b>.","In de response: <code>content_filter_results</code> per categorie (filtered: true/false, severity). Geblokkeerde input geeft HTTP 400 met code <code>content_filter</code>."],
traps:["Een lagere drempel (blokkeer vanaf <b>low</b>) is <b>strenger</b>, niet soepeler.","Filters gelden voor input én output. Een antwoord kan halverwege worden afgekapt met <code>finish_reason: content_filter</code>."],
rel:["promptshields","contentsafety","visualrai"]},

{id:"promptshields",p:"rai",t:"Prompt Shields",s:"Jailbreak (direct) en indirect prompt injection",d:[1,3],
what:"<p><b>Prompt injection</b> = iemand probeert het model zijn regels te laten negeren.</p><ul><li><b>Direct (jailbreak / user prompt attack)</b>: de gebruiker typt het zelf, zoals 'Ignore all previous instructions'.</li><li><b>Indirect (document attack / XPIA)</b>: de aanval zit verstopt in content die het model leest: een webpagina, e-mail, document, tool-resultaat of <b>tekst in een afbeelding</b>.</li></ul><p><b>Prompt Shields</b> herkent beide en blokkeert ze vóórdat het model antwoordt. Aanzetten in de guardrail, zonder code te veranderen.</p><p>Extra techniek tegen indirecte aanvallen: <b>spotlighting</b>, het duidelijk markeren van externe content als 'data, geen instructies'.</p>",
when:["'Ignore your instructions' / 'reveal system prompt' → <b>Prompt Shields</b> (user prompt attacks).","Agent leest e-mails/webpagina's/documenten met verborgen opdrachten → <b>Prompt Shields voor documenten</b> (indirect attacks).","Afbeelding met tekst die het model probeert te sturen → indirect attack, ook Prompt Shields."],
code:[{l:"Los aanroepen via Content Safety (REST)",src:"POST {endpoint}/contentsafety/text:shieldPrompt?api-version=2024-09-01\n{\n  \"userPrompt\": \"Ignore all previous instructions and ...\",\n  \"documents\": [\"<tekst uit een e-mail of webpagina>\"]\n}\n\n# Antwoord:\n# { \"userPromptAnalysis\": { \"attackDetected\": true },\n#   \"documentsAnalysis\": [ { \"attackDetected\": false } ] }"}],
traps:["Een extra zin in de system prompt is geen detectie en niet waterdicht.","Groundedness ≠ Prompt Shields. Groundedness gaat over verzonnen antwoorden, niet over aanvallen."],
rel:["guardrails","contentsafety","visualrai"]},

{id:"contentsafety",p:"rai",t:"Azure AI Content Safety",s:"Losse API: tekst/beeld analyseren, groundedness, protected material",d:[1,3],
what:"<p>Dezelfde veiligheidsmodellen als in de guardrails, maar als <b>losse API</b> die je zelf aanroept. Handig voor content die <b>niet</b> door een Foundry-model gaat: berichten op een forum, door gebruikers geüploade foto's, of output van een ander systeem.</p><ul><li><b>Analyze text / Analyze image</b>: ernst per categorie (hate, sexual, violence, self-harm).</li><li><b>Prompt Shields</b>: <code>text:shieldPrompt</code>.</li><li><b>Groundedness detection</b>: is het antwoord gedekt door de meegegeven bronnen? Kan ook corrigeren.</li><li><b>Protected material detection</b>: bekende auteursrechtelijk beschermde tekst (songteksten, artikelen) of code (uit openbare repo's) in output.</li><li><b>Custom categories</b>: eigen categorie trainen met voorbeelden (bijv. 'reclame voor concurrenten').</li></ul>",
when:["Door gebruikers geüploade content modereren (niet via een LLM) → <b>Content Safety API</b>.","Eigen soort ongewenste content herkennen → <b>custom categories</b>.","Controleren of RAG-antwoorden kloppen met de bronnen → <b>groundedness detection</b>."],
code:[{l:"Tekst analyseren (Python)",src:"from azure.ai.contentsafety import ContentSafetyClient\nfrom azure.ai.contentsafety.models import AnalyzeTextOptions\nfrom azure.identity import DefaultAzureCredential\n\nclient = ContentSafetyClient(\"https://mijn-foundry.cognitiveservices.azure.com/\",\n                             DefaultAzureCredential())\nresult = client.analyze_text(AnalyzeTextOptions(text=\"tekst van gebruiker\"))\nfor c in result.categories_analysis:\n    print(c.category, c.severity)   # bijv. Hate 0, Violence 2"},
{l:"Beeld analyseren",src:"from azure.ai.contentsafety.models import AnalyzeImageOptions, ImageData\n\nwith open(\"upload.jpg\", \"rb\") as f:\n    req = AnalyzeImageOptions(image=ImageData(content=f.read()))\nresult = client.analyze_image(req)"}],
cfg:["Severity bij tekst: 0-7 (standaard teruggegeven als 0, 2, 4, 6). Bij beeld: 0, 2, 4, 6.","Eigen drempel kiezen in je code: bijv. blokkeren als severity ≥ 4.","Package: <code>azure-ai-contentsafety</code>."],
traps:["Content Safety <b>verwijdert</b> geen content. Het geeft scores. Jouw code beslist wat er gebeurt."],
rel:["guardrails","promptshields","evaluaties"]},

{id:"evaluaties",p:"rai",t:"Evaluaties",s:"Kwaliteit, veiligheid en agentgedrag meten met evaluators",d:[1,2],
what:"<p>Een <b>evaluator</b> geeft een score aan een antwoord. Je draait ze op een <b>testset</b> (vragen + verwachte antwoorden/context) vóór livegang, in je CI/CD-pipeline en doorlopend op live verkeer.</p><table><tr><th>Soort</th><th>Evaluators</th><th>Meet</th></tr><tr><td>RAG-kwaliteit</td><td><b>Groundedness</b>, <b>Relevance</b>, Retrieval, Response Completeness</td><td>Verzint het model iets? Beantwoordt het de vraag? Haalt het de goede stukken op?</td></tr><tr><td>Tekstkwaliteit</td><td><b>Coherence</b>, <b>Fluency</b></td><td>Logisch opgebouwd? Goed geschreven?</td></tr><tr><td>Vergelijken met referentie</td><td><b>Similarity</b>, F1, BLEU, ROUGE, GLEU, METEOR</td><td>Lijkt het antwoord op het verwachte antwoord?</td></tr><tr><td>Veiligheid</td><td>Violence, Sexual, Self-harm, Hate/Unfairness, <b>Indirect attack</b>, <b>Protected material</b>, Code vulnerability</td><td>Schadelijke output, kwetsbaarheden</td></tr><tr><td>Agents</td><td><b>Intent resolution</b>, <b>Task adherence</b>, <b>Tool call accuracy</b></td><td>Begreep de agent de vraag, volgde hij de opdracht, koos hij de juiste tools?</td></tr></table><p><b>AI-assisted</b> evaluators gebruiken zelf een LLM als beoordelaar (<i>LLM-as-a-judge</i>). <b>NLP-metrics</b> (F1, BLEU) rekenen woordovereenkomst uit en hebben een referentieantwoord nodig.</p><p><b>AI Red Teaming Agent</b>: valt je app automatisch aan (op basis van PyRIT) om zwaktes te vinden.</p>",
when:["Detecteren van verzonnen antwoorden (fabrications) → <b>Groundedness</b>.","Beantwoordt het de vraag? → <b>Relevance</b>.","Agent kiest verkeerde tools → <b>Tool call accuracy</b>.","Twee modellen of prompts vergelijken → zelfde testset, zelfde evaluators, scores naast elkaar.","Zwaktes vinden vóór livegang → <b>red teaming</b>."],
code:[{l:"Evalueren met azure-ai-evaluation",src:"from azure.ai.evaluation import GroundednessEvaluator, RelevanceEvaluator, evaluate\n\nmodel_config = {\n    \"azure_endpoint\": \"https://mijn-foundry.openai.azure.com/\",\n    \"azure_deployment\": \"gpt-41\",   # het 'jurymodel'\n}\ngroundedness = GroundednessEvaluator(model_config)\nrelevance = RelevanceEvaluator(model_config)\n\n# Eén antwoord beoordelen\nprint(groundedness(query=\"Hoeveel vakantiedagen?\",\n                   context=\"Medewerkers hebben 25 vakantiedagen.\",\n                   response=\"Je hebt 30 vakantiedagen.\"))   # lage score\n\n# Een hele testset (JSONL met query/context/response per regel)\nresult = evaluate(\n    data=\"testset.jsonl\",\n    evaluators={\"groundedness\": groundedness, \"relevance\": relevance},\n)"}],
cfg:["Scores van AI-assisted evaluators: meestal 1-5, met een drempel (bijv. ≥ 3 = pass).","Veiligheidsevaluators hebben een Foundry-project nodig (<code>azure_ai_project</code>) in plaats van een eigen jurymodel.","Testdata als <b>JSONL</b> (één JSON-object per regel)."],
traps:["BLEU/ROUGE/F1 hebben een <b>ground truth</b> (referentieantwoord) nodig. Groundedness heeft <b>context</b> nodig.","Fluency meet taal, niet juistheid. Een vloeiend antwoord kan volledig verzonnen zijn."],
rel:["agenteval","cicd","monitoring","contentsafety"]},

{id:"governance",p:"rai",t:"Agent governance & auditing",s:"Oversight, approvals, tool-toegang, trace-logs, provenance",d:[1,2],
what:"<p>Hoe houd je controle over agents die zelf beslissingen nemen?</p><ul><li><b>Oversight modes</b>: hoeveel mag de agent zelf? Volledig autonoom, semi-autonoom (toestemming voor risicovolle acties) of alleen voorstellen doen.</li><li><b>Approval workflows / human-in-the-loop</b>: een mens keurt een tool-aanroep goed voordat die uitgevoerd wordt.</li><li><b>Tool-access controls</b>: per agent alleen de tools die nodig zijn (<b>least privilege</b>), met beperkte rechten per tool.</li><li><b>Constraints</b>: harde grenzen in code (bedragen, aantallen), niet alleen in de prompt.</li><li><b>Auditing</b>: <b>trace logging</b> van elke stap, <b>provenance metadata</b> (waar komt informatie vandaan, welke versie van model/agent), en wie wat goedkeurde.</li><li><b>Agent identity</b>: agents krijgen een eigen Entra-identiteit, zodat je hun rechten apart kunt beheren en zien wat ze deden.</li></ul>",
when:["Geld, data verwijderen, e-mail versturen → <b>approval vóór uitvoering</b>.","Achteraf kunnen aantonen wat de agent deed en waarom → <b>tracing + audit logs + provenance</b>.","Agent mag alleen lezen, niet schrijven → <b>rechten van de tool/identiteit beperken</b>."],
traps:["'Reliably enforce' betekent nooit 'zet het in de prompt'. Het antwoord is altijd code, configuratie of een approval flow."],
rel:["hitl","tracing","agentidentity"]},

{id:"raiprincipes",p:"rai",t:"Responsible AI-principes",s:"De 6 principes van Microsoft",d:[1],
what:"<ul><li><b>Fairness</b> (eerlijkheid): geen ongelijke behandeling van groepen.</li><li><b>Reliability &amp; safety</b> (betrouwbaarheid en veiligheid): werkt zoals bedoeld, ook in uitzonderingen.</li><li><b>Privacy &amp; security</b>: data beschermd, PII zorgvuldig behandeld.</li><li><b>Inclusiveness</b> (inclusiviteit): bruikbaar voor iedereen, ook met een beperking (bijv. alt-text).</li><li><b>Transparency</b> (transparantie): duidelijk dat het AI is en hoe het werkt (transparency notes).</li><li><b>Accountability</b> (verantwoordelijkheid): mensen blijven verantwoordelijk, met toezicht.</li></ul><p>Werkwijze in vier stappen: <b>identify</b> (risico's vinden) → <b>measure</b> (evaluaties) → <b>mitigate</b> (filters, prompts, UX) → <b>operate</b> (monitoren, incidentplan).</p>",
when:["Vraag welk principe geschonden wordt: let op het kernwoord (groepen → fairness, uitleg → transparency, mens verantwoordelijk → accountability)."],
rel:["guardrails","evaluaties","governance"]}
);

// ===== Generatieve AI-apps =====
N.push(
{id:"sdk",p:"genai",t:"Foundry SDK & clients",s:"AIProjectClient, OpenAI-client, Responses API, endpoints",d:[2],
what:"<p>Je app praat met Foundry via de <b>Foundry SDK</b>. In Python: het package <code>azure-ai-projects</code> (versie 2.x) met <code>azure-identity</code> voor inloggen.</p><ul><li><b>AIProjectClient</b>: de hoofdclient, verbonden met je <b>project-endpoint</b>. Geeft toegang tot agents, connections, deployments, evaluaties.</li><li><b>get_openai_client()</b>: geeft een OpenAI-compatibele client terug voor modelaanroepen.</li><li><b>Responses API</b> (<code>responses.create</code>): de moderne API voor modellen en agents, met ingebouwde tools en gespreksgeschiedenis.</li><li><b>Chat Completions API</b> (<code>chat.completions.create</code>): de oudere API met een lijst <code>messages</code>. Kom je nog veel tegen.</li></ul><p><b>Twee soorten endpoints:</b> het <b>project-endpoint</b> (<code>.services.ai.azure.com/api/projects/...</code>) voor de SDK, en het <b>resource-endpoint</b> (<code>.openai.azure.com</code> of <code>.cognitiveservices.azure.com</code>) voor directe API-aanroepen naar modellen of Foundry Tools.</p>",
when:["App koppelen aan een Foundry-project → <b>AIProjectClient</b> met project-endpoint + <code>DefaultAzureCredential</code>.","Alleen een model aanroepen → <code>get_openai_client()</code> + <code>responses.create</code>.","Vervolgvraag met geheugen → <code>previous_response_id</code> of een <b>conversation</b>."],
code:[{l:"Model aanroepen (actuele quickstart, SDK 2.x)",src:"# pip install \"azure-ai-projects>=2.3.0\" azure-identity\nfrom azure.identity import DefaultAzureCredential\nfrom azure.ai.projects import AIProjectClient\n\nproject = AIProjectClient(\n    endpoint=\"https://mijn-foundry.services.ai.azure.com/api/projects/klantenservice\",\n    credential=DefaultAzureCredential(),\n)\nopenai = project.get_openai_client()\n\nresponse = openai.responses.create(\n    model=\"gpt-5-mini\",            # = de DEPLOYMENTnaam\n    input=\"Wat is de hoofdstad van Frankrijk?\",\n)\nprint(response.output_text)\n\n# Vervolgvraag die de vorige onthoudt\nresponse2 = openai.responses.create(\n    model=\"gpt-5-mini\",\n    input=\"En hoeveel inwoners heeft die stad?\",\n    previous_response_id=response.id,\n)"},
{l:"Chat Completions (oudere stijl)",src:"completion = openai.chat.completions.create(\n    model=\"gpt-41\",\n    messages=[\n        {\"role\": \"system\", \"content\": \"Je bent een behulpzame HR-assistent.\"},\n        {\"role\": \"user\", \"content\": \"Hoeveel vakantiedagen heb ik?\"},\n    ],\n    temperature=0.2,\n)\nprint(completion.choices[0].message.content)"},
{l:"Direct met de OpenAI-library (keyless)",src:"from openai import OpenAI\nfrom azure.identity import DefaultAzureCredential, get_bearer_token_provider\n\ntoken_provider = get_bearer_token_provider(\n    DefaultAzureCredential(), \"https://cognitiveservices.azure.com/.default\")\n\nclient = OpenAI(base_url=\"https://mijn-foundry.openai.azure.com/openai/v1/\",\n                api_key=token_provider)"}],
cfg:["Omgevingsvariabelen: project-endpoint en deploymentnaam niet hardcoden.","Scope voor tokens: <code>https://cognitiveservices.azure.com/.default</code> (resource) of <code>https://ai.azure.com/.default</code> (project-API).","Rol voor de app-identiteit: <b>Azure AI User</b> op het project of de resource."],
traps:["<code>model=</code> is de <b>deploymentnaam</b>.","SDK 2.x is niet compatibel met 1.x. In 1.x maakte je agents met <code>create_agent</code> + threads + runs. In 2.x met <code>create_version</code> + conversations + responses.","<code>response.output_text</code> (Responses) vs. <code>choices[0].message.content</code> (Chat Completions)."],
rel:["parameters","structured","agentservice","security"]},

{id:"parameters",p:"genai",t:"Generatieparameters",s:"temperature, top_p, max tokens, seed, stop, penalties, reasoning_effort",d:[2],
what:"<table><tr><th>Parameter</th><th>Wat het doet</th><th>Typische waarde</th></tr><tr><td><b>temperature</b></td><td>Willekeur. 0 = steeds het meest waarschijnlijke woord, hoger = creatiever</td><td>0-0.3 voor feiten/extractie, 0.7-1 voor creatief</td></tr><tr><td><b>top_p</b></td><td>Alleen de bovenste woorden tot samen p% kans doen mee</td><td>1 (standaard). Pas óf temperature óf top_p aan</td></tr><tr><td><b>max_tokens</b> / <b>max_output_tokens</b></td><td>Maximale lengte van het antwoord</td><td>Zo laag als redelijk</td></tr><tr><td><b>seed</b></td><td>Vast startgetal voor het toeval: (bijna) hetzelfde antwoord bij dezelfde input</td><td>bijv. 42</td></tr><tr><td><b>stop</b></td><td>Stopt zodra deze tekst verschijnt</td><td>bijv. <code>[\"\\n\\n\"]</code></td></tr><tr><td><b>frequency_penalty</b></td><td>Straft woorden die vaak herhaald worden</td><td>0-1 tegen herhaling</td></tr><tr><td><b>presence_penalty</b></td><td>Straft woorden die al voorkwamen, stimuleert nieuwe onderwerpen</td><td>0-1 voor meer variatie</td></tr><tr><td><b>reasoning_effort</b></td><td>Alleen reasoning models: hoeveel denkwerk</td><td>low / medium / high</td></tr><tr><td><b>tool_choice</b></td><td>Mag/moet het model een tool gebruiken</td><td>auto / required / none / specifieke tool</td></tr></table>",
when:["Zelfde vraag → zelfde antwoord → <b>temperature 0</b> (+ <b>seed</b>).","Antwoorden te lang of te duur → <b>max_output_tokens</b> lager.","Model herhaalt zichzelf → <b>frequency_penalty</b> omhoog.","Complexe planning/wiskunde → reasoning model met <b>reasoning_effort: high</b>."],
traps:["Hogere temperature = meer verzinsels, niet minder.","Reasoning models ondersteunen vaak geen temperature/top_p.","Parameters lossen geen kennisgebrek op. Ontbrekende feiten → RAG."],
rel:["prompting","structured","modelkeuze"]},

{id:"prompting",p:"genai",t:"Prompt engineering",s:"System message, few-shot, chain-of-thought, grounding-instructies",d:[2],
what:"<ul><li><b>System message / instructions</b>: rol, toon, regels en grenzen. 'Je bent een HR-assistent. Antwoord alleen op basis van de bronnen. Weet je het niet, zeg dat.'</li><li><b>Zero-shot</b>: alleen de opdracht. <b>Few-shot</b>: 2-5 voorbeelden van input → gewenste output erbij. Helpt bij een vast format of een lastige classificatie.</li><li><b>Chain-of-thought (CoT)</b>: model eerst stap voor stap laten redeneren. Beter bij rekenen en logica.</li><li><b>Grounding-instructies</b>: 'Gebruik alleen de onderstaande context. Noem de bron.'</li><li><b>Scheidingstekens</b> (delimiters): context tussen bijv. <code>###</code> of XML-tags, zodat het model data en instructies uit elkaar houdt.</li><li><b>Output-instructie</b>: format, lengte, taal.</li></ul>",
when:["Model antwoordt in het verkeerde format → <b>few-shot voorbeelden</b> of structured outputs.","Model verzint dingen buiten de bronnen → <b>grounding-instructie</b> + RAG + groundedness-evaluatie.","Rekenfouten in meerstapsproblemen → <b>chain-of-thought</b> of een reasoning model."],
traps:["Prompt engineering is altijd de eerste en goedkoopste stap, vóór RAG en fine-tuning.","Een instructie in de prompt is geen beveiliging (zie Prompt Shields en approvals)."],
rel:["parameters","rag","reflection"]},

{id:"structured",p:"genai",t:"Structured outputs & function calling",s:"JSON schema afdwingen, model laat jouw code iets doen",d:[2,4],
what:"<p><b>Structured outputs</b>: je geeft een <b>JSON schema</b> mee en het model geeft <b>gegarandeerd</b> JSON terug dat daaraan voldoet (met <code>strict: true</code>). Handig voor extractie en voor systemen die de output automatisch verwerken.</p><p><b>JSON mode</b> (<code>{\"type\": \"json_object\"}</code>) garandeert alleen geldige JSON, niet jouw velden.</p><p><b>Function calling</b>: je beschrijft functies (naam, beschrijving, parameters als JSON schema). Het model beslist wanneer een functie nodig is en geeft de <b>argumenten</b> terug. <b>Jouw code voert de functie uit</b> en stuurt het resultaat terug, waarna het model het eindantwoord maakt.</p>",
when:["Downstream systeem parseert de output → <b>structured outputs</b> met schema.","Entiteiten/velden uit tekst halen als JSON → structured outputs.","Model moet live data ophalen of een actie doen in je eigen code → <b>function calling</b>."],
code:[{l:"Structured output (Responses API)",src:"response = openai.responses.create(\n    model=\"gpt-41\",\n    input=\"Ticket: 'Mijn factuur klopt niet, ik betaalde dubbel.'\",\n    text={\"format\": {\n        \"type\": \"json_schema\",\n        \"name\": \"ticket\",\n        \"strict\": True,\n        \"schema\": {\n            \"type\": \"object\",\n            \"properties\": {\n                \"categorie\": {\"type\": \"string\", \"enum\": [\"billing\", \"technisch\", \"account\"]},\n                \"urgent\": {\"type\": \"boolean\"},\n            },\n            \"required\": [\"categorie\", \"urgent\"],\n            \"additionalProperties\": False,\n        },\n    }},\n    temperature=0,\n)\nprint(response.output_text)   # {\"categorie\":\"billing\",\"urgent\":false}"},
{l:"Function calling (stroom)",src:"tools = [{\n    \"type\": \"function\",\n    \"name\": \"get_order_status\",\n    \"description\": \"Haal de actuele status van een order op\",\n    \"parameters\": {\"type\": \"object\",\n                   \"properties\": {\"order_id\": {\"type\": \"string\"}},\n                   \"required\": [\"order_id\"]},\n}]\nr = openai.responses.create(model=\"gpt-41\", input=\"Waar is order 48213?\", tools=tools)\n\nfor item in r.output:\n    if item.type == \"function_call\":\n        args = json.loads(item.arguments)          # {\"order_id\": \"48213\"}\n        result = get_order_status(**args)          # JOUW code\n        r = openai.responses.create(\n            model=\"gpt-41\", previous_response_id=r.id,\n            input=[{\"type\": \"function_call_output\",\n                    \"call_id\": item.call_id,\n                    \"output\": json.dumps(result)}],\n            tools=tools)\nprint(r.output_text)"}],
cfg:["<code>strict: true</code> + <code>additionalProperties: false</code> + alle velden in <code>required</code>.","<code>enum</code> om toegestane waarden vast te leggen.","Combineer met <b>temperature 0</b> voor consistentie."],
traps:["'Respond in JSON' in de prompt is een verzoek, geen garantie.","Bij function calling voert het <b>model</b> niets uit. Het geeft alleen aan wát er uitgevoerd moet worden."],
rel:["parameters","tools","llmtekst"]},

{id:"rag",p:"genai",t:"RAG (retrieval-augmented generation)",s:"Eigen data ophalen en het antwoord daarop baseren",d:[2,5],
what:"<p><b>RAG</b>: vóór het antwoord eerst relevante stukken uit je eigen data ophalen en die meesturen. Het model baseert zijn antwoord daarop (<b>grounding</b>), met bronvermelding.</p><p><b>Twee fases:</b></p><ol><li><b>Ingestie</b> (vooraf): documenten binnenhalen → tekst eruit (OCR/layout) → in stukken knippen (<b>chunking</b>) → <b>embeddings</b> maken → opslaan in een <b>index</b>.</li><li><b>Query</b> (per vraag): vraag → zoeken in de index (bij voorkeur <b>hybrid + semantic ranker</b>) → top-chunks in de prompt → model antwoordt met bronnen.</li></ol><p><b>In Foundry kan dat op drie manieren:</b> zelf bouwen met Azure AI Search + SDK; een agent met de <b>Azure AI Search-tool</b> of <b>file search</b>; of <b>agentic retrieval</b> via een knowledge base (Foundry IQ).</p>",
when:["Eigen/actuele/bedrijfsdata + verzonnen antwoorden → <b>RAG</b>.","Data verandert vaak → RAG (index bijwerken), geen fine-tuning.","Antwoorden moeten bronnen noemen → RAG met citations."],
code:[{l:"Minimale RAG-flow",src:"# 1. Ophalen\nresults = search_client.search(search_text=vraag, vector_queries=[vq],\n                                query_type=\"semantic\",\n                                semantic_configuration_name=\"default\", top=5)\ncontext = \"\\n\\n\".join(f\"[{r['title']}] {r['content']}\" for r in results)\n\n# 2. Genereren met grounding-instructie\nresponse = openai.responses.create(\n    model=\"gpt-41\",\n    instructions=\"Antwoord alleen op basis van de bronnen. Noem de bron tussen []. \"\n                 \"Staat het er niet in, zeg dan dat je het niet weet.\",\n    input=f\"Bronnen:\\n{context}\\n\\nVraag: {vraag}\",\n    temperature=0,\n)"}],
cfg:["<b>Chunkgrootte</b>: vaak 500-1000 tokens met 10-20% <b>overlap</b>, zodat context niet midden in een zin breekt.","<b>top / k</b>: hoeveel chunks meesturen (meer = duurder, niet altijd beter).","<b>Embeddingmodel</b> bij indexeren = embeddingmodel bij zoeken (zelfde dimensies)."],
traps:["Fine-tuning leert geen actuele feiten. Daarvoor is RAG.","Slechte antwoorden komen vaak door slechte <b>retrieval</b>, niet door het model. Meet beide (retrieval- en groundedness-evaluatie)."],
rel:["searchquery","index","embeddings","toolsknowledge","agenticretrieval"]},

{id:"embeddings",p:"genai",t:"Embeddings & vectoren",s:"Betekenis als getallen, cosine similarity, dimensies",d:[2,5],
what:"<p>Een <b>embedding</b> is een lijst getallen (een <b>vector</b>) die de betekenis van tekst (of een beeld) vastlegt. Teksten met een vergelijkbare betekenis krijgen vectoren die dicht bij elkaar liggen. 'Afstand' wordt meestal gemeten met <b>cosine similarity</b>.</p><p>Modellen: <b>text-embedding-3-small</b> (1536 dimensies, goedkoop) en <b>text-embedding-3-large</b> (3072 dimensies, nauwkeuriger). De dimensies kun je bij deze modellen verkleinen met de parameter <code>dimensions</code>.</p>",
when:["Zoeken op betekenis, aanbevelingen, clusteren, duplicaten vinden → embeddings.","Beelden en tekst in dezelfde zoekruimte → multimodale embeddings."],
code:[{l:"Embedding maken",src:"emb = openai.embeddings.create(model=\"text-embedding-3-small\",\n                               input=\"Hoe reset ik het apparaat?\")\nvector = emb.data[0].embedding   # lijst van 1536 getallen"}],
cfg:["Vectorveld in de index: <b>dimensions</b> = exact het aantal van je model (bijv. 1536)."],
traps:["Index met 1536 dimensies + model dat 3072 geeft = fout. Dimensies moeten overeenkomen.","Embeddings zijn geen chatmodel. Ze genereren geen tekst."],
rel:["index","searchquery","rag"]},

{id:"reflection",p:"genai",t:"Workflows, reflectie & orchestratie",s:"Meerstaps-pipelines, self-critique, meerdere modellen, LLM + regels",d:[2],
what:"<ul><li><b>Multistep reasoning pipeline</b>: een taak opdelen in stappen (classificeren → ophalen → antwoorden → controleren), elk met een eigen prompt of model.</li><li><b>Reflection / self-critique loop</b>: het model (of een tweede model) beoordeelt het eigen antwoord tegen criteria en verbetert het. 'Controleer of elk feit in de bronnen staat. Herschrijf als dat niet zo is.'</li><li><b>Chain-of-thought-evaluatie</b>: de redenering zelf laten beoordelen, niet alleen de uitkomst.</li><li><b>Meerdere modellen orchestreren</b>: goedkoop model voor routering/classificatie, zwaar model voor de moeilijke vraag. Of de <b>model router</b> laten kiezen.</li><li><b>Hybrid LLM + rules engine</b>: harde bedrijfsregels (bedragen, wetgeving, berekeningen) in gewone code. Het LLM doet taal en interpretatie.</li></ul>",
when:["Antwoorden bevatten fouten die het model zelf zou kunnen zien → <b>self-critique loop</b>.","Deterministische regels (BTW berekenen, limieten) → <b>rules engine in code</b>, niet het LLM.","Kosten omlaag zonder kwaliteitsverlies → klein model routeert, groot model alleen waar nodig."],
traps:["Rekenen en harde regels nooit aan het LLM overlaten als het betrouwbaar moet zijn."],
rel:["multiagent","prompting","kosten"]},

{id:"finetuning",p:"genai",t:"Fine-tuning",s:"SFT, DPO, RFT, distillation: wanneer wel en niet",d:[2,1],
what:"<p><b>Fine-tuning</b> = een bestaand model bijtrainen met eigen voorbeelden. Het verandert <b>gedrag, stijl en format</b>, niet de kennis die actueel moet blijven.</p><ul><li><b>SFT</b> (supervised fine-tuning): voorbeelden van vraag + ideaal antwoord.</li><li><b>DPO</b> (direct preference optimization): voorbeelden van een beter en een slechter antwoord.</li><li><b>RFT</b> (reinforcement fine-tuning): een beoordelaar (grader) geeft punten, voor redeneermodellen.</li><li><b>Distillation</b>: een klein model trainen op de antwoorden van een groot model, zodat het klein + goedkoop + goed genoeg wordt.</li></ul>",
when:["Vaste schrijfstijl, toon of complex format dat prompts niet goed afdwingen → fine-tuning.","Kosten omlaag: klein model laten leren van groot model → <b>distillation</b>.","Actuele feiten of documenten → <b>niet</b> fine-tunen, maar RAG."],
cfg:["Trainingsdata in <b>JSONL</b> (chatformaat: messages met system/user/assistant).","Getraind model deployen: Standard, Global Standard of <b>Developer</b> (om te testen)."],
traps:["Volgorde op het examen: prompt engineering → RAG → fine-tuning."],
rel:["rag","modelkeuze","prompting"]}
);
