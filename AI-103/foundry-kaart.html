{id:"agentservice",p:"agents",t:"Foundry Agent Service",s:"Prompt agents, versies, conversations, responses",d:[2],
what:"<p>De <b>Foundry Agent Service</b> host en draait agents voor je. Een agent bestaat uit: <b>model</b> + <b>instructions</b> (rol, doel, regels) + <b>tools</b> + gespreksgeschiedenis.</p><ul><li><b>Prompt agent</b>: declaratief gedefinieerd (model, instructies, tools). De dienst draait de lus van redeneren en tools aanroepen.</li><li><b>Hosted agent</b>: je eigen agentcode (bijv. Microsoft Agent Framework of LangGraph) in een container, gehost door Foundry.</li><li><b>Workflow</b>: meerdere agents en stappen in een vaste of dynamische volgorde (zie Multi-agent).</li></ul><p>Elke wijziging maakt een nieuwe <b>versie</b> (<code>create_version</code>). Een <b>conversation</b> bewaart de geschiedenis van een gesprek over meerdere beurten.</p><p><b>Classic</b> (SDK 1.x, nog in oude materialen): <code>create_agent</code> → <b>thread</b> → <b>message</b> → <b>run</b>.</p>",
when:["Assistent die zelf tools kiest en meerdere stappen zet → <b>agent</b>.","Eén vaste vraag-antwoordstap zonder tools → gewoon een modelaanroep is genoeg.","Bestaande agentcode (LangGraph, Agent Framework) hosten → <b>hosted agent</b>."],
code:[{l:"Agent maken en ermee chatten (SDK 2.x)",src:"from azure.ai.projects.models import PromptAgentDefinition\n\nagent = project.agents.create_version(\n    agent_name=\"hr-assistent\",\n    definition=PromptAgentDefinition(\n        model=\"gpt-5-mini\",\n        instructions=\"Je beantwoordt HR-vragen op basis van het handboek. \"\n                     \"Weet je het niet, verwijs dan naar hr@bedrijf.nl.\",\n        tools=[],            # zie Tools\n    ),\n)\n\n# OpenAI-client die vastzit aan deze agent\nopenai = project.get_openai_client(agent_name=\"hr-assistent\")\nconversation = openai.conversations.create()   # geheugen voor dit gesprek\n\nr1 = openai.responses.create(conversation=conversation.id,\n                             input=\"Hoeveel vakantiedagen heb ik?\")\nr2 = openai.responses.create(conversation=conversation.id,\n                             input=\"En mag ik die meenemen naar volgend jaar?\")\nprint(r2.output_text)"},
{l:"Classic (SDK 1.x): threads en runs",src:"agent = project_client.agents.create_agent(model=\"gpt-4o\", name=\"hr\",\n                                          instructions=\"...\")\nthread = project_client.agents.threads.create()\nproject_client.agents.messages.create(thread_id=thread.id, role=\"user\",\n                                      content=\"Hoeveel vakantiedagen?\")\nrun = project_client.agents.runs.create_and_process(thread_id=thread.id,\n                                                    agent_id=agent.id)"}],
cfg:["<b>Basic setup</b>: Microsoft beheert de opslag (snel starten).","<b>Standard setup</b>: je koppelt eigen <b>Cosmos DB</b> (gesprekken), <b>Storage</b> (bestanden) en <b>AI Search</b> (vector stores). Voor data-isolatie, compliance en eigen netwerk.","Agent-instructies: rol, doel, grenzen, wanneer welke tool, wat te doen bij twijfel."],
traps:["Instructies zijn geen beveiliging. Grenzen die echt moeten gelden → approvals en tool-rechten."],
rel:["tools","memory","multiagent","hitl","agentsetup"]},

{id:"agentsetup",p:"agents",t:"Agent-setup: basic vs. standard",s:"Waar staan gesprekken, bestanden en vectoren?",d:[1,2],
what:"<table><tr><th></th><th>Basic</th><th>Standard</th></tr><tr><td>Gesprekken/threads</td><td>Door Microsoft beheerd</td><td>Jouw <b>Cosmos DB</b></td></tr><tr><td>Bestanden</td><td>Door Microsoft beheerd</td><td>Jouw <b>Storage account</b></td></tr><tr><td>Vector stores</td><td>Door Microsoft beheerd</td><td>Jouw <b>Azure AI Search</b></td></tr><tr><td>Netwerk</td><td>Publiek</td><td>Kan in je eigen <b>VNet</b> (BYO VNet)</td></tr></table>",
when:["'Data moet in onze eigen resources staan' / 'compliance' / 'private networking voor agents' → <b>standard setup</b>.","Snel prototypen → basic."],
rel:["agentservice","security"]},

{id:"tools",p:"agents",t:"Agent-tools",s:"Overzicht: kennis-tools, actie-tools, eigen tools",d:[2],
what:"<p>Tools geven een agent kennis of actiemogelijkheden. Het model kiest zelf wanneer het een tool gebruikt (<b>tool calling</b>). Drie families:</p><ul><li><b>Kennis</b>: file search, Azure AI Search, web search / Bing grounding, SharePoint, Fabric IQ / Fabric data agent, Work IQ.</li><li><b>Acties en rekenen</b>: code interpreter, browser automation, computer use, image generation.</li><li><b>Eigen koppelingen</b>: function calling, OpenAPI, MCP, Azure Functions, A2A (agent-to-agent).</li></ul><p><b>Toolbox</b> (nieuw): tools centraal beheren en via één MCP-endpoint delen tussen agents, met centrale authenticatie en guardrails.</p>",
when:["Zie de drie subonderwerpen hieronder voor de keuze per situatie."],
rel:["toolsknowledge","toolsactions","toolscustom"]},

{id:"toolsknowledge",p:"tools",t:"Kennis-tools",s:"File search, Azure AI Search, Bing/web search, SharePoint, Fabric",d:[2,5],
what:"<table><tr><th>Tool</th><th>Wat</th><th>Kies als</th></tr><tr><td><b>File search</b></td><td>Je uploadt bestanden; de dienst knipt, embedt en zoekt erin (vector store)</td><td>Een handvol documenten, snel opzetten, weinig beheer</td></tr><tr><td><b>Azure AI Search</b></td><td>Agent zoekt in een <b>bestaande</b> AI Search-index</td><td>Grote of bedrijfsbrede content, eigen indexering, hybrid/semantic, filters, security trimming</td></tr><tr><td><b>Web search / Grounding with Bing</b></td><td>Actuele info van het openbare internet, met bronnen</td><td>Nieuws, publieke actuele feiten</td></tr><tr><td><b>Bing Custom Search</b></td><td>Alleen zoeken op door jou gekozen websites</td><td>Openbaar web, maar alleen betrouwbare domeinen</td></tr><tr><td><b>SharePoint</b></td><td>Zoekt in SharePoint met de rechten van de gebruiker</td><td>Interne Microsoft 365-documenten</td></tr><tr><td><b>Fabric data agent / Fabric IQ</b></td><td>Vragen over data in Microsoft Fabric</td><td>Gestructureerde bedrijfsdata (lakehouse, warehouse)</td></tr></table>",
when:["Vaste documenten, klein → <b>file search</b>.","Grote bestaande index → <b>Azure AI Search-tool</b>.","Actueel openbaar internet → <b>Bing / web search</b>.","Interne SharePoint met gebruikersrechten → <b>SharePoint-tool</b>."],
code:[{l:"File search (schets)",src:"from azure.ai.projects.models import FileSearchTool\n\nvs = openai.vector_stores.create(name=\"hr-handboek\")\nopenai.vector_stores.files.upload_and_poll(vector_store_id=vs.id,\n                                          file=open(\"handboek.pdf\", \"rb\"))\n\ntool = FileSearchTool(vector_store_ids=[vs.id])   # aan agent toevoegen via tools=[tool]"}],

{id:"toolsactions",p:"tools",t:"Actie- & reken-tools",s:"Code interpreter, browser automation, computer use, image generation",d:[2],
what:"<table><tr><th>Tool</th><th>Wat</th><th>Kies als</th></tr><tr><td><b>Code interpreter</b></td><td>Agent schrijft en draait Python in een sandbox. Kan bestanden lezen en grafieken maken</td><td>Rekenen, data-analyse (CSV/Excel), grafieken, bestandsconversie</td></tr><tr><td><b>Browser automation</b></td><td>Agent bedient een echte browser (klikken, formulieren)</td><td>Taken op websites zonder API</td></tr><tr><td><b>Computer use</b></td><td>Agent bedient een desktop via screenshots</td><td>Oude desktopapplicaties zonder API</td></tr><tr><td><b>Image generation</b></td><td>Agent maakt afbeeldingen</td><td>Beeld genereren binnen een gesprek</td></tr></table>",

{id:"toolscustom",p:"tools",t:"Eigen tools: function, OpenAPI, MCP, Functions, A2A",s:"Je eigen systemen en API's aan een agent koppelen",d:[2],
what:"<table><tr><th>Tool</th><th>Waar draait de code?</th><th>Kies als</th></tr><tr><td><b>Function calling</b></td><td>In <b>jouw app</b> (client-side). Agent geeft argumenten, jouw code voert uit</td><td>Logica die in je eigen app zit, volledige controle</td></tr><tr><td><b>OpenAPI</b></td><td>De dienst roept <b>jouw REST API</b> aan op basis van een OpenAPI-spec</td><td>Bestaande REST API met spec, live data of acties</td></tr><tr><td><b>MCP</b> (Model Context Protocol)</td><td>Een <b>MCP-server</b> (eigen of van derden) die tools aanbiedt</td><td>Standaard koppeling, herbruikbaar tussen agents en frameworks</td></tr><tr><td><b>Azure Functions</b></td><td>Serverless functie in Azure, vaak via een queue</td><td>Langlopende of asynchrone taken</td></tr><tr><td><b>A2A</b> (agent-to-agent)</td><td>Een andere agent, ook buiten Foundry</td><td>Taak delegeren aan een gespecialiseerde agent</td></tr></table>",

code:[{l:"MCP-tool met verplichte goedkeuring (actuele docs)",src:"from azure.ai.projects.models import PromptAgentDefinition, MCPTool\n\ntool = MCPTool(\n    server_label=\"api-specs\",\n    server_url=\"https://api.githubcopilot.com/mcp\",\n    require_approval=\"always\",            # elke aanroep eerst goedkeuren\n    project_connection_id=\"my-mcp-connection\",  # sleutel staat in een connection\n)\nagent = project.agents.create_version(\n    agent_name=\"dev-helper\",\n    definition=PromptAgentDefinition(model=\"gpt-5-mini\",\n                                     instructions=\"Use MCP tools as needed\",\n                                     tools=[tool]))"}],

rel:["structured","hitl","connections"]},

{id:"memory",p:"agents",t:"Geheugen & gesprekken",s:"Conversations, previous_response_id, memory, context window",d:[2],
what:"<ul><li><b>Kortetermijngeheugen</b>: de geschiedenis van het huidige gesprek. Via een <b>conversation</b> (opgeslagen door de dienst) of door <b>previous_response_id</b> mee te geven.</li><li><b>Langetermijngeheugen</b> (<b>memory</b>): feiten over de gebruiker die bewaard blijven tussen gesprekken (voorkeuren, eerdere afspraken).</li><li><b>Context window</b>: hoeveel tokens het model in één keer kan verwerken. Lange gesprekken worden ingekort of samengevat (<b>truncation</b>).</li><li><b>Conversation-tracking approach</b> (studiegids): kies bewust tussen stateful (de dienst bewaart) en stateless (jouw app stuurt de geschiedenis mee).</li></ul>",
when:["Vervolgvragen moeten werken → <b>conversation</b> of <b>previous_response_id</b>.","Agent moet voorkeuren onthouden over sessies heen → <b>memory</b>.","Zelf volledige controle over opslag en privacy → stateless, geschiedenis in je eigen database."],
traps:["Een model onthoudt uit zichzelf niets tussen aanroepen. Geheugen = geschiedenis meesturen of door de dienst laten bewaren."],
rel:["agentservice","sdk"]},

{id:"multiagent",p:"agents",t:"Multi-agent & orchestratie",s:"Workflows, patronen, Agent Framework, A2A",d:[2],
what:"<p>Meerdere gespecialiseerde agents laten samenwerken, elk met een eigen rol en eigen tools.</p><p><b>Orchestratiepatronen:</b></p><ul><li><b>Sequential</b>: A → B → C, vaste volgorde (bijv. onderzoeken → schrijven → controleren).</li><li><b>Concurrent</b>: meerdere agents tegelijk, resultaten samenvoegen.</li><li><b>Handoff</b>: een agent geeft het gesprek door aan de juiste specialist (triage).</li><li><b>Group chat</b>: agents overleggen onder leiding van een manager.</li><li><b>Magentic</b>: een manager-agent plant dynamisch en verdeelt taken.</li><li><b>Human-in-the-loop</b>: een mens als stap in de workflow.</li></ul><p><b>Waar bouw je het?</b> <b>Workflows</b> in Foundry (visueel/YAML), <b>Microsoft Agent Framework</b> (de opvolger van Semantic Kernel + AutoGen, in code), of agents koppelen via <b>A2A</b>. In classic Foundry bestonden <b>connected agents</b> (een agent als tool van een hoofdagent).</p>",
when:["Eén agent wordt te complex (te veel tools, verschillende rollen) → <b>opsplitsen in specialisten</b>.","Klantvraag naar de juiste afdeling-agent → <b>handoff / triage</b>.","Vaste stappen met controle tussendoor → <b>sequential workflow</b> + approval-stap."],
traps:["Meer agents = meer kosten en latency. Alleen opsplitsen als het de kwaliteit of het beheer echt verbetert."],
rel:["agentservice","hitl","reflection","agenteval"]},

{id:"hitl",p:"agents",t:"Human-in-the-loop & approvals",s:"Semi-autonome agents met goedkeuring vóór uitvoering",d:[2,1],
what:"<p><b>Human-in-the-loop</b>: een mens keurt een stap goed voordat die wordt uitgevoerd. <b>Semi-autonoom</b>: de agent doet kleine dingen zelf en vraagt toestemming voor risicovolle acties.</p><p>Bij MCP-tools: <code>require_approval=\"always\"</code>. De response bevat dan een <code>mcp_approval_request</code>. Jouw app laat het aan een mens zien en stuurt een <code>mcp_approval_response</code> (approve true/false) terug. Bij function calling bouw je de goedkeuring zelf in, vóórdat jouw code de functie uitvoert. In workflows: een <b>approval-stap</b>.</p>",
when:["Geld, verwijderen, versturen, contracten → <b>approval vóór uitvoering</b>.","Drempels (bijv. boven €500) → regel in <b>code</b>, plus approval boven de drempel."],
code:[{l:"Goedkeuring afhandelen (actuele docs)",src:"from openai.types.responses.response_input_param import McpApprovalResponse\n\nresponse = openai.responses.create(\n    conversation=conversation.id, input=\"Maak een issue aan voor bug 12\",\n    extra_body={\"agent_reference\": {\"name\": agent.name, \"type\": \"agent_reference\"}})\n\nantwoorden = []\nfor item in response.output:\n    if item.type == \"mcp_approval_request\":\n        ok = mens_keurt_goed(item.server_label, item.name, item.arguments)\n        antwoorden.append(McpApprovalResponse(type=\"mcp_approval_response\",\n                                              approve=ok,\n                                              approval_request_id=item.id))\n\nresponse = openai.responses.create(\n    input=antwoorden, previous_response_id=response.id,\n    extra_body={\"agent_reference\": {\"name\": agent.name, \"type\": \"agent_reference\"}})"}],
traps:["System prompt of lage temperature is geen betrouwbare handhaving."],
rel:["governance","toolscustom","multiagent"]},

{id:"agenteval",p:"agents",t:"Agents monitoren & evalueren",s:"Intent resolution, task adherence, tool call accuracy, error analysis",d:[2,1],
what:"<p>Agents beoordeel je op meer dan het eindantwoord:</p><ul><li><b>Intent resolution</b>: begreep de agent wat de gebruiker wilde?</li><li><b>Task adherence</b>: deed hij wat de instructies vroegen, binnen de grenzen?</li><li><b>Tool call accuracy</b>: koos hij de juiste tool met de juiste argumenten?</li><li>Plus groundedness, relevance en veiligheidsevaluators.</li></ul><p><b>Error analysis</b>: in de <b>traces</b> zoeken waar het misging (verkeerde tool, lege zoekresultaten, time-out) en dat oplossen met betere instructies, tool-beschrijvingen of data.</p>",
when:["Agent gebruikt verkeerde tool → tool call accuracy meten + tool-beschrijvingen verbeteren.","Live kwaliteit bewaken → tracing + <b>continuous evaluation</b>."],
rel:["evaluaties","tracing","monitoring"]},

{id:"agentidentity",p:"agents",t:"Agent identity",s:"Eigen Entra-identiteit per agent",d:[1,2],
what:"Agents in Foundry kunnen een eigen <b>Entra ID-identiteit</b> krijgen (<b>agent identity</b>). Daarmee roepen ze tools en API's aan met hun <b>eigen</b> rechten (RBAC), en zie je in logs welke agent wat deed. Alternatief: de <b>managed identity van het project</b>, of <b>on-behalf-of</b> (met de rechten van de ingelogde gebruiker, bijv. bij SharePoint).",
when:["Agent moet bij een Azure-resource zonder sleutels → <b>agent identity of project managed identity + RBAC-rol</b>.","Agent mag alleen zien wat de gebruiker zelf mag zien → <b>on-behalf-of / identity passthrough</b>."],
rel:["security","governance"]}
);

// ===== Azure AI Search =====
N.push(
{id:"index",p:"search",t:"Index & velden",s:"Velden, attributen, vectorvelden, HNSW",d:[5],
what:"<p>Een <b>index</b> is de doorzoekbare opslag, vergelijkbaar met een tabel. Elk <b>document</b> (rij) heeft <b>velden</b> (kolommen). Per veld stel je <b>attributen</b> in:</p><table><tr><th>Attribuut</th><th>Betekent</th></tr><tr><td><b>key</b></td><td>Unieke ID van het document (precies één veld, type string)</td></tr><tr><td><b>searchable</b></td><td>Doorzoekbaar met full-text (woorden)</td></tr><tr><td><b>filterable</b></td><td>Bruikbaar in <code>$filter</code> (bijv. categorie eq 'HR')</td></tr><tr><td><b>sortable</b></td><td>Sorteren op dit veld</td></tr><tr><td><b>facetable</b></td><td>Tellingen per waarde (filters in een zoek-UI)</td></tr><tr><td><b>retrievable</b></td><td>Komt terug in de resultaten</td></tr></table><p><b>Vectorveld</b>: type <code>Collection(Edm.Single)</code> met <b>dimensions</b> (bijv. 1536) en een <b>vector search profile</b> met algoritme <b>HNSW</b> (snel, benaderend, standaard) of <b>exhaustive KNN</b> (exact, traag, voor kleine sets of testen).</p>",
when:["Filteren op afdeling of datum → veld <b>filterable</b>.","Alleen tonen, niet zoeken → <b>retrievable</b> maar niet searchable (spaart ruimte).","Zoeken op betekenis → <b>vectorveld</b> + embeddingmodel."],
code:[{l:"Index met vectorveld (Python)",src:"from azure.search.documents.indexes.models import (\n    SearchIndex, SimpleField, SearchableField, SearchField, SearchFieldDataType,\n    VectorSearch, HnswAlgorithmConfiguration, VectorSearchProfile)\n\nfields = [\n    SimpleField(name=\"id\", type=SearchFieldDataType.String, key=True),\n    SearchableField(name=\"content\"),\n    SimpleField(name=\"category\", type=SearchFieldDataType.String, filterable=True),\n    SearchField(name=\"contentVector\",\n                type=SearchFieldDataType.Collection(SearchFieldDataType.Single),\n                searchable=True, vector_search_dimensions=1536,\n                vector_search_profile_name=\"hnsw-profiel\"),\n]\nvector_search = VectorSearch(\n    algorithms=[HnswAlgorithmConfiguration(name=\"hnsw\")],\n    profiles=[VectorSearchProfile(name=\"hnsw-profiel\",\n                                  algorithm_configuration_name=\"hnsw\")])\nindex_client.create_or_update_index(\n    SearchIndex(name=\"handleidingen\", fields=fields, vector_search=vector_search))"}],
cfg:["<b>Analyzer</b> per tekstveld: taal (bijv. <code>nl.microsoft</code>) voor betere woordherkenning.","Tiers: Free, Basic, Standard (S1-S3), Storage Optimized. Semantic ranker heeft minimaal Basic nodig.","Schalen: <b>replicas</b> (meer queries per seconde, hoge beschikbaarheid) en <b>partitions</b> (meer opslag, snellere indexering)."],
traps:["Replicas = meer query-capaciteit en beschikbaarheid (≥ 2 voor leesbeschikbaarheid, ≥ 3 voor lezen + schrijven). Partitions = meer opslag.","Attributen van een bestaand veld kun je vaak niet wijzigen zonder te herindexeren."],
rel:["indexers","searchquery","embeddings"]},

{id:"indexers",p:"search",t:"Indexers & data sources",s:"Automatisch content binnenhalen uit Blob, SQL, Cosmos DB",d:[5],
what:"<p>Een <b>indexer</b> is een crawler die automatisch content uit een <b>data source</b> haalt en in de index zet. Bronnen: Azure Blob Storage, Data Lake, SQL Database, Cosmos DB, Table Storage, SharePoint (preview), OneLake.</p><p>Flow: <b>data source → (skillset) → index</b>. Met <b>field mappings</b> koppel je bronvelden aan indexvelden, met <b>output field mappings</b> verrijkte velden uit de skillset.</p>",
when:["Bestanden in Blob automatisch doorzoekbaar maken → <b>indexer</b> met Blob als data source.","Alleen nieuwe/gewijzigde bestanden verwerken → <b>change detection</b> (standaard bij Blob via LastModified) en <b>schedule</b>.","Content die niet in een ondersteunde bron staat → zelf pushen met de <b>push API</b> (<code>upload_documents</code>)."],
code:[{l:"Indexer uitvoeren / status bekijken",src:"indexer_client.run_indexer(\"handleidingen-indexer\")\nstatus = indexer_client.get_indexer_status(\"handleidingen-indexer\")\nprint(status.last_result.status, status.last_result.error_message)"}],
cfg:["Indexer leest de bron het liefst met de <b>managed identity van de Search-service</b> + rol <b>Storage Blob Data Reader</b>.","<b>Schedule</b>: bijv. elk uur.","<b>Deletion detection</b>: verwijderde bronbestanden ook uit de index halen (soft delete).","<code>dataToExtract</code>: <code>contentAndMetadata</code>; <code>imageAction</code>: <code>generateNormalizedImages</code> (nodig voor OCR)."],
traps:["OCR op afbeeldingen in PDF's werkt alleen als <code>imageAction</code> is ingesteld én er een OCR-skill is."],
rel:["index","skillsets"]},

{id:"skillsets",p:"search",t:"Skillsets & enrichment",s:"Built-in skills, custom skills, knowledge store",d:[5,3,4],
what:"<p>Een <b>skillset</b> verrijkt content tijdens het indexeren met AI (<b>AI enrichment</b>). Elke <b>skill</b> leest velden en schrijft nieuwe velden.</p><p><b>Built-in skills</b> (selectie):</p><ul><li>Tekst: <b>Text Split</b> (chunking), <b>Language Detection</b>, <b>Entity Recognition</b>, <b>Key Phrase Extraction</b>, <b>PII Detection</b>, <b>Sentiment</b>, <b>Text Translation</b>, Merge.</li><li>Beeld: <b>OCR</b>, <b>Image Analysis</b> (tags, captions).</li><li>Layout: <b>Document Layout</b> (structuur, koppen, tabellen, markdown-chunks).</li><li>Vectoren: <b>Azure OpenAI Embedding</b>.</li><li>Generatief: <b>GenAI Prompt</b> (een LLM laten samenvatten of beschrijven tijdens indexeren).</li></ul><p><b>Custom skill</b>: je eigen logica als <b>Web API</b> (vaak een Azure Function) die de indexer aanroept.</p><p><b>Knowledge store</b>: verrijkte output ook opslaan in Storage (tabellen/blobs) via <b>projections</b>, voor analyse buiten Search (bijv. Power BI).</p>",
when:["Gescande PDF's doorzoekbaar → <b>OCR</b> (+ Merge).","Chunken + embedden tijdens indexeren → <b>Text Split</b> + <b>Azure OpenAI Embedding</b> (<b>integrated vectorization</b>).","Eigen classificatie of externe API tijdens indexeren → <b>custom skill</b> (Web API).","Verrijkte data analyseren in Power BI → <b>knowledge store</b>."],
cfg:["Text Split: <code>textSplitMode</code> (pages/sentences), <code>maximumPageLength</code>, <code>pageOverlapLength</code>.","Built-in skills die Foundry Tools gebruiken hebben een gekoppelde <b>Foundry/AI-services resource</b> nodig (voor facturering boven het gratis aantal).","Custom skill: input/output als JSON met <code>values</code>-array en <code>recordId</code>."],
traps:["Custom skill = Web API-contract (<code>values</code> met <code>recordId</code> en <code>data</code>). Antwoorden moeten dezelfde recordId's teruggeven."],
rel:["indexers","integratedvec","docsextract"]},

{id:"integratedvec",p:"search",t:"Integrated vectorization",s:"Chunken en embedden door Search zelf, bij indexeren én zoeken",d:[5],
what:"Met <b>integrated vectorization</b> doet Azure AI Search het chunken en embedden zelf: bij het <b>indexeren</b> (Text Split + Embedding-skill) en bij het <b>zoeken</b> (een <b>vectorizer</b> op de index zet de zoektekst om in een vector). Je app stuurt dan gewoon tekst, geen vectoren.",
when:["Minimale eigen code voor vector search → <b>integrated vectorization</b> + <code>VectorizableTextQuery</code>.","Zelf vectoren berekenen in je app → <code>VectorizedQuery</code> met je eigen vector."],
code:[{l:"Zoeken met tekst; Search maakt de vector",src:"from azure.search.documents.models import VectorizableTextQuery\n\nvq = VectorizableTextQuery(text=\"reset na stroomuitval\",\n                           k_nearest_neighbors=5, fields=\"contentVector\")\nresults = search_client.search(search_text=None, vector_queries=[vq])"}],
cfg:["<b>Vectorizer</b> in het vector search profile: verwijst naar je Azure OpenAI/Foundry embedding-deployment.","Zelfde embeddingmodel als bij het indexeren."],
rel:["skillsets","searchquery","embeddings"]},

{id:"searchquery",p:"search",t:"Zoektypes",s:"Keyword (BM25), vector, hybrid + RRF, semantic ranker, filters",d:[5,2],
what:"<table><tr><th>Type</th><th>Hoe</th><th>Sterk in</th></tr><tr><td><b>Keyword / full-text</b></td><td>Woorden matchen, ranking met <b>BM25</b></td><td>Exacte termen, codes, namen</td></tr><tr><td><b>Vector</b></td><td>Dichtstbijzijnde embeddings</td><td>Betekenis, synoniemen, andere talen</td></tr><tr><td><b>Hybrid</b></td><td>Keyword + vector tegelijk, samengevoegd met <b>RRF</b></td><td>Beide soorten vragen. Standaardadvies voor RAG</td></tr><tr><td><b>Semantic ranker</b></td><td>Taalmodel <b>herordent</b> de top-50 (L2 reranking), geeft captions en answers</td><td>Beste resultaat bovenaan</td></tr></table><p><b>RRF</b> (Reciprocal Rank Fusion) = formule die twee ranglijsten samenvoegt. De <b>semantic ranker</b> is een apart model daarbovenop.</p><p>Verder: <b>filters</b> (<code>$filter</code>, OData-syntax), <b>scoring profiles</b> (velden of versheid zwaarder laten wegen), <b>facets</b>, <b>synonym maps</b>, <b>security trimming</b> (filter op groeps-ID's zodat gebruikers alleen hun documenten zien).</p>",
when:["Exacte productcodes worden gemist bij vector search → <b>hybrid</b>.","Juiste document staat in top-10 maar niet bovenaan → <b>semantic ranker</b>.","Gebruiker mag alleen eigen afdeling zien → <b>security filter</b> op groeps-ID.","Recente documenten belangrijker → <b>scoring profile</b> met freshness."],
code:[{l:"Hybrid + semantic + filter",src:"from azure.search.documents import SearchClient\nfrom azure.search.documents.models import VectorizableTextQuery\n\nclient = SearchClient(endpoint=\"https://mijn-search.search.windows.net\",\n                      index_name=\"handleidingen\",\n                      credential=DefaultAzureCredential())\nresults = client.search(\n    search_text=\"handleiding XK-2210-B\",                       # keyword-deel\n    vector_queries=[VectorizableTextQuery(text=\"handleiding XK-2210-B\",\n                    k_nearest_neighbors=50, fields=\"contentVector\")],  # vector-deel\n    query_type=\"semantic\",                                       # semantic ranker\n    semantic_configuration_name=\"default\",\n    filter=\"category eq 'manual'\",\n    select=[\"title\", \"content\"], top=5)\nfor r in results:\n    print(r[\"@search.reranker_score\"], r[\"title\"])"}],
cfg:["Semantic ranker: een <b>semantic configuration</b> op de index (title-, content- en keywords-velden).","<code>query_type=\"semantic\"</code> + <code>semantic_configuration_name</code>.","<code>queryType=full</code> = Lucene-syntax (wildcards, fuzzy <code>~</code>, boosts <code>^</code>)."],
traps:["RRF ≠ semantic ranker.","Semantic ranker herordent alleen; het vindt niets wat de eerste zoekstap miste."],
rel:["index","rag","agenticretrieval"]},

{id:"agenticretrieval",p:"search",t:"Agentic retrieval & knowledge bases",s:"Foundry IQ: LLM plant de zoekvragen",d:[5,2],
what:"<p>Bij <b>agentic retrieval</b> splitst een LLM een complexe vraag op in meerdere deelvragen, zoekt die parallel (over één of meer bronnen) en voegt de resultaten samen. Dat heet <b>query planning</b>. Je stelt dit in als <b>knowledge base</b> in Azure AI Search (in Foundry: <b>Foundry IQ</b>).</p><p>Agents gebruiken een knowledge base via een <b>MCP-endpoint</b> (de tool <code>knowledge_base_retrieve</code>).</p>",
when:["Complexe vragen met meerdere onderdelen of over meerdere bronnen → <b>agentic retrieval</b>.","Eenvoudige vraag-antwoord → gewone hybrid + semantic query is genoeg (goedkoper, sneller)."],
traps:["Agentic retrieval kost extra LLM-aanroepen, dus meer latency en kosten."],
rel:["searchquery","toolsknowledge","rag"]}
);

// ===== Documenten =====
N.push(
{id:"cu",p:"docs",t:"Content Understanding",s:"Analyzers voor documenten, beeld, audio en video",d:[5,3],
what:"<p><b>Azure Content Understanding</b> (een Foundry Tool) zet ongestructureerde content om in <b>markdown</b> en <b>gestructureerde velden</b>, voor <b>documenten, beeld, audio en video</b>.</p><p><b>Bouwstenen:</b></p><ul><li><b>Analyzer</b>: de configuratie: welke extractie, welk veldschema, welke modellen. <b>Prebuilt</b> analyzers (bijv. voor facturen, RAG-ingestie van documenten/beeld/audio/video, callcenter-analyse) of <b>custom</b>.</li><li><b>Content extraction</b>: OCR, layout (alinea's, tabellen, secties), barcodes, formules. Bij audio/video: transcriptie en visuele elementen.</li><li><b>Field schema</b>: jouw velden met een type en één van drie <b>methods</b>:<br><b>extract</b> = letterlijk overnemen (alleen documenten), <b>classify</b> = kiezen uit vaste categorieën, <b>generate</b> = vrij laten genereren (samenvatting, scènebeschrijving).</li><li><b>Segmentation</b> (<code>enableSegment</code>): document of video opdelen in logische stukken (per documenttype, per scène).</li><li><b>Confidence scores</b> (0-1) en <b>grounding</b> (waar in het bronbestand staat de waarde) via <code>estimateFieldSourceAndConfidence</code>.</li><li><b>Foundry models</b>: je koppelt eigen deployments van een LLM en een embeddingmodel.</li></ul><p><b>Modi:</b> standaard (één document, één taak) en <b>pro mode</b> (redeneren over meerdere documenten en referentiedata, bijv. factuur controleren tegen contract). Nieuwer in preview: <b>agentic mode</b>.</p>",
when:["Velden uit documenten met wisselende layouts → <b>custom analyzer met field schema</b>.","Schone markdown van documenten voor RAG/agents → <b>Content Understanding</b> (prebuilt document search-analyzer).","Video opdelen in scènes met beschrijving en tijdstempel → <b>video-analyzer</b>.","Callcenter-opnames: samenvatting, sentiment, onderwerpen → <b>audio-analyzer</b>.","Factuur controleren tegen een contract → <b>pro mode</b>.","Automatisch verwerken alleen bij hoge zekerheid → <b>confidence scores</b> + drempel; anders menselijke review."],
code:[{l:"Analyzer-definitie (JSON, REST)",src:"PUT {endpoint}/contentunderstanding/analyzers/factuur-analyzer?api-version=2025-11-01\n{\n  \"baseAnalyzerId\": \"prebuilt-document\",\n  \"config\": { \"estimateFieldSourceAndConfidence\": true },\n  \"fieldSchema\": {\n    \"fields\": {\n      \"VendorName\":  { \"type\": \"string\", \"method\": \"extract\",  \"description\": \"Naam leverancier\" },\n      \"InvoiceDate\": { \"type\": \"date\",   \"method\": \"extract\" },\n      \"Total\":       { \"type\": \"number\", \"method\": \"extract\" },\n      \"Category\":    { \"type\": \"string\", \"method\": \"classify\",\n                       \"enum\": [\"IT\", \"Facilitair\", \"Overig\"] },\n      \"Summary\":     { \"type\": \"string\", \"method\": \"generate\",\n                       \"description\": \"Eén zin over wat er gekocht is\" }\n    }\n  },\n  \"models\": { \"completion\": \"gpt-4.1\", \"embedding\": \"text-embedding-3-large\" }\n}"},
{l:"Analyseren (REST, asynchroon)",src:"POST {endpoint}/contentunderstanding/analyzers/factuur-analyzer:analyze?api-version=2025-11-01\n{ \"inputs\": [ { \"url\": \"https://.../factuur-0042.pdf\" } ] }\n\n# → 202 Accepted + header Operation-Location\n# → GET die URL tot status = Succeeded\n# → result.contents[0].markdown en result.contents[0].fields"}],
cfg:["API-versie GA: <b>2025-11-01</b>.","Content Understanding gebruikt <b>jouw</b> model-deployments: die moeten bestaan in de Foundry resource.","Guardrails van de gekoppelde deployment gelden ook hier."],
traps:["<b>extract</b> werkt alleen op documenten. Voor audio/video gebruik je generate of classify.","OCR alleen geeft tekst, geen velden met betekenis."],
rel:["docintel","docsextract","cuvisual","rag"]},

{id:"docintel",p:"docs",t:"Document Intelligence",s:"Prebuilt modellen (invoice, receipt, ID, layout, read), custom models",d:[5],
what:"<p><b>Azure Document Intelligence</b> (vroeger Form Recognizer) is de gespecialiseerde documentdienst.</p><ul><li><b>Read</b>: OCR (tekst, regels, woorden, talen, handschrift).</li><li><b>Layout</b>: tekst + tabellen + selectievakjes + structuur, ook als markdown.</li><li><b>Prebuilt</b>: invoice, receipt, ID document, business card, W-2, health insurance card, contract, bankafschrift, enz. Velden direct beschikbaar.</li><li><b>Custom template</b>: vaste layout (formulieren die er altijd hetzelfde uitzien). Weinig voorbeelden nodig (5+).</li><li><b>Custom neural</b>: wisselende layouts van hetzelfde soort document.</li><li><b>Composed model</b>: meerdere custom modellen samen, met automatische keuze per document.</li><li><b>Custom classifier</b>: eerst bepalen wat voor document het is.</li></ul>",
when:["Standaarddocument (factuur, bon, ID) zonder training → <b>prebuilt model</b>.","Eigen formulier, altijd dezelfde layout → <b>custom template</b>.","Eigen documentsoort, wisselende layouts → <b>custom neural</b>.","Mix van documentsoorten in één stroom → <b>classifier</b> + <b>composed model</b>."],
code:[{l:"Factuur analyseren (Python)",src:"from azure.ai.documentintelligence import DocumentIntelligenceClient\nfrom azure.ai.documentintelligence.models import AnalyzeDocumentRequest\n\nclient = DocumentIntelligenceClient(\"https://mijn-foundry.cognitiveservices.azure.com/\",\n                                    DefaultAzureCredential())\npoller = client.begin_analyze_document(\n    \"prebuilt-invoice\", AnalyzeDocumentRequest(url_source=\"https://.../factuur.pdf\"))\nresult = poller.result()\nfor doc in result.documents:\n    print(doc.fields[\"VendorName\"].content, doc.fields[\"InvoiceTotal\"].content)"}],

{id:"imageedit",p:"vision",t:"Beeld bewerken",s:"Inpainting met mask, prompt-gestuurde aanpassingen",d:[3],
what:"<p><b>Image edit</b>: je geeft een bestaande afbeelding + prompt, en het model past hem aan.</p><ul><li><b>Mask-based edit / inpainting</b>: een <b>mask</b> (masker) is een afbeelding van hetzelfde formaat waarin het <b>transparante</b> deel aangeeft wat opnieuw gegenereerd mag worden. De rest blijft pixel voor pixel gelijk.</li><li><b>Prompt-driven edit</b>: zonder mask, het model past aan wat de prompt vraagt (bijv. 'maak het avond'). Minder controle.</li><li><b>Outpainting</b>: het beeld buiten de randen uitbreiden.</li></ul>",
when:["Alleen de achtergrond vervangen, product onveranderd → <b>edit + mask</b> over de achtergrond.","Object verwijderen of toevoegen op één plek → <b>inpainting</b> met mask op die plek.","Algemene stijl of sfeer veranderen → prompt-driven edit."],

cfg:["Mask: <b>zelfde afmetingen</b> als het origineel, PNG met <b>alfakanaal</b> (transparantie).","<b>input_fidelity</b>: hoog = details van het origineel (gezichten, logo's) beter behouden."],

{id:"language",p:"text",t:"Azure Language",s:"NER, PII, sentiment, key phrases, taaldetectie, samenvatten, CLU",d:[4],
what:"<p><b>Azure Language</b> (een Foundry Tool) bevat kant-en-klare taalfuncties:</p><table><tr><th>Functie</th><th>Wat</th></tr><tr><td><b>Language detection</b></td><td>Welke taal (met betrouwbaarheidsscore)</td></tr><tr><td><b>Sentiment analysis</b> + <b>opinion mining</b></td><td>Positief/neutraal/negatief/gemengd per document en zin. Opinion mining: sentiment per aspect ('eten goed, bediening traag')</td></tr><tr><td><b>Key phrase extraction</b></td><td>Belangrijkste termen</td></tr><tr><td><b>Named entity recognition (NER)</b></td><td>Personen, organisaties, locaties, datums, bedragen</td></tr><tr><td><b>Entity linking</b></td><td>Entiteit koppelen aan Wikipedia (welke 'Mars'?)</td></tr><tr><td><b>PII detection</b></td><td>Persoonsgegevens vinden en <b>redigeren</b> (ook in gesprekken)</td></tr><tr><td><b>Summarization</b></td><td><b>Extractive</b> (belangrijkste zinnen letterlijk) of <b>abstractive</b> (nieuwe samenvatting), ook voor gesprekken</td></tr><tr><td><b>Text analytics for health</b></td><td>Medische entiteiten en relaties</td></tr><tr><td><b>CLU</b> (conversational language understanding)</td><td>Intents (bedoeling) en entities uit korte zinnen, zelf trainen met utterances</td></tr><tr><td><b>Custom question answering</b></td><td>Vraag-antwoordbank uit FAQ's</td></tr><tr><td><b>Custom text classification / custom NER</b></td><td>Eigen categorieën of entiteiten trainen met gelabelde voorbeelden</td></tr></table>",
when:["Persoonsgegevens verwijderen → <b>PII detection</b> (redacted_text).","Sentiment per aspect van een review → <b>sentiment + opinion mining</b>.","Taal onbekend vóór verdere verwerking → <b>language detection</b>.","Intentie van een korte opdracht ('zet de lamp aan') → <b>CLU</b>.","Eigen documentcategorieën met voorbeelden → <b>custom text classification</b> (single- of multi-label)."],
code:[{l:"PII redigeren + sentiment (Python)",src:"from azure.ai.textanalytics import TextAnalyticsClient\n\nclient = TextAnalyticsClient(endpoint=\"https://mijn-foundry.cognitiveservices.azure.com/\",\n                             credential=DefaultAzureCredential())\n\ndocs = [\"Bel Jan de Vries op 06-12345678, de levering was echt slecht.\"]\n\npii = client.recognize_pii_entities(docs, language=\"nl\")\nprint(pii[0].redacted_text)          # Bel ************ op ***********, ...\nfor e in pii[0].entities:\n    print(e.text, e.category, e.confidence_score)\n\nsent = client.analyze_sentiment(docs, language=\"nl\", show_opinion_mining=True)\nprint(sent[0].sentiment, sent[0].confidence_scores)\n\n# Andere methodes: detect_language, extract_key_phrases, recognize_entities,\n# recognize_linked_entities, begin_abstract_summary, begin_extract_summary"}],
cfg:["<code>language</code>: taalcode (bijv. <code>nl</code>), of laat detecteren.","PII: <code>categories_filter</code> (alleen bepaalde soorten), <code>domain</code> (bijv. phi voor medisch).","Lange taken (samenvatten, health) zijn <b>asynchroon</b>: <code>begin_...</code> + poller.","Package: <code>azure-ai-textanalytics</code>."],

{id:"speechstt",p:"speech",t:"Speech to text",s:"Real-time, fast, batch, diarization, phrase list",d:[4],
what:"<p><b>Speech to text (STT)</b> zet spraak om naar tekst. Vormen:</p><ul><li><b>Real-time</b>: live van een microfoon of stream, via de Speech SDK.</li><li><b>Fast transcription</b>: een audiobestand snel (synchroon) transcriberen.</li><li><b>Batch transcription</b>: grote hoeveelheden opnames asynchroon (uit Blob Storage).</li><li><b>LLM-speech / gpt-4o-transcribe</b>: transcriptie met een generatief model.</li></ul><p>Extra's: <b>diarization</b> (wie sprak wanneer, sprekers scheiden), <b>language identification</b> (taal automatisch herkennen), <b>phrase list</b> (lijstje woorden dat beter herkend moet worden, zonder training), <b>profanity filter</b>, <b>word-level timestamps</b>.</p>",

code:[{l:"Eén zin herkennen (Speech SDK)",src:"import azure.cognitiveservices.speech as speechsdk\n\nspeech_config = speechsdk.SpeechConfig(\n    endpoint=\"https://mijn-foundry.cognitiveservices.azure.com/\",\n    token_credential=DefaultAzureCredential())   # keyless (recente SDK)\nspeech_config.speech_recognition_language = \"nl-NL\"\n\naudio_config = speechsdk.audio.AudioConfig(filename=\"gesprek.wav\")\nrecognizer = speechsdk.SpeechRecognizer(speech_config=speech_config,\n                                        audio_config=audio_config)\n\n# Phrase list: vaktermen beter herkennen, zonder training\nphrases = speechsdk.PhraseListGrammar.from_recognizer(recognizer)\nphrases.addPhrase(\"WerkZekerPlus\")\n\nresult = recognizer.recognize_once_async().get()\nif result.reason == speechsdk.ResultReason.RecognizedSpeech:\n    print(result.text)"}],

{id:"customspeech",p:"speech",t:"Custom speech",s:"Eigen spraakmodel trainen voor jargon, accent, ruis",d:[4],

code:[{l:"Custom model gebruiken",src:"speech_config.endpoint_id = \"<id-van-je-custom-speech-endpoint>\"\n# daarna gewoon SpeechRecognizer zoals bij standaard STT"}],

{id:"speechtts",p:"speech",t:"Text to speech",s:"Neural voices, SSML, custom neural voice",d:[4],
what:"<p><b>Text to speech (TTS)</b> laat de computer spreken met <b>neural voices</b> (natuurlijke stemmen in veel talen, bijv. <code>nl-NL-FennaNeural</code>).</p><p><b>SSML</b> (Speech Synthesis Markup Language) is XML waarmee je de uitspraak stuurt: stem, <b>prosody</b> (snelheid, toonhoogte, volume), <b>break</b> (pauze), <b>say-as</b> (datum, telefoonnummer), <b>phoneme</b> (uitspraak), en spreekstijlen (<code>mstts:express-as</code>, bijv. vrolijk of empathisch).</p><p><b>Custom neural voice</b>: een eigen merkstem op basis van opnames van een stemacteur (Limited Access, toestemming van de spreker vereist). <b>Personal voice</b>: stem nabootsen uit een korte opname, ook Limited Access.</p>",
when:["Agent moet antwoorden uitspreken → <b>TTS</b>.","Uitspraak, pauzes, tempo, stijl sturen → <b>SSML</b>.","Unieke merkstem → <b>custom neural voice</b> (met goedkeuring)."],
code:[{l:"SSML uitspreken",src:"speech_config.speech_synthesis_voice_name = \"nl-NL-FennaNeural\"\nsynth = speechsdk.SpeechSynthesizer(speech_config=speech_config,\n    audio_config=speechsdk.audio.AudioOutputConfig(filename=\"antwoord.wav\"))\n\nssml = \"\"\"<speak version='1.0' xml:lang='nl-NL'\n  xmlns='http://www.w3.org/2001/10/synthesis'>\n  <voice name='nl-NL-FennaNeural'>\n    Uw afspraak is op <say-as interpret-as='date'>2026-11-07</say-as>.\n    <break time='500ms'/>\n    <prosody rate='-10%'>Tot dan!</prosody>\n  </voice>\n</speak>\"\"\"\nsynth.speak_ssml_async(ssml).get()"}],
cfg:["<b>speech_synthesis_voice_name</b>: welke stem.","<b>Output format</b>: bijv. 16 kHz mono voor telefonie, 48 kHz voor hoge kwaliteit.","Gewone tekst → <code>speak_text_async</code>, SSML → <code>speak_ssml_async</code>."],
traps:["Pauzes, tempo en uitspraak regel je met SSML, niet met de prompt."],
rel:["speechstt","voiceagent"]},

{id:"speechtrans",p:"speech",t:"Speech translation",s:"Gesproken taal direct vertalen, naar tekst of spraak",d:[4],

when:["Live vertaling van een gesprek of presentatie → <b>speech translation</b>.","Vertaling met specifieke toon of context → STT + <b>LLM</b> + TTS."],

{id:"voiceagent",p:"speech",t:"Spraak als agent-modaliteit",s:"Voice Live API, realtime-modellen, audio-input",d:[4,2],
what:"<p>Een <b>voice agent</b> praat en luistert. Opties:</p><ul><li><b>Pipeline</b>: STT → LLM/agent → TTS. Flexibel, je kunt custom speech en custom voices gebruiken, maar meer latency.</li><li><b>Voice Live API</b>: één real-time verbinding (WebSocket) die spraakherkenning, het model, TTS, ruisonderdrukking, echo-onderdrukking en <b>turn detection</b> (wanneer is de gebruiker klaar met praten) combineert. Kan koppelen aan een Foundry-agent.</li><li><b>Realtime / audio-modellen</b> (gpt-realtime, gpt-4o-audio): het model hoort en spreekt zelf (speech-to-speech), lage latency.</li><li><b>Multimodaal redeneren over audio</b>: audio als input naar een model om te analyseren (toon, inhoud) zonder losse transcriptie.</li></ul>",

if(savedTheme)document.documentElement.dataset.theme=savedTheme;
$("#theme").onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;const t=dark?"light":"dark";document.documentElement.dataset.theme=t;store.set("fk-theme",t)};

const ICON={chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg>',check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.5 10 17l9-10"/></svg>',circle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>'};
const dtags=d=>'<span class="dtags">'+(d||[]).map(x=>`<span class="dtag" title="Examendomein ${x}: ${DOM[x].n} (${DOM[x].w})"><i style="background:var(--d${x})"></i>${DOM[x].n}</span>`).join("")+'</span>';

// Filters
function renderFilters(){
  const f=$("#filters");
  f.innerHTML='<span class="lbl">Examendomein</span>'+Object.entries(DOM).map(([k,v])=>`<button class="chip" data-d="${k}" aria-pressed="${activeDom.has(+k)}"><span class="sw" style="background:var(--d${k})"></span>${v.n} <span style="color:var(--text-3)">${v.w}</span></button>`).join("")+(activeDom.size?'<button class="chip clear" data-clear="1">Alles tonen</button>':"");
  f.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const d=+b.dataset.d;activeDom.has(d)?activeDom.delete(d):activeDom.add(d);renderFilters();renderTree();if(!current&&!$("#q").value)renderOverview()});
  const c=f.querySelector("[data-clear]");if(c)c.onclick=()=>{activeDom.clear();renderFilters();renderTree();if(!current&&!$("#q").value)renderOverview()};
}
const domMatch=n=>!activeDom.size||(n.d||[]).some(d=>activeDom.has(d));
function visible(n){if(domMatch(n))return true;return kids(n.id).some(visible)}

// Boom
function renderTree(){
  const build=list=>list.filter(visible).map(n=>{
    const ch=kids(n.id).filter(visible);const isOpen=open.has(n.id)||activeDom.size>0;
    return `<li><div class="row"><button class="tog ${ch.length?"":"leaf"}" data-tog="${n.id}" aria-expanded="${isOpen}" aria-label="${isOpen?"Inklappen":"Uitklappen"}: ${esc(n.t)}" tabindex="${ch.length?0:-1}">${ICON.chev}</button><button class="node ${current===n.id?"active":""}" data-go="${n.id}" ${current===n.id?'aria-current="page"':""}><span class="nm">${esc(n.t)}</span>${known.has(n.id)?'<span class="done" aria-label="snap ik">'+ICON.check+'</span>':""}</button></div>${ch.length&&isOpen?"<ul>"+build(ch)+"</ul>":""}</li>`}).join("");
  $("#tree").innerHTML=build(roots);
  $("#tree").querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{const id=b.dataset.tog;open.has(id)?open.delete(id):open.add(id);store.set("fk-open",[...open]);renderTree()});
  $("#tree").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  updateProgress();
}
function updateProgress(){const t=leaves.length,k=leaves.filter(n=>known.has(n.id)).length;$("#ptxt").textContent=`${k}/${t} snap ik`;$("#pbar").style.width=(t?k/t*100:0)+"%"}

// Overzicht
function renderOverview(){
  current=null;renderTree();
  const groups=roots.filter(visible);
  const leafCount=g=>{let c=0;(function w(id){kids(id).forEach(k=>{c++;w(k.id)})})(g.id);return c};
  const knownCount=g=>{let c=0;(function w(id){kids(id).forEach(k=>{if(known.has(k.id))c++;w(k.id)})})(g.id);return c};
  $("#main").innerHTML=`
  <section class="hero"><h1>Alles wat Foundry kan, op één kaart</h1>
  <p>Klik op een groep of onderwerp en ga laag voor laag dieper: wat het is, wanneer je het kiest, hoe je het aanroept, welke instellingen erbij horen en waar het examen je probeert te laten struikelen.</p>
  <p style="color:var(--text-3);font-size:13.5px">Tip: begin bij de Servicekiezer. Markeer een onderwerp met <b>Snap ik</b> als je het zonder spieken kunt uitleggen.</p></section>
  <div class="domains">${Object.entries(DOM).map(([k,v])=>`<div class="dom"><div class="pct">${v.w}</div><div class="nm">${v.n}</div><div class="meter"><i style="width:${v.v/35*100}%;background:var(--d${k})"></i></div></div>`).join("")}</div>
  ${groups.length?`<div class="groups">${groups.map(g=>{const ks=kids(g.id).filter(visible);return `<article class="gcard ${g.id==="kiezer"?"feature":""}"><h3><button data-go="${g.id}">${esc(g.t)}</button></h3><p>${esc(g.s)}</p><div class="kids">${ks.map(k=>`<button class="kid ${known.has(k.id)?"done":""}" data-go="${k.id}">${esc(k.t)}</button>`).join("")}</div><div class="gfoot">${dtags(g.d)}<span>${knownCount(g)}/${leafCount(g)} gesnapt</span></div></article>`}).join("")}</div>`:`<div class="empty"><b>Geen onderwerpen bij dit filter</b>Zet een ander examendomein aan of klik op Alles tonen.</div>`}
  <p class="foot">Gebaseerd op de officiële AI-103-studiegids (skills measured 16 april 2026) en de Microsoft Learn-documentatie (okt 2026). Codevoorbeelden zijn schetsen om te leren lezen. Controleer exacte namen in de docs voordat je ze in productie gebruikt. Je voortgang staat alleen in deze browser.</p>`;
  bindGo($("#main"));
  if(location.hash)history.replaceState(null,"",location.pathname);
}

// Detail
function codeHtml(src){return src.split("\n").map(l=>{const e=esc(l);const t=l.trim();if(t.startsWith("#")||t.startsWith("//"))return `<span class="com">${e}</span>`;const i=l.indexOf("  # ");if(i>-1)return esc(l.slice(0,i))+`<span class="com">${esc(l.slice(i))}</span>`;return e}).join("\n")}
function wrapTables(h){return String(h).replace(/<table>/g,'<div class="tablewrap"><table>').replace(/<\/table>/g,"</table></div>")}
function go(id,push=true){
  const n=byId[id];if(!n)return renderOverview();
  current=id;path(n).forEach(p=>{if(kids(p.id).length)open.add(p.id)});store.set("fk-open",[...open]);
  if(push&&location.hash!=="#"+id)history.pushState(null,"","#"+id);
  closeSide();renderTree();
  const ch=kids(id);const p=path(n);
  const idx=order.indexOf(id);const prev=byId[order[idx-1]],next=byId[order[idx+1]];
  let h=`<nav class="crumbs" aria-label="Kruimelpad"><button data-home="1">Overzicht</button>${p.slice(0,-1).map(x=>`<span>/</span><button data-go="${x.id}">${esc(x.t)}</button>`).join("")}</nav>
  <div class="dhead"><div><h1>${esc(n.t)}</h1><p class="sub">${esc(n.s||"")}</p>${dtags(n.d)}</div>
  ${n.p?`<button class="know" id="know" aria-pressed="${known.has(id)}">${known.has(id)?ICON.check+"Snap ik":ICON.circle+"Markeer als snap ik"}</button>`:""}</div>`;
  if(n.what)h+=`<section class="sec"><h2>Wat is het</h2>${wrapTables(/^\s*</.test(n.what)?n.what:"<p>"+n.what+"</p>")}</section>`;
  if(n.when&&n.when.length)h+=`<section class="sec when"><h2>Wanneer kies je dit</h2><ul>${n.when.map(w=>`<li>${w}</li>`).join("")}</ul></section>`;
  if(n.code&&n.code.length)h+=`<section class="sec"><h2>Zo roep je het aan</h2><div class="tabs" role="tablist">${n.code.map((c,i)=>`<button class="tab" role="tab" data-tab="${i}" aria-selected="${i===0}">${esc(c.l)}</button>`).join("")}</div><div class="codebox"><pre id="code"><code style="all:unset">${codeHtml(n.code[0].src)}</code></pre><button class="iconbtn copy" id="copy">Kopieer</button></div></section>`;
  if((n.cfg&&n.cfg.length)||(n.traps&&n.traps.length)){
    h+=`<div class="cols">`;
    if(n.cfg&&n.cfg.length)h+=`<section class="sec cfg"><h2>Configuratie & waarden</h2><ul>${n.cfg.map(c=>`<li>${c}</li>`).join("")}</ul></section>`;
    if(n.traps&&n.traps.length)h+=`<section class="sec trap"><h2>Examenvalkuilen</h2><ul>${n.traps.map(c=>`<li>${c}</li>`).join("")}</ul></section>`;
    h+=`</div><div style="height:14px"></div>`;
  }
  if(ch.length)h+=`<section class="sec"><h2>${n.p?"Dieper":"Onderwerpen"} (${ch.length})</h2><div class="subgrid">${ch.map(k=>`<button class="subcard" data-go="${k.id}"><b>${esc(k.t)}</b><span>${esc(k.s||"")}</span>${known.has(k.id)?'<span class="ok">Snap ik</span>':""}</button>`).join("")}</div></section>`;
  if(n.rel&&n.rel.length)h+=`<section class="sec"><h2>Hangt samen met</h2><div class="rel">${n.rel.filter(r=>byId[r]).map(r=>`<button class="kid" data-go="${r}">${esc(byId[r].t)}</button>`).join("")}</div></section>`;
  h+=`<div class="pager">${prev?`<button data-go="${prev.id}"><small>Vorige</small>${esc(prev.t)}</button>`:"<span></span>"}${next?`<button class="next" data-go="${next.id}"><small>Volgende</small>${esc(next.t)}</button>`:""}</div>`;
  const m=$("#main");m.innerHTML=h;bindGo(m);
  m.querySelector("[data-home]").onclick=()=>{history.pushState(null,"",location.pathname);renderOverview()};
  const k=$("#know");if(k)k.onclick=()=>{known.has(id)?known.delete(id):known.add(id);store.set("fk-known",[...known]);go(id,false)};
  if(n.code){let ci=0;m.querySelectorAll("[data-tab]").forEach(t=>t.onclick=()=>{ci=+t.dataset.tab;m.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x===t));$("#code").innerHTML=`<code style="all:unset">${codeHtml(n.code[ci].src)}</code>`});
    $("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(n.code[ci].src);$("#copy").textContent="Gekopieerd"}catch(e){$("#copy").textContent="Selecteer en kopieer"}setTimeout(()=>{const c=$("#copy");if(c)c.textContent="Kopieer"},1500)}}
  window.scrollTo({top:0});m.focus({preventScroll:true});
}
function bindGo(root){root.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{$("#q").value="";go(b.dataset.go)})}

// Zoeken
function search(q){
  q=q.trim().toLowerCase();if(!q){current?go(current,false):renderOverview();return}
  const hay=n=>[n.t,n.s,strip(n.what),...(n.when||[]).map(strip),...(n.cfg||[]).map(strip),...(n.traps||[]).map(strip),...(n.code||[]).map(c=>c.src)].join(" \u2002 ");
  const terms=q.split(/\s+/).filter(Boolean);
  const res=N.filter(domMatch).map(n=>{const h=hay(n).toLowerCase();if(!terms.every(t=>h.includes(t)))return null;const score=(n.t.toLowerCase().includes(terms[0])?10:0)+((n.s||"").toLowerCase().includes(terms[0])?4:0);return{n,score,h:hay(n)}}).filter(Boolean).sort((a,b)=>b.score-a.score);
  const hl=s=>{let e=esc(s);terms.forEach(t=>{e=e.replace(new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>")});return e};
  const snip=h=>{const i=h.toLowerCase().indexOf(terms[0]);const s=Math.max(0,i-60);return (s?"... ":"")+h.slice(s,s+170)+"..."};
  $("#main").innerHTML=`<section class="results"><h1>${res.length} ${res.length===1?"resultaat":"resultaten"} voor “${esc(q)}”</h1>${res.length?res.map(r=>`<button class="res" data-go="${r.n.id}"><div class="path">${path(r.n).slice(0,-1).map(p=>esc(p.t)).join(" / ")||"Groep"}</div><b>${hl(r.n.t)}</b><p>${hl(snip(r.h))}</p></button>`).join(""):`<div class="empty"><b>Niets gevonden</b>Probeer een Engelse term (bijv. <i>throughput</i>, <i>redaction</i>) of een kortere zoekterm.</div>`}</section>`;
  bindGo($("#main"));
}
let st;$("#q").addEventListener("input",e=>{clearTimeout(st);st=setTimeout(()=>search(e.target.value),120)});
$("#q").addEventListener("keydown",e=>{if(e.key==="Escape"){e.target.value="";search("");e.target.blur()}if(e.key==="Enter"){const f=$("#main .res");if(f)f.click()}});
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("#q").focus()}});

// Mobiel menu
const side=$("#side"),scrim=$("#scrim");
function closeSide(){side.classList.remove("open");scrim.classList.remove("open")}
$("#menuBtn").onclick=()=>{side.classList.add("open");scrim.classList.add("open")};scrim.onclick=closeSide;
$("#home").onclick=()=>{$("#q").value="";history.pushState(null,"",location.pathname);renderOverview()};
window.addEventListener("popstate",()=>{const id=location.hash.slice(1);id&&byId[id]?go(id,false):renderOverview()});

renderFilters();
const start=location.hash.slice(1);start&&byId[start]?go(start,false):renderOverview();
</script>
</body>
</html>
