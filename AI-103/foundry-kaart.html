what:"<table><tr><th></th><th>Basic</th><th>Standard</th></tr><tr><td>Conversations/threads</td><td>Managed by Microsoft</td><td>Your <b>Cosmos DB</b></td></tr><tr><td>Files</td><td>Managed by Microsoft</td><td>Your <b>Storage account</b></td></tr><tr><td>Vector stores</td><td>Managed by Microsoft</td><td>Your <b>Azure AI Search</b></td></tr><tr><td>Network</td><td>Public</td><td>Can be in your own <b>VNet</b> (BYO VNet)</td></tr></table>",
when:["'Data must live in our own resources' / 'compliance' / 'private networking for agents' → <b>standard setup</b>.","Quick prototyping → basic."],
rel:["agentservice","security"]},

{id:"tools",p:"agents",t:"Agent tools",s:"Overview: knowledge tools, action tools, custom tools",d:[2],
what:"<p>Tools give an agent knowledge or the ability to act. The model decides when to use a tool (<b>tool calling</b>). Three families:</p><ul><li><b>Knowledge</b>: file search, Azure AI Search, web search / Bing grounding, SharePoint, Fabric IQ / Fabric data agent, Work IQ.</li><li><b>Actions and computation</b>: code interpreter, browser automation, computer use, image generation.</li><li><b>Custom integrations</b>: function calling, OpenAPI, MCP, Azure Functions, A2A (agent-to-agent).</li></ul><p><b>Toolbox</b> (new): manage tools centrally and share them between agents through one MCP endpoint, with central authentication and guardrails.</p>",
when:["See the three subtopics below for the choice per situation."],
rel:["toolsknowledge","toolsactions","toolscustom"]},

{id:"toolsknowledge",p:"tools",t:"Knowledge tools",s:"File search, Azure AI Search, Bing/web search, SharePoint, Fabric",d:[2,5],
what:"<table><tr><th>Tool</th><th>What</th><th>Choose when</th></tr><tr><td><b>File search</b></td><td>You upload files; the service chunks, embeds and searches them (vector store)</td><td>A handful of documents, quick to set up, little management</td></tr><tr><td><b>Azure AI Search</b></td><td>Agent searches an <b>existing</b> AI Search index</td><td>Large or company-wide content, your own indexing, hybrid/semantic, filters, security trimming</td></tr><tr><td><b>Web search / Grounding with Bing</b></td><td>Current info from the public internet, with sources</td><td>News, current public facts</td></tr><tr><td><b>Bing Custom Search</b></td><td>Search only the websites you chose</td><td>Public web, but only trusted domains</td></tr><tr><td><b>SharePoint</b></td><td>Searches SharePoint with the user's permissions</td><td>Internal Microsoft 365 documents</td></tr><tr><td><b>Fabric data agent / Fabric IQ</b></td><td>Questions about data in Microsoft Fabric</td><td>Structured company data (lakehouse, warehouse)</td></tr></table>",
when:["Fixed documents, small set → <b>file search</b>.","Large existing index → <b>Azure AI Search tool</b>.","Current public internet → <b>Bing / web search</b>.","Internal SharePoint with user permissions → <b>SharePoint tool</b>."],
code:[{l:"File search (sketch)",src:"from azure.ai.projects.models import FileSearchTool\n\nvs = openai.vector_stores.create(name=\"hr-handbook\")\nopenai.vector_stores.files.upload_and_poll(vector_store_id=vs.id,\n                                          file=open(\"handbook.pdf\", \"rb\"))\n\ntool = FileSearchTool(vector_store_ids=[vs.id])   # add to the agent with tools=[tool]"}],
traps:["File search for live data (order status) is wrong: the data is outdated right away. Live data → OpenAPI/function.","Bing = public internet. Never for internal documents."],
rel:["rag","searchquery","toolscustom"]},

{id:"toolsactions",p:"tools",t:"Action & compute tools",s:"Code interpreter, browser automation, computer use, image generation",d:[2],
what:"<table><tr><th>Tool</th><th>What</th><th>Choose when</th></tr><tr><td><b>Code interpreter</b></td><td>Agent writes and runs Python in a sandbox. Can read files and make charts</td><td>Calculations, data analysis (CSV/Excel), charts, file conversion</td></tr><tr><td><b>Browser automation</b></td><td>Agent operates a real browser (clicking, forms)</td><td>Tasks on websites without an API</td></tr><tr><td><b>Computer use</b></td><td>Agent operates a desktop through screenshots</td><td>Old desktop applications without an API</td></tr><tr><td><b>Image generation</b></td><td>Agent creates images</td><td>Generating images within a conversation</td></tr></table>",
when:["'Calculate', 'analyze this spreadsheet', 'create a chart' → <b>code interpreter</b>.","No API, only a website → <b>browser automation</b>."],
traps:["LLMs are bad at mental arithmetic. Precise calculations → code interpreter."],
rel:["tools","toolscustom"]},

{id:"toolscustom",p:"tools",t:"Custom tools: function, OpenAPI, MCP, Functions, A2A",s:"Connecting your own systems and APIs to an agent",d:[2],
what:"<table><tr><th>Tool</th><th>Where does the code run?</th><th>Choose when</th></tr><tr><td><b>Function calling</b></td><td>In <b>your app</b> (client-side). The agent returns arguments, your code runs it</td><td>Logic that lives in your own app, full control</td></tr><tr><td><b>OpenAPI</b></td><td>The service calls <b>your REST API</b> based on an OpenAPI spec</td><td>Existing REST API with a spec, live data or actions</td></tr><tr><td><b>MCP</b> (Model Context Protocol)</td><td>An <b>MCP server</b> (your own or a third party's) that offers tools</td><td>Standard integration, reusable across agents and frameworks</td></tr><tr><td><b>Azure Functions</b></td><td>Serverless function in Azure, often through a queue</td><td>Long-running or asynchronous tasks</td></tr><tr><td><b>A2A</b> (agent-to-agent)</td><td>Another agent, also outside Foundry</td><td>Delegating a task to a specialized agent</td></tr></table>",
when:["Internal REST API with an OpenAPI spec, current data → <b>OpenAPI tool</b>.","Reusable tool server, open standard → <b>MCP</b>.","Function inside your own application → <b>function calling</b>."],
code:[{l:"MCP tool with required approval (current docs)",src:"from azure.ai.projects.models import PromptAgentDefinition, MCPTool\n\ntool = MCPTool(\n    server_label=\"api-specs\",\n    server_url=\"https://api.githubcopilot.com/mcp\",\n    require_approval=\"always\",            # approve every call first\n    project_connection_id=\"my-mcp-connection\",  # the key lives in a connection\n)\nagent = project.agents.create_version(\n    agent_name=\"dev-helper\",\n    definition=PromptAgentDefinition(model=\"gpt-5-mini\",\n                                     instructions=\"Use MCP tools as needed\",\n                                     tools=[tool]))"}],
cfg:["OpenAPI: the <b>spec</b> (JSON/YAML) + authentication: anonymous, <b>API key through a connection</b> or <b>managed identity</b>.","MCP: <code>server_url</code>, <code>server_label</code>, <code>require_approval</code> (<code>always</code> / <code>never</code>), <code>project_connection_id</code> for the key.","Good tool <b>descriptions</b> are crucial: the model chooses based on them."],
traps:["OpenAPI ≠ OpenAI. OpenAPI = a standard format for describing a REST API.","Putting an API URL or key in the instructions is wrong."],
rel:["structured","hitl","connections"]},

{id:"memory",p:"agents",t:"Memory & conversations",s:"Conversations, previous_response_id, memory, context window",d:[2],
what:"<ul><li><b>Short-term memory</b>: the history of the current conversation. Through a <b>conversation</b> (stored by the service) or by passing <b>previous_response_id</b>.</li><li><b>Long-term memory</b> (<b>memory</b>): facts about the user that are kept between conversations (preferences, earlier agreements).</li><li><b>Context window</b>: how many tokens the model can process at once. Long conversations are shortened or summarized (<b>truncation</b>).</li><li><b>Conversation-tracking approach</b> (study guide): choose deliberately between stateful (the service stores it) and stateless (your app sends the history along).</li></ul>",
when:["Follow-up questions must work → <b>conversation</b> or <b>previous_response_id</b>.","Agent must remember preferences across sessions → <b>memory</b>.","Full control over storage and privacy yourself → stateless, history in your own database."],
traps:["A model remembers nothing between calls on its own. Memory = sending the history along or letting the service store it."],
rel:["agentservice","sdk"]},

{id:"multiagent",p:"agents",t:"Multi-agent & orchestration",s:"Workflows, patterns, Agent Framework, A2A",d:[2],
what:"<p>Several specialized agents working together, each with its own role and its own tools.</p><p><b>Orchestration patterns:</b></p><ul><li><b>Sequential</b>: A → B → C, fixed order (for example research → write → review).</li><li><b>Concurrent</b>: several agents at the same time, results merged.</li><li><b>Handoff</b>: one agent hands the conversation to the right specialist (triage).</li><li><b>Group chat</b>: agents discuss under the lead of a manager.</li><li><b>Magentic</b>: a manager agent plans dynamically and assigns tasks.</li><li><b>Human-in-the-loop</b>: a human as a step in the workflow.</li></ul><p><b>Where do you build it?</b> <b>Workflows</b> in Foundry (visual/YAML), <b>Microsoft Agent Framework</b> (the successor of Semantic Kernel + AutoGen, in code), or connecting agents through <b>A2A</b>. Classic Foundry had <b>connected agents</b> (an agent used as a tool of a main agent).</p>",
when:["One agent gets too complex (too many tools, different roles) → <b>split it into specialists</b>.","Customer question to the right department agent → <b>handoff / triage</b>.","Fixed steps with a check in between → <b>sequential workflow</b> + an approval step."],
traps:["More agents = more cost and latency. Only split when it really improves quality or manageability."],
rel:["agentservice","hitl","reflection","agenteval"]},

{id:"hitl",p:"agents",t:"Human-in-the-loop & approvals",s:"Semi-autonomous agents with approval before execution",d:[2,1],
what:"<p><b>Human-in-the-loop</b>: a human approves a step before it runs. <b>Semi-autonomous</b>: the agent does small things itself and asks permission for risky actions.</p><p>With MCP tools: <code>require_approval=\"always\"</code>. The response then contains an <code>mcp_approval_request</code>. Your app shows it to a human and sends back an <code>mcp_approval_response</code> (approve true/false). With function calling you build the approval yourself, before your code runs the function. In workflows: an <b>approval step</b>.</p>",
when:["Money, deleting, sending, contracts → <b>approval before execution</b>.","Thresholds (for example above €500) → rule in <b>code</b>, plus approval above the threshold."],
code:[{l:"Handling an approval (current docs)",src:"from openai.types.responses.response_input_param import McpApprovalResponse\n\nresponse = openai.responses.create(\n    conversation=conversation.id, input=\"Create an issue for bug 12\",\n    extra_body={\"agent_reference\": {\"name\": agent.name, \"type\": \"agent_reference\"}})\n\nreplies = []\nfor item in response.output:\n    if item.type == \"mcp_approval_request\":\n        ok = human_approves(item.server_label, item.name, item.arguments)\n        replies.append(McpApprovalResponse(type=\"mcp_approval_response\",\n                                           approve=ok,\n                                           approval_request_id=item.id))\n\nresponse = openai.responses.create(\n    input=replies, previous_response_id=response.id,\n    extra_body={\"agent_reference\": {\"name\": agent.name, \"type\": \"agent_reference\"}})"}],
traps:["A system prompt or a low temperature is not reliable enforcement."],
rel:["governance","toolscustom","multiagent"]},

{id:"agenteval",p:"agents",t:"Monitoring & evaluating agents",s:"Intent resolution, task adherence, tool call accuracy, error analysis",d:[2,1],
what:"<p>You judge agents on more than the final answer:</p><ul><li><b>Intent resolution</b>: did the agent understand what the user wanted?</li><li><b>Task adherence</b>: did it do what the instructions asked, within the limits?</li><li><b>Tool call accuracy</b>: did it pick the right tool with the right arguments?</li><li>Plus groundedness, relevance and the safety evaluators.</li></ul><p><b>Error analysis</b>: search the <b>traces</b> for where it went wrong (wrong tool, empty search results, time-out) and fix it with better instructions, tool descriptions or data.</p>",
when:["Agent uses the wrong tool → measure tool call accuracy + improve the tool descriptions.","Watching live quality → tracing + <b>continuous evaluation</b>."],
rel:["evaluaties","tracing","monitoring"]},

{id:"agentidentity",p:"agents",t:"Agent identity",s:"A separate Entra identity per agent",d:[1,2],
what:"Agents in Foundry can get their own <b>Entra ID identity</b> (<b>agent identity</b>). They then call tools and APIs with their <b>own</b> permissions (RBAC), and the logs show which agent did what. Alternatives: the <b>project's managed identity</b>, or <b>on-behalf-of</b> (with the signed-in user's permissions, for example with SharePoint).",
when:["Agent must reach an Azure resource without keys → <b>agent identity or project managed identity + RBAC role</b>.","Agent may only see what the user is allowed to see → <b>on-behalf-of / identity passthrough</b>."],
rel:["security","governance"]}
);

// ===== Azure AI Search =====
N.push(
{id:"index",p:"search",t:"Index & fields",s:"Fields, attributes, vector fields, HNSW",d:[5],
what:"<p>An <b>index</b> is the searchable store, comparable to a table. Every <b>document</b> (row) has <b>fields</b> (columns). Per field you set <b>attributes</b>:</p><table><tr><th>Attribute</th><th>Means</th></tr><tr><td><b>key</b></td><td>Unique ID of the document (exactly one field, type string)</td></tr><tr><td><b>searchable</b></td><td>Searchable with full-text (keywords)</td></tr><tr><td><b>filterable</b></td><td>Usable in <code>$filter</code> (for example category eq 'HR')</td></tr><tr><td><b>sortable</b></td><td>Sort on this field</td></tr><tr><td><b>facetable</b></td><td>Counts per value (filters in a search UI)</td></tr><tr><td><b>retrievable</b></td><td>Returned in the results</td></tr></table><p><b>Vector field</b>: type <code>Collection(Edm.Single)</code> with <b>dimensions</b> (for example 1536) and a <b>vector search profile</b> with the algorithm <b>HNSW</b> (fast, approximate, the default) or <b>exhaustive KNN</b> (exact, slow, for small sets or testing).</p>",
when:["Filter on department or date → field <b>filterable</b>.","Only display, not search → <b>retrievable</b> but not searchable (saves space).","Search by meaning → <b>vector field</b> + embedding model."],
code:[{l:"Index with a vector field (Python)",src:"from azure.search.documents.indexes.models import (\n    SearchIndex, SimpleField, SearchableField, SearchField, SearchFieldDataType,\n    VectorSearch, HnswAlgorithmConfiguration, VectorSearchProfile)\n\nfields = [\n    SimpleField(name=\"id\", type=SearchFieldDataType.String, key=True),\n    SearchableField(name=\"content\"),\n    SimpleField(name=\"category\", type=SearchFieldDataType.String, filterable=True),\n    SearchField(name=\"contentVector\",\n                type=SearchFieldDataType.Collection(SearchFieldDataType.Single),\n                searchable=True, vector_search_dimensions=1536,\n                vector_search_profile_name=\"hnsw-profile\"),\n]\nvector_search = VectorSearch(\n    algorithms=[HnswAlgorithmConfiguration(name=\"hnsw\")],\n    profiles=[VectorSearchProfile(name=\"hnsw-profile\",\n                                  algorithm_configuration_name=\"hnsw\")])\nindex_client.create_or_update_index(\n    SearchIndex(name=\"manuals\", fields=fields, vector_search=vector_search))"}],
cfg:["<b>Analyzer</b> per text field: language (for example <code>en.microsoft</code> or <code>nl.microsoft</code>) for better word recognition.","Tiers: Free, Basic, Standard (S1-S3), Storage Optimized. The semantic ranker needs at least Basic.","Scaling: <b>replicas</b> (more queries per second, high availability) and <b>partitions</b> (more storage, faster indexing)."],
traps:["Replicas = more query capacity and availability (≥ 2 for read availability, ≥ 3 for read + write). Partitions = more storage.","You often cannot change the attributes of an existing field without reindexing."],
rel:["indexers","searchquery","embeddings"]},

{id:"indexers",p:"search",t:"Indexers & data sources",s:"Pulling content in automatically from Blob, SQL, Cosmos DB",d:[5],
what:"<p>An <b>indexer</b> is a crawler that automatically pulls content from a <b>data source</b> and puts it in the index. Sources: Azure Blob Storage, Data Lake, SQL Database, Cosmos DB, Table Storage, SharePoint (preview), OneLake.</p><p>Flow: <b>data source → (skillset) → index</b>. With <b>field mappings</b> you map source fields to index fields, with <b>output field mappings</b> you map enriched fields from the skillset.</p>",
when:["Make files in Blob searchable automatically → <b>indexer</b> with Blob as the data source.","Process only new/changed files → <b>change detection</b> (default for Blob through LastModified) and a <b>schedule</b>.","Content that is not in a supported source → push it yourself with the <b>push API</b> (<code>upload_documents</code>)."],
code:[{l:"Run an indexer / check its status",src:"indexer_client.run_indexer(\"manuals-indexer\")\nstatus = indexer_client.get_indexer_status(\"manuals-indexer\")\nprint(status.last_result.status, status.last_result.error_message)"}],
cfg:["The indexer preferably reads the source with the <b>managed identity of the Search service</b> + the role <b>Storage Blob Data Reader</b>.","<b>Schedule</b>: for example every hour.","<b>Deletion detection</b>: also remove deleted source files from the index (soft delete).","<code>dataToExtract</code>: <code>contentAndMetadata</code>; <code>imageAction</code>: <code>generateNormalizedImages</code> (needed for OCR)."],
traps:["OCR on images inside PDFs only works if <code>imageAction</code> is set and there is an OCR skill."],
rel:["index","skillsets"]},

{id:"skillsets",p:"search",t:"Skillsets & enrichment",s:"Built-in skills, custom skills, knowledge store",d:[5,3,4],
what:"<p>A <b>skillset</b> enriches content with AI during indexing (<b>AI enrichment</b>). Each <b>skill</b> reads fields and writes new fields.</p><p><b>Built-in skills</b> (selection):</p><ul><li>Text: <b>Text Split</b> (chunking), <b>Language Detection</b>, <b>Entity Recognition</b>, <b>Key Phrase Extraction</b>, <b>PII Detection</b>, <b>Sentiment</b>, <b>Text Translation</b>, Merge.</li><li>Image: <b>OCR</b>, <b>Image Analysis</b> (tags, captions).</li><li>Layout: <b>Document Layout</b> (structure, headings, tables, markdown chunks).</li><li>Vectors: <b>Azure OpenAI Embedding</b>.</li><li>Generative: <b>GenAI Prompt</b> (let an LLM summarize or describe during indexing).</li></ul><p><b>Custom skill</b>: your own logic as a <b>Web API</b> (often an Azure Function) that the indexer calls.</p><p><b>Knowledge store</b>: also save the enriched output to Storage (tables/blobs) through <b>projections</b>, for analysis outside Search (for example Power BI).</p>",
when:["Make scanned PDFs searchable → <b>OCR</b> (+ Merge).","Chunk + embed during indexing → <b>Text Split</b> + <b>Azure OpenAI Embedding</b> (<b>integrated vectorization</b>).","Your own classification or an external API during indexing → <b>custom skill</b> (Web API).","Analyze enriched data in Power BI → <b>knowledge store</b>."],
cfg:["Text Split: <code>textSplitMode</code> (pages/sentences), <code>maximumPageLength</code>, <code>pageOverlapLength</code>.","Built-in skills that use Foundry Tools need an attached <b>Foundry/AI services resource</b> (for billing above the free amount).","Custom skill: input/output as JSON with a <code>values</code> array and <code>recordId</code>."],
traps:["Custom skill = Web API contract (<code>values</code> with <code>recordId</code> and <code>data</code>). Responses must return the same recordIds."],
rel:["indexers","integratedvec","docsextract"]},

{id:"integratedvec",p:"search",t:"Integrated vectorization",s:"Chunking and embedding done by Search itself, at indexing and query time",d:[5],
what:"With <b>integrated vectorization</b> Azure AI Search does the chunking and embedding itself: at <b>indexing</b> time (Text Split + Embedding skill) and at <b>query</b> time (a <b>vectorizer</b> on the index turns the search text into a vector). Your app then just sends text, not vectors.",
when:["Minimal custom code for vector search → <b>integrated vectorization</b> + <code>VectorizableTextQuery</code>.","Computing vectors yourself in your app → <code>VectorizedQuery</code> with your own vector."],
code:[{l:"Search with text; Search creates the vector",src:"from azure.search.documents.models import VectorizableTextQuery\n\nvq = VectorizableTextQuery(text=\"reset after power failure\",\n                           k_nearest_neighbors=5, fields=\"contentVector\")\nresults = search_client.search(search_text=None, vector_queries=[vq])"}],
cfg:["<b>Vectorizer</b> in the vector search profile: points to your Azure OpenAI/Foundry embedding deployment.","Same embedding model as at indexing time."],
rel:["skillsets","searchquery","embeddings"]},

{id:"searchquery",p:"search",t:"Search types",s:"Keyword (BM25), vector, hybrid + RRF, semantic ranker, filters",d:[5,2],
what:"<table><tr><th>Type</th><th>How</th><th>Strong at</th></tr><tr><td><b>Keyword / full-text</b></td><td>Matching words, ranking with <b>BM25</b></td><td>Exact terms, codes, names</td></tr><tr><td><b>Vector</b></td><td>Nearest embeddings</td><td>Meaning, synonyms, other languages</td></tr><tr><td><b>Hybrid</b></td><td>Keyword + vector at the same time, merged with <b>RRF</b></td><td>Both kinds of questions. Default advice for RAG</td></tr><tr><td><b>Semantic ranker</b></td><td>A language model <b>reranks</b> the top 50 (L2 reranking), returns captions and answers</td><td>Best result at the top</td></tr></table><p><b>RRF</b> (Reciprocal Rank Fusion) = a formula that merges two ranked lists. The <b>semantic ranker</b> is a separate model on top of that.</p><p>Also: <b>filters</b> (<code>$filter</code>, OData syntax), <b>scoring profiles</b> (give fields or freshness more weight), <b>facets</b>, <b>synonym maps</b>, <b>security trimming</b> (filter on group IDs so users only see their own documents).</p>",
when:["Exact product codes are missed by vector search → <b>hybrid</b>.","The right document is in the top 10 but not at the top → <b>semantic ranker</b>.","User may only see their own department → <b>security filter</b> on group ID.","Recent documents matter more → <b>scoring profile</b> with freshness."],
code:[{l:"Hybrid + semantic + filter",src:"from azure.search.documents import SearchClient\nfrom azure.search.documents.models import VectorizableTextQuery\n\nclient = SearchClient(endpoint=\"https://my-search.search.windows.net\",\n                      index_name=\"manuals\",\n                      credential=DefaultAzureCredential())\nresults = client.search(\n    search_text=\"manual XK-2210-B\",                           # keyword part\n    vector_queries=[VectorizableTextQuery(text=\"manual XK-2210-B\",\n                    k_nearest_neighbors=50, fields=\"contentVector\")],  # vector part\n    query_type=\"semantic\",                                       # semantic ranker\n    semantic_configuration_name=\"default\",\n    filter=\"category eq 'manual'\",\n    select=[\"title\", \"content\"], top=5)\nfor r in results:\n    print(r[\"@search.reranker_score\"], r[\"title\"])"}],
cfg:["Semantic ranker: a <b>semantic configuration</b> on the index (title, content and keywords fields).","<code>query_type=\"semantic\"</code> + <code>semantic_configuration_name</code>.","<code>queryType=full</code> = Lucene syntax (wildcards, fuzzy <code>~</code>, boosts <code>^</code>)."],
traps:["RRF ≠ semantic ranker.","The semantic ranker only reranks; it does not find anything the first search step missed."],
rel:["index","rag","agenticretrieval"]},

{id:"agenticretrieval",p:"search",t:"Agentic retrieval & knowledge bases",s:"Foundry IQ: an LLM plans the search queries",d:[5,2],
what:"<p>With <b>agentic retrieval</b> an LLM splits a complex question into several subqueries, runs them in parallel (over one or more sources) and merges the results. This is called <b>query planning</b>. You set it up as a <b>knowledge base</b> in Azure AI Search (in Foundry: <b>Foundry IQ</b>).</p><p>Agents use a knowledge base through an <b>MCP endpoint</b> (the tool <code>knowledge_base_retrieve</code>).</p>",
when:["Complex questions with several parts or over several sources → <b>agentic retrieval</b>.","Simple question and answer → a normal hybrid + semantic query is enough (cheaper, faster)."],
traps:["Agentic retrieval costs extra LLM calls, so more latency and cost."],
rel:["searchquery","toolsknowledge","rag"]}
);

// ===== Documents =====
N.push(
{id:"cu",p:"docs",t:"Content Understanding",s:"Analyzers for documents, images, audio and video",d:[5,3],
what:"<p><b>Azure Content Understanding</b> (a Foundry Tool) turns unstructured content into <b>markdown</b> and <b>structured fields</b>, for <b>documents, images, audio and video</b>.</p><p><b>Building blocks:</b></p><ul><li><b>Analyzer</b>: the configuration: which extraction, which field schema, which models. <b>Prebuilt</b> analyzers (for example for invoices, RAG ingestion of documents/images/audio/video, call center analytics) or <b>custom</b>.</li><li><b>Content extraction</b>: OCR, layout (paragraphs, tables, sections), barcodes, formulas. For audio/video: transcription and visual elements.</li><li><b>Field schema</b>: your fields, each with a type and one of three <b>methods</b>:<br><b>extract</b> = take the value literally (documents only), <b>classify</b> = choose from fixed categories, <b>generate</b> = let the model generate freely (summary, scene description).</li><li><b>Segmentation</b> (<code>enableSegment</code>): split a document or video into logical parts (per document type, per scene).</li><li><b>Confidence scores</b> (0-1) and <b>grounding</b> (where in the source file the value is) through <code>estimateFieldSourceAndConfidence</code>.</li><li><b>Foundry models</b>: you connect your own deployments of an LLM and an embedding model.</li></ul><p><b>Modes:</b> standard (one document, one task) and <b>pro mode</b> (reasoning over several documents and reference data, for example checking an invoice against a contract). Newer, in preview: <b>agentic mode</b>.</p>",
when:["Fields from documents with varying layouts → <b>custom analyzer with a field schema</b>.","Clean markdown from documents for RAG/agents → <b>Content Understanding</b> (prebuilt document search analyzer).","Split a video into scenes with a description and timestamps → <b>video analyzer</b>.","Call center recordings: summary, sentiment, topics → <b>audio analyzer</b>.","Check an invoice against a contract → <b>pro mode</b>.","Process automatically only at high confidence → <b>confidence scores</b> + threshold; otherwise human review."],
code:[{l:"Analyzer definition (JSON, REST)",src:"PUT {endpoint}/contentunderstanding/analyzers/invoice-analyzer?api-version=2025-11-01\n{\n  \"baseAnalyzerId\": \"prebuilt-document\",\n  \"config\": { \"estimateFieldSourceAndConfidence\": true },\n  \"fieldSchema\": {\n    \"fields\": {\n      \"VendorName\":  { \"type\": \"string\", \"method\": \"extract\",  \"description\": \"Name of the vendor\" },\n      \"InvoiceDate\": { \"type\": \"date\",   \"method\": \"extract\" },\n      \"Total\":       { \"type\": \"number\", \"method\": \"extract\" },\n      \"Category\":    { \"type\": \"string\", \"method\": \"classify\",\n                       \"enum\": [\"IT\", \"Facilities\", \"Other\"] },\n      \"Summary\":     { \"type\": \"string\", \"method\": \"generate\",\n                       \"description\": \"One sentence about what was bought\" }\n    }\n  },\n  \"models\": { \"completion\": \"gpt-4.1\", \"embedding\": \"text-embedding-3-large\" }\n}"},
{l:"Analyze (REST, asynchronous)",src:"POST {endpoint}/contentunderstanding/analyzers/invoice-analyzer:analyze?api-version=2025-11-01\n{ \"inputs\": [ { \"url\": \"https://.../invoice-0042.pdf\" } ] }\n\n# → 202 Accepted + header Operation-Location\n# → GET that URL until status = Succeeded\n# → result.contents[0].markdown and result.contents[0].fields"}],
cfg:["GA API version: <b>2025-11-01</b>.","Content Understanding uses <b>your</b> model deployments: they must exist in the Foundry resource.","The guardrails of the connected deployment apply here too."],
traps:["<b>extract</b> only works on documents. For audio/video you use generate or classify.","OCR alone gives you text, not meaningful fields."],
rel:["docintel","docsextract","cuvisual","rag"]},

{id:"docintel",p:"docs",t:"Document Intelligence",s:"Prebuilt models (invoice, receipt, ID, layout, read), custom models",d:[5],
what:"<p><b>Azure Document Intelligence</b> (formerly Form Recognizer) is the specialized document service.</p><ul><li><b>Read</b>: OCR (text, lines, words, languages, handwriting).</li><li><b>Layout</b>: text + tables + selection marks + structure, also as markdown.</li><li><b>Prebuilt</b>: invoice, receipt, ID document, business card, W-2, health insurance card, contract, bank statement, and more. Fields available right away.</li><li><b>Custom template</b>: fixed layout (forms that always look the same). Needs few examples (5+).</li><li><b>Custom neural</b>: varying layouts of the same kind of document.</li><li><b>Composed model</b>: several custom models combined, with an automatic choice per document.</li><li><b>Custom classifier</b>: first determine what kind of document it is.</li></ul>",
when:["Standard document (invoice, receipt, ID) without training → <b>prebuilt model</b>.","Your own form, always the same layout → <b>custom template</b>.","Your own document type, varying layouts → <b>custom neural</b>.","Mix of document types in one stream → <b>classifier</b> + <b>composed model</b>."],
code:[{l:"Analyze an invoice (Python)",src:"from azure.ai.documentintelligence import DocumentIntelligenceClient\nfrom azure.ai.documentintelligence.models import AnalyzeDocumentRequest\n\nclient = DocumentIntelligenceClient(\"https://my-foundry.cognitiveservices.azure.com/\",\n                                    DefaultAzureCredential())\npoller = client.begin_analyze_document(\n    \"prebuilt-invoice\", AnalyzeDocumentRequest(url_source=\"https://.../invoice.pdf\"))\nresult = poller.result()\nfor doc in result.documents:\n    print(doc.fields[\"VendorName\"].content, doc.fields[\"InvoiceTotal\"].content)"}],
cfg:["Model IDs: <code>prebuilt-read</code>, <code>prebuilt-layout</code>, <code>prebuilt-invoice</code>, <code>prebuilt-receipt</code>, <code>prebuilt-idDocument</code>.","Layout output format: <code>outputContentFormat=markdown</code> (handy for RAG chunking).","Training data for custom models: in a Blob container, labeled in Document Intelligence Studio / Content Understanding Studio."],
traps:["<code>begin_...</code> = asynchronous (poller). You have to wait for <code>.result()</code>.","Custom template for varying layouts = wrong. Then neural."],
rel:["cu","docsextract","containers"]},

{id:"docsextract",p:"docs",t:"OCR, layout & RAG ingestion",s:"From scan to clean, searchable chunks",d:[5],
what:"<p>Pipeline to get documents ready for RAG or agents:</p><ol><li><b>OCR</b>: text from scans and images (Read / OCR skill / Content Understanding).</li><li><b>Layout analysis</b>: recognize headings, paragraphs, tables, so the structure is kept.</li><li><b>Field extraction</b> (optional): pull out specific values.</li><li><b>Chunking</b>: preferably by structure (per section/heading, for example markdown chunking from the Document Layout skill) instead of a fixed number of characters.</li><li><b>Embedding + indexing</b> in Azure AI Search.</li></ol>",
when:["Tables must stay whole in RAG → <b>layout-based chunking</b> (Document Layout skill / layout markdown).","Scanned PDFs in a Search pipeline → indexer + <b>OCR skill</b> (+ <code>imageAction</code>).","Charts and figures searchable too → Content Understanding (figure descriptions) or the GenAI Prompt skill."],
rel:["skillsets","cu","docintel","rag"]}
);

// ===== Computer vision =====
N.push(
{id:"multimodal",p:"vision",t:"Multimodal models",s:"Understanding images: captions, alt text, questions about images",d:[3],
what:"<p>A <b>multimodal model</b> (such as GPT-4.1, GPT-4o or GPT-5) can take text and images as input. You send an image (URL or base64) along with a question. With that you can do:</p><ul><li><b>Captions</b>: short or detailed descriptions, of one or several images.</li><li><b>Alt text</b>: descriptions for screen readers that follow accessibility guidelines (short, functional, without 'image of').</li><li><b>Visual question answering</b>: answering questions based on what can be seen (grounded in visual evidence).</li><li>Pointing out or counting <b>objects, parts or regions</b>, reading charts and diagrams.</li></ul>",
when:["Flexible description or question about an image → <b>multimodal model</b> with a prompt.","Fixed structured fields from many images/videos → <b>Content Understanding</b>.","Only reading text (OCR) → Read/OCR is cheaper and more accurate."],
code:[{l:"Generate alt text",src:"response = openai.responses.create(\n    model=\"gpt-41\",\n    input=[{\"role\": \"user\", \"content\": [\n        {\"type\": \"input_text\",\n         \"text\": \"Write alt text (max 125 characters) following WCAG. \"\n                 \"Describe what is relevant, do not start with 'image of'.\"},\n        {\"type\": \"input_image\",\n         \"image_url\": \"https://.../product-42.jpg\",\n         \"detail\": \"low\"},\n    ]}],\n)\nprint(response.output_text)"}],
cfg:["<b>detail</b>: <code>low</code> (cheap, fast, overview), <code>high</code> (fine details, more tokens), <code>auto</code>.","Concise vs. detailed caption → steer it through the prompt (length, audience).","Several images in one message → several <code>input_image</code> items."],
traps:["Text in an image can be an <b>indirect prompt injection</b>. Turn on Prompt Shields."],
rel:["cuvisual","imageanalysis","visualrai"]},

{id:"imagegen",p:"vision",t:"Generating images",s:"gpt-image-1, FLUX: text (and reference image) to image",d:[3],
what:"<p>Image models in Foundry: <b>gpt-image-1</b> (and successors; strong at text in images and at following instructions), <b>FLUX</b> models and the older <b>DALL-E 3</b>. You create an image from a <b>text prompt</b>, optionally with <b>reference images</b> (style, product, person).</p>",
when:["New image from a description → <b>generate</b>.","Partly change an existing image → <b>edit</b> (see Editing images).","Product photo as the base + a new scene → edit/generate with a <b>reference image</b>."],
code:[{l:"Generate an image",src:"img = client.images.generate(\n    model=\"gpt-image-1\",            # deployment name\n    prompt=\"Minimalist product photo of a white sneaker on concrete, soft daylight\",\n    size=\"1024x1024\", quality=\"high\", n=1,\n)\nimport base64\nopen(\"sneaker.png\", \"wb\").write(base64.b64decode(img.data[0].b64_json))"}],
cfg:["<b>size</b>: 1024x1024, 1536x1024 (landscape), 1024x1536 (portrait).","<b>quality</b>: low / medium / high (price and speed).","<b>n</b>: number of variants.","<b>background</b>: <code>transparent</code> for a transparent background (png/webp).","<b>output_format</b>: png, jpeg, webp."],
traps:["Generated images get <b>C2PA content credentials</b> (a provenance label). You should not remove them.","Guardrails also apply to image prompts and generated images."],
rel:["imageedit","videogen","visualrai"]},

{id:"imageedit",p:"vision",t:"Editing images",s:"Inpainting with a mask, prompt-driven edits",d:[3],
what:"<p><b>Image edit</b>: you pass an existing image + a prompt, and the model changes it.</p><ul><li><b>Mask-based edit / inpainting</b>: a <b>mask</b> is an image of the same size in which the <b>transparent</b> part shows what may be regenerated. The rest stays the same, pixel for pixel.</li><li><b>Prompt-driven edit</b>: without a mask, the model changes whatever the prompt asks (for example 'make it evening'). Less control.</li><li><b>Outpainting</b>: extending the image beyond its edges.</li></ul>",
when:["Replace only the background, product unchanged → <b>edit + mask</b> over the background.","Remove or add an object in one spot → <b>inpainting</b> with a mask on that spot.","Change the overall style or mood → prompt-driven edit."],
code:[{l:"Inpainting with a mask",src:"result = client.images.edit(\n    model=\"gpt-image-1\",\n    image=open(\"sneaker.png\", \"rb\"),\n    mask=open(\"mask-background.png\", \"rb\"),   # transparent = may change\n    prompt=\"Replace the background with a sunny beach\",\n    size=\"1024x1024\",\n)"}],
cfg:["Mask: <b>same dimensions</b> as the original, a PNG with an <b>alpha channel</b> (transparency).","<b>input_fidelity</b>: high = keeps details of the original (faces, logos) better."],
traps:["Generating a new image of 'sneaker on a beach' does not keep the original product."],
rel:["imagegen","videoedit"]},

{id:"videogen",p:"vision",t:"Generating & editing video",s:"Sora: text/image to video, remix",d:[3],
what:"<p>With <b>Sora</b> (Sora 2) in Foundry you create short videos from a <b>text prompt</b> or from a <b>reference image</b> (image-to-video). You edit by <b>remixing</b> an existing generated video: the same video with a changed prompt (different style, different detail). Video generation is <b>asynchronous</b>: you start a job and fetch the result when it is done.</p>",
when:["Short marketing or explainer video from text → <b>text-to-video</b>.","Bring a product photo to life → <b>image-to-video</b>.","Change an existing generated video → <b>remix/edit</b>."],
code:[{l:"Start a video job (sketch)",src:"video = client.videos.create(\n    model=\"sora-2\",\n    prompt=\"Drone shot of a wind farm at sunrise\",\n    seconds=\"8\", size=\"1280x720\",\n)\n# poll until status == \"completed\", then download the content\nvideo = client.videos.retrieve(video.id)"}],
cfg:["<b>Duration</b> (seconds), <b>resolution</b> (size), number of variants.","Asynchronous: <b>job ID</b> → check status → download."],
traps:["Generating video ≠ analyzing video. Analyzing → Content Understanding or a multimodal model."],
rel:["imagegen","cuvisual","visualrai"]},

{id:"videoedit",p:"videogen",t:"Choosing generation settings",s:"Which setting for which goal",d:[3],
what:"<table><tr><th>Goal</th><th>Setting</th></tr><tr><td>Faster and cheaper</td><td>Lower <b>quality</b>, smaller <b>size</b>, shorter video</td></tr><tr><td>More to choose from</td><td>Higher <b>n</b> (variants)</td></tr><tr><td>Stay true to the original when editing</td><td><b>mask</b> + high <b>input_fidelity</b></td></tr><tr><td>Keep a logo/product exactly</td><td>Edit with a mask, <i>not</i> generate again</td></tr><tr><td>Transparent for web use</td><td><b>background: transparent</b> + png</td></tr><tr><td>Consistent brand style</td><td><b>reference images</b> + a fixed style prompt</td></tr></table>",
rel:["imagegen","imageedit","videogen"]},

{id:"cuvisual",p:"vision",t:"Content Understanding for images & video",s:"Visual attributes, scenes, segments, single-task and pro mode",d:[3,5],
what:"<p>Content Understanding also analyzes <b>images</b> and <b>video</b>:</p><ul><li><b>Images</b>: visual attributes as fields (for example 'damage visible: yes/no', 'type of vehicle', 'color'), with the methods <b>classify</b> and <b>generate</b>.</li><li><b>Video</b>: transcription, <b>segmentation</b> into scenes/shots with start and end times, keyframes, and your fields per segment (description, topic, objects present).</li><li><b>Single-task</b> pipeline: one analyzer, one task per file. <b>Pro mode</b>: reasoning over several files and reference data.</li></ul>",
when:["Make hours of video searchable per scene → <b>video analyzer</b> → output into AI Search.","Classify thousands of damage photos into fixed categories → <b>image analyzer</b> with classify fields.","One single question about one photo → a multimodal model is simpler."],
rel:["cu","multimodal","videogen"]},

{id:"imageanalysis",p:"vision",t:"Azure AI Vision (Image Analysis)",s:"Captions, tags, objects, OCR (Read), smart crops",d:[3],
what:"<p><b>Azure AI Vision Image Analysis 4.0</b> is the classic image API with fixed features: <b>caption</b> and <b>dense captions</b> (descriptions per region), <b>tags</b>, <b>objects</b> (with bounding boxes: rectangles around objects), <b>people</b>, <b>read</b> (OCR) and <b>smart crops</b> (smart cropping).</p><p><b>Face</b>: detecting faces. Recognition/identification only with approval (Limited Access). <b>Video Indexer</b>: a separate service for video insights.</p>",
when:["Fixed, cheap, fast features on large numbers of images → <b>Image Analysis</b>.","Objects with coordinates (bounding boxes) → <b>objects</b>.","Reading text in photos → <b>read</b>."],
code:[{l:"Analyze (Python)",src:"from azure.ai.vision.imageanalysis import ImageAnalysisClient\nfrom azure.ai.vision.imageanalysis.models import VisualFeatures\n\nclient = ImageAnalysisClient(\"https://my-foundry.cognitiveservices.azure.com/\",\n                             DefaultAzureCredential())\nresult = client.analyze_from_url(\n    image_url=\"https://.../street.jpg\",\n    visual_features=[VisualFeatures.CAPTION, VisualFeatures.OBJECTS, VisualFeatures.READ],\n    gender_neutral_caption=True)\nprint(result.caption.text, result.caption.confidence)"}],
traps:["Facial recognition (who is this?) requires a Limited Access application."],
rel:["multimodal","cuvisual","containers"]},

{id:"visualrai",p:"vision",t:"Responsible AI for images",s:"Filters, prompt injection in images, watermarks, brand rules",d:[3,1],
what:"<ul><li><b>Filters for unsafe images</b>: guardrails on image input and output, or Content Safety <b>analyze image</b> for uploads.</li><li><b>Indirect prompt injection through text in images</b>: an image with the text 'ignore your instructions...'. Solution: <b>Prompt Shields</b> (indirect attacks), treat image content as data, limit tool permissions.</li><li><b>Watermarks and provenance</b>: generated images get <b>C2PA content credentials</b> (metadata saying it is AI-made). You can add your own visible watermarks in your pipeline.</li><li><b>Visual policy rules</b>: flag banned symbols, check brand usage (correct logo, colors), detect inappropriate content. Often with <b>custom categories</b> or a Content Understanding analyzer with classify fields.</li></ul>",
when:["Users upload photos → <b>Content Safety analyze image</b> before processing.","Model reads screenshots/scans that may contain hidden commands → <b>Prompt Shields</b>.","Proving that images are AI-generated → <b>C2PA / content credentials</b>.","Enforcing brand guidelines → classify fields or custom categories + human review."],
rel:["guardrails","promptshields","contentsafety"]}
);

// ===== Text & language =====
N.push(
{id:"llmtekst",p:"text",t:"Text analysis with an LLM",s:"Entities, topics, summary, sentiment, JSON through a prompt",d:[4],
what:"<p>With an LLM you do text analysis through a <b>prompt</b> + <b>structured outputs</b>: entities, topics, summaries, sentiment, tone, classification. Pros: flexible, you can ask for domain-specific fields (for example 'compliance risks in this contract'), without training. Cons: more expensive per document, less predictable than a specialized API.</p><p><b>Domain adaptation</b> (study guide): with instructions, examples (few-shot), a fixed schema and possibly fine-tuning you make the output fit, for example for compliance summaries or legal extraction.</p>",
when:["Your own domain-specific fields or complex interpretation → <b>LLM + structured outputs</b>.","Standard NER/PII/sentiment on large volumes, cheap and consistent → <b>Azure Language</b>.","Tone or 'sensitive content' in your own wording → LLM, possibly with Content Safety alongside."],
code:[{l:"Extraction as JSON",src:"response = openai.responses.create(\n    model=\"gpt-41-mini\",\n    instructions=\"Extract from the email: customer name, product, problem (1 sentence), \"\n                 \"sentiment (positive/neutral/negative) and whether escalation is needed.\",\n    input=email_text,\n    text={\"format\": {\"type\": \"json_schema\", \"name\": \"mail\", \"strict\": True,\n                     \"schema\": schema}},\n    temperature=0)"}],
traps:["'Minimal development effort' + a standard task (PII, sentiment, language detection) usually points to the <b>prebuilt</b> Azure Language feature, not to an LLM."],
rel:["structured","language","translator"]},

{id:"language",p:"text",t:"Azure Language",s:"NER, PII, sentiment, opinion mining, key phrases, language detection, summarization, CLU",d:[4],
syn:"aspect-based sentiment analysis ABSA aspect opinion mining opinions targets assessments PII redaction redact masking anonymize personal data named entity recognition text analytics",
what:"<p><b>Azure Language</b> (a Foundry Tool) contains ready-made language features:</p><table><tr><th>Feature</th><th>What</th></tr><tr><td><b>Language detection</b></td><td>Which language (with a confidence score)</td></tr><tr><td><b>Sentiment analysis</b> + <b>opinion mining</b></td><td>Positive/neutral/negative/mixed per document and per sentence. Opinion mining = <b>aspect-based sentiment analysis</b>: sentiment per aspect, split into <i>targets</i> and <i>assessments</i> ('the food was good, the service was slow')</td></tr><tr><td><b>Key phrase extraction</b></td><td>The most important terms</td></tr><tr><td><b>Named entity recognition (NER)</b></td><td>People, organizations, locations, dates, amounts</td></tr><tr><td><b>Entity linking</b></td><td>Linking an entity to Wikipedia (which 'Mars'?)</td></tr><tr><td><b>PII detection</b></td><td>Finding personal data and <b>redacting</b> it (<b>PII redaction</b>, also in conversations)</td></tr><tr><td><b>Summarization</b></td><td><b>Extractive</b> (the most important sentences, word for word) or <b>abstractive</b> (a new summary), also for conversations</td></tr><tr><td><b>Text analytics for health</b></td><td>Medical entities and relations</td></tr><tr><td><b>CLU</b> (conversational language understanding)</td><td>Intents and entities from short sentences, trained yourself with utterances</td></tr><tr><td><b>Custom question answering</b></td><td>Question-and-answer knowledge base from FAQs</td></tr><tr><td><b>Custom text classification / custom NER</b></td><td>Train your own categories or entities with labeled examples</td></tr></table>",
when:["Remove personal data → <b>PII detection</b> (redacted_text).","Sentiment per aspect of a review → <b>sentiment + opinion mining</b> (aspect-based sentiment analysis, <code>show_opinion_mining=True</code>).","Language unknown before further processing → <b>language detection</b>.","Intent of a short command ('turn on the light') → <b>CLU</b>.","Your own document categories with examples → <b>custom text classification</b> (single- or multi-label)."],
code:[{l:"PII redaction + sentiment (Python)",src:"from azure.ai.textanalytics import TextAnalyticsClient\n\nclient = TextAnalyticsClient(endpoint=\"https://my-foundry.cognitiveservices.azure.com/\",\n                             credential=DefaultAzureCredential())\n\ndocs = [\"Bel Jan de Vries op 06-12345678, de levering was echt slecht.\"]\n\npii = client.recognize_pii_entities(docs, language=\"nl\")\nprint(pii[0].redacted_text)          # Bel ************ op ***********, ...\nfor e in pii[0].entities:\n    print(e.text, e.category, e.confidence_score)\n\nsent = client.analyze_sentiment(docs, language=\"nl\", show_opinion_mining=True)\nprint(sent[0].sentiment, sent[0].confidence_scores)\n\n# Other methods: detect_language, extract_key_phrases, recognize_entities,\n# recognize_linked_entities, begin_abstract_summary, begin_extract_summary"}],
cfg:["<code>language</code>: language code (for example <code>en</code> or <code>nl</code>), or let it be detected.","PII: <code>categories_filter</code> (only certain types), <code>domain</code> (for example phi for medical).","Opinion mining: <code>show_opinion_mining=True</code> in <code>analyze_sentiment</code>; each sentence then has <code>mined_opinions</code> with a target and its assessments.","Long tasks (summarization, health) are <b>asynchronous</b>: <code>begin_...</code> + poller.","Package: <code>azure-ai-textanalytics</code>."],
traps:["Key phrases ≠ entities. Key phrases = important terms. Entities = named things with a category.","Extractive summary = sentences taken word for word. Abstractive = new sentences.","Opinion mining is an option of sentiment analysis, not a separate feature or a separate endpoint."],
rel:["llmtekst","translator","containers","speechstt"]},

{id:"translator",p:"text",t:"Azure Translator",s:"Text, documents, custom translator, LLM translation",d:[4],
what:"<ul><li><b>Text translation</b>: translate text into one or more languages in a single call, with automatic language detection. Also <b>transliteration</b> (a different script) and <b>dictionary lookup</b>.</li><li><b>Document translation</b>: translate whole files (Word, PDF, Excel, ...) while <b>keeping the formatting</b>, asynchronously through Blob Storage.</li><li><b>Custom Translator</b>: your own model built from your own translated sentence pairs, for jargon and house style.</li><li><b>LLM translation</b>: Translator with an LLM option, or yourself through a GPT prompt. Better at context and tone, more expensive.</li></ul>",
when:["Fast, cheap translation of text → <b>Translator text</b>.","Translate a whole PDF/Word file with its formatting → <b>Document translation</b>.","Technical terms keep getting translated wrong → <b>Custom Translator</b> or a <b>glossary</b>.","Tone/style/context matters (marketing) → <b>LLM translation</b>.","Translating spoken language → <b>Speech translation</b>."],
code:[{l:"Translate text (Python)",src:"from azure.ai.translation.text import TextTranslationClient\n\nclient = TextTranslationClient(endpoint=\"https://my-foundry.cognitiveservices.azure.com/\",\n                               credential=DefaultAzureCredential())\nresult = client.translate(body=[\"Waar is het station?\"],\n                          to_language=[\"en\", \"de\"], from_language=\"nl\")\nfor t in result[0].translations:\n    print(t.to, t.text)"}],
cfg:["<b>to</b>: several target languages at once.","<b>category</b>: ID of your Custom Translator model.","Document translation: <b>source container</b> + <b>target container</b> (Blob, with SAS or managed identity) + an optional <b>glossary</b>.","Translator endpoint: global <code>api.cognitive.microsofttranslator.com</code> (with a region header) or your own custom domain."],
traps:["Document translation uses Blob containers, not a direct upload in the request.","Translating speech ≠ Translator text. For audio → Speech translation."],
rel:["language","speechtrans","llmtekst"]}
);

// ===== Speech =====
N.push(
{id:"speechstt",p:"speech",t:"Speech to text",s:"Real-time, fast, batch, diarization, phrase list",d:[4],
what:"<p><b>Speech to text (STT)</b> turns speech into text. Forms:</p><ul><li><b>Real-time</b>: live from a microphone or stream, through the Speech SDK.</li><li><b>Fast transcription</b>: transcribe an audio file quickly (synchronously).</li><li><b>Batch transcription</b>: large numbers of recordings, asynchronously (from Blob Storage).</li><li><b>LLM speech / gpt-4o-transcribe</b>: transcription with a generative model.</li></ul><p>Extras: <b>diarization</b> (who spoke when, separating speakers), <b>language identification</b> (recognizing the language automatically), <b>phrase list</b> (a short list of words that should be recognized better, without training), <b>profanity filter</b>, <b>word-level timestamps</b>.</p>",
when:["Live captions / voice assistant → <b>real-time</b>.","Thousands of call center recordings overnight → <b>batch</b>.","Product names misheard, quick fix → <b>phrase list</b>.","Consistently poor because of jargon/accent/noise → <b>custom speech</b>.","Who said what in a meeting → <b>diarization</b>."],
code:[{l:"Recognize one utterance (Speech SDK)",src:"import azure.cognitiveservices.speech as speechsdk\n\nspeech_config = speechsdk.SpeechConfig(\n    endpoint=\"https://my-foundry.cognitiveservices.azure.com/\",\n    token_credential=DefaultAzureCredential())   # keyless (recent SDK)\nspeech_config.speech_recognition_language = \"nl-NL\"\n\naudio_config = speechsdk.audio.AudioConfig(filename=\"conversation.wav\")\nrecognizer = speechsdk.SpeechRecognizer(speech_config=speech_config,\n                                        audio_config=audio_config)\n\n# Phrase list: recognize technical terms better, without training\nphrases = speechsdk.PhraseListGrammar.from_recognizer(recognizer)\nphrases.addPhrase(\"WerkZekerPlus\")\n\nresult = recognizer.recognize_once_async().get()\nif result.reason == speechsdk.ResultReason.RecognizedSpeech:\n    print(result.text)"}],
cfg:["<b>speech_recognition_language</b>: for example <code>en-US</code> or <code>nl-NL</code>.","<code>recognize_once_async()</code> = one utterance (until ~15-30 s of silence). Longer → <code>start_continuous_recognition()</code> with events.","Alternative sign-in: <code>SpeechConfig(subscription=key, region=\"westeurope\")</code>.","Package: <code>azure-cognitiveservices-speech</code>."],
traps:["<code>recognize_once</code> stops after the first sentence. Long audio needs continuous recognition or batch."],
rel:["customspeech","speechtts","voiceagent","containers"]},

{id:"customspeech",p:"speech",t:"Custom speech",s:"Training your own speech model for jargon, accents, noise",d:[4],
what:"<p>With <b>custom speech</b> you train the base model further on your own data, so it understands your domain better. Kinds of training data:</p><ul><li><b>Plain text</b>: sentences with the technical terms (fast, improves word recognition).</li><li><b>Structured text</b>: patterns and lists (for example product codes).</li><li><b>Audio + human-labeled transcripts</b>: recordings with the correct transcription. Best for accents, noise and specific acoustics.</li><li><b>Pronunciation</b> files: how a word is pronounced.</li></ul><p>You measure quality with <b>WER</b> (word error rate: the percentage of words recognized wrong) and deploy the model to a <b>custom endpoint</b>.</p>",
when:["Jargon consistently wrong → custom speech with <b>plain/structured text</b>.","Accent, noise (factory, car) → custom speech with <b>audio + transcripts</b>.","A few names, quickly → a <b>phrase list</b> is enough."],
code:[{l:"Use a custom model",src:"speech_config.endpoint_id = \"<id-of-your-custom-speech-endpoint>\"\n# then just a SpeechRecognizer, as with standard STT"}],
traps:["Custom speech (understanding) ≠ custom neural voice (speaking with your own voice)."],
rel:["speechstt","speechtts"]},

{id:"speechtts",p:"speech",t:"Text to speech",s:"Neural voices, SSML, custom neural voice",d:[4],
what:"<p><b>Text to speech (TTS)</b> makes the computer speak with <b>neural voices</b> (natural voices in many languages, for example <code>en-US-JennyNeural</code> or <code>nl-NL-FennaNeural</code>).</p><p><b>SSML</b> (Speech Synthesis Markup Language) is XML that controls the pronunciation: voice, <b>prosody</b> (rate, pitch, volume), <b>break</b> (pause), <b>say-as</b> (date, phone number), <b>phoneme</b> (pronunciation), and speaking styles (<code>mstts:express-as</code>, for example cheerful or empathetic).</p><p><b>Custom neural voice</b>: your own brand voice based on recordings of a voice actor (Limited Access, the speaker's consent is required). <b>Personal voice</b>: imitate a voice from a short recording, also Limited Access.</p>",
when:["Agent has to speak its answers → <b>TTS</b>.","Control pronunciation, pauses, pace, style → <b>SSML</b>.","A unique brand voice → <b>custom neural voice</b> (with approval)."],
code:[{l:"Speak SSML",src:"speech_config.speech_synthesis_voice_name = \"nl-NL-FennaNeural\"\nsynth = speechsdk.SpeechSynthesizer(speech_config=speech_config,\n    audio_config=speechsdk.audio.AudioOutputConfig(filename=\"answer.wav\"))\n\nssml = \"\"\"<speak version='1.0' xml:lang='nl-NL'\n  xmlns='http://www.w3.org/2001/10/synthesis'>\n  <voice name='nl-NL-FennaNeural'>\n    Uw afspraak is op <say-as interpret-as='date'>2026-11-07</say-as>.\n    <break time='500ms'/>\n    <prosody rate='-10%'>Tot dan!</prosody>\n  </voice>\n</speak>\"\"\"\nsynth.speak_ssml_async(ssml).get()"}],
cfg:["<b>speech_synthesis_voice_name</b>: which voice.","<b>Output format</b>: for example 16 kHz mono for telephony, 48 kHz for high quality.","Plain text → <code>speak_text_async</code>, SSML → <code>speak_ssml_async</code>."],
traps:["You control pauses, pace and pronunciation with SSML, not with the prompt."],
rel:["speechstt","voiceagent"]},

{id:"speechtrans",p:"speech",t:"Speech translation",s:"Translating spoken language directly, to text or speech",d:[4],
what:"<p><b>Speech translation</b> recognizes speech and translates it in one step into one or more target languages, as text and optionally as spoken audio. It can also detect the speaker's language automatically. Alternative: STT → LLM or Translator → TTS as separate steps (more control, more latency).</p>",
when:["Live translation of a conversation or presentation → <b>speech translation</b>.","Translation with a specific tone or context → STT + <b>LLM</b> + TTS."],
code:[{l:"Translate speech",src:"tcfg = speechsdk.translation.SpeechTranslationConfig(\n    endpoint=\"https://my-foundry.cognitiveservices.azure.com/\",\n    token_credential=DefaultAzureCredential())\ntcfg.speech_recognition_language = \"nl-NL\"\ntcfg.add_target_language(\"en\")\ntcfg.add_target_language(\"de\")\n\nrecognizer = speechsdk.translation.TranslationRecognizer(translation_config=tcfg)\nresult = recognizer.recognize_once_async().get()\nprint(result.translations[\"en\"], result.translations[\"de\"])"}],
cfg:["<b>speech_recognition_language</b> = source language, <b>add_target_language</b> = target languages (language code without region, for example <code>en</code>).","Set <b>voice_name</b> if you also want the translation spoken."],
traps:["Translator (text) cannot handle audio. Audio → Speech translation."],
rel:["translator","speechstt","speechtts"]},

{id:"voiceagent",p:"speech",t:"Speech as an agent modality",s:"Voice Live API, realtime models, audio input",d:[4,2],
what:"<p>A <b>voice agent</b> talks and listens. Options:</p><ul><li><b>Pipeline</b>: STT → LLM/agent → TTS. Flexible, you can use custom speech and custom voices, but more latency.</li><li><b>Voice Live API</b>: one real-time connection (WebSocket) that combines speech recognition, the model, TTS, noise suppression, echo cancellation and <b>turn detection</b> (when has the user finished talking). Can connect to a Foundry agent.</li><li><b>Realtime / audio models</b> (gpt-realtime, gpt-4o-audio): the model hears and speaks itself (speech-to-speech), low latency.</li><li><b>Multimodal reasoning over audio</b>: audio as input to a model for analysis (tone, content) without a separate transcription.</li></ul>",
when:["Natural conversation with low latency, interruptions possible → <b>Voice Live API</b> or a <b>realtime model</b>.","Specific jargon or your own brand voice needed → <b>pipeline</b> with custom speech / custom voice.","Analyzing tone or emotion in a recording → <b>audio input to a multimodal model</b> or Content Understanding audio."],
cfg:["Connection through a <b>WebSocket</b> (real-time, both directions).","Settings: voice, turn detection (for example server VAD, voice activity detection), noise suppression, language."],
traps:["Batch transcription is not a real-time conversation."],
rel:["speechstt","speechtts","agentservice"]}
);

function codeHtml(src){return src.split("\n").map(l=>{const e=esc(l);const t=l.trim();if(t.startsWith("#")||t.startsWith("//"))return `<span class="com">${e}</span>`;const i=l.indexOf("  # ");if(i>-1)return esc(l.slice(0,i))+`<span class="com">${esc(l.slice(i))}</span>`;return e}).join("\n")}
function wrapTables(h){return String(h).replace(/<table>/g,'<div class="tablewrap"><table>').replace(/<\/table>/g,"</table></div>")}
function go(id,push=true){
  const n=byId[id];if(!n)return renderOverview();
  current=id;path(n).forEach(p=>{if(kids(p.id).length)open.add(p.id)});store.set("fk-open",[...open]);

  closeSide();renderTree();

// Search
function search(q){
  q=q.trim().toLowerCase();if(!q){current?go(current,false):renderOverview();return}
  const hay=n=>[n.t,n.s,strip(n.what),...(n.when||[]).map(strip),...(n.cfg||[]).map(strip),...(n.traps||[]).map(strip),...(n.code||[]).map(c=>c.src),n.syn||""].join(" \u2002 ");
  const terms=q.split(/\s+/).filter(Boolean);
  const res=N.filter(domMatch).map(n=>{const h=hay(n).toLowerCase();if(!terms.every(t=>h.includes(t)))return null;const score=(n.t.toLowerCase().includes(terms[0])?10:0)+((n.s||"").toLowerCase().includes(terms[0])?4:0);return{n,score,h:hay(n)}}).filter(Boolean).sort((a,b)=>b.score-a.score);
  const hl=s=>{let e=esc(s);terms.forEach(t=>{e=e.replace(new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>")});return e};
  const snip=h=>{const i=h.toLowerCase().indexOf(terms[0]);const s=Math.max(0,i-60);return (s?"... ":"")+h.slice(s,s+170)+"..."};
  $("#main").innerHTML=`<section class="results"><h1>${res.length} ${res.length===1?"result":"results"} for “${esc(q)}”</h1>${res.length?res.map(r=>`<button class="res" data-go="${r.n.id}"><div class="path">${path(r.n).slice(0,-1).map(p=>esc(p.t)).join(" / ")||"Group"}</div><b>${hl(r.n.t)}</b><p>${hl(snip(r.h))}</p></button>`).join(""):`<div class="empty"><b>Nothing found</b>Try a synonym (e.g. <i>throughput</i>, <i>redaction</i>) or a shorter search term.</div>`}</section>`;
  bindGo($("#main"));
}

let flow="rag", selNode=null;
const PNb=Object.fromEntries(PN.map(n=>[n.id,n]));
function anchor(a,b){
  const ax=a.x+NW/2, ay=a.y+NH/2, bx=b.x+NW/2, by=b.y+NH/2;
  if(b.x>=a.x+NW-4) return [a.x+NW,ay,b.x,by,"h"];
  if(b.x+NW<=a.x+4) return [a.x,ay,b.x+NW,by,"h"];
  return by>ay?[ax,a.y+NH,bx,b.y,"v"]:[ax,a.y,bx,b.y+NH,"v"];
}
function edgePath(e){const a=PNb[e[0]],b=PNb[e[1]];const [x1,y1,x2,y2,o]=anchor(a,b);
  if(o==="h"){const dx=Math.max(40,Math.abs(x2-x1)/2);const s=x2>x1?1:-1;return {d:`M${x1},${y1} C${x1+dx*s},${y1} ${x2-dx*s},${y2} ${x2},${y2}`,mx:(x1+x2)/2,my:(y1+y2)/2}}
  const dy=Math.max(24,Math.abs(y2-y1)/2);const s=y2>y1?1:-1;return {d:`M${x1},${y1} C${x1},${y1+dy*s} ${x2},${y2-dy*s} ${x2},${y2}`,mx:(x1+x2)/2+(x1===x2?8:0),my:(y1+y2)/2}}
function renderPlaat(push=true){

  const nodeOn=new Set();(f?f.edges:[]).forEach(e=>{nodeOn.add(e[0]);nodeOn.add(e[1])});
  if(selNode){PE.forEach(e=>{if(e[0]===selNode||e[1]===selNode){on.add(e[0]+">"+e[1]);nodeOn.add(e[0]);nodeOn.add(e[1])}})}
  const svgE=PE.map(e=>{const p=edgePath(e);const hi=on.has(e[0]+">"+e[1]);return `<g class="pe ${hi?"hi":""}"><path d="${p.d}" marker-end="url(#${hi?"ah":"am"})"/>${hi?`<text x="${p.mx}" y="${p.my-5}" text-anchor="middle">${esc(e[2])}</text>`:""}</g>`}).join("");
  const svgR=REG.map(r=>`<g class="pr"><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="12"/><text x="${r.x+12}" y="${r.y+18}">${esc(r.l)}</text></g>`).join("");
  const svgN=PN.map(n=>`<g class="pn ${nodeOn.has(n.id)?"on":""} ${selNode===n.id?"sel":""}" data-pn="${n.id}" tabindex="0" role="button" aria-label="${esc(n.l)}"><rect x="${n.x}" y="${n.y}" width="${NW}" height="${NH}" rx="9"/><text x="${n.x+NW/2}" y="${n.y+NH/2+4.5}" text-anchor="middle">${esc(n.l)}</text></g>`).join("");
  const sn=selNode?PNb[selNode]:null;
  $("#main").innerHTML=`<nav class="crumbs" aria-label="Breadcrumb"><button data-home="1">Overview</button><span>/</span><span>Diagram</span></nav>
  <div class="dhead"><div><h1>How it all fits together</h1><p class="sub">Choose a flow to see its path. Click a block for an explanation and to open the topic.</p></div></div>
  <div class="flows" role="tablist" aria-label="Flows">${FLOWS.map(x=>`<button class="tab" role="tab" data-flow="${x.id}" aria-selected="${x.id===flow}">${esc(x.l)}</button>`).join("")}<button class="tab" data-flow="" aria-selected="${!flow}">All connections</button></div>
  <div class="plaatgrid">
    <figure class="plaat"><div class="plaatscroll"><svg viewBox="0 0 ${PW} ${PH}" role="img" aria-label="Architecture of a Foundry solution: app, project, agent, tools, data and Foundry Tools with their connections${f?". Highlighted: "+esc(f.l):""}">
      <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-m"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-h"/></marker></defs>
      ${svgR}${svgE}${svgN}</svg></div>
      <figcaption>${f?esc(f.l)+": the highlighted arrows show the path, with what happens on each arrow.":"All connections. Choose a flow to follow one path."}</figcaption></figure>
    <aside class="plaatside">
      ${sn?`<section class="sec"><h2>Selected</h2><p><b>${esc(sn.l)}</b></p><p>${esc(sn.info)}</p>${sn.to?`<button class="iconbtn" data-go="${sn.to}">Open topic</button>`:""} <button class="iconbtn" id="unsel">Clear selection</button></section>`:""}
      ${f?`<section class="sec"><h2>${esc(f.l)} step by step</h2><ol>${f.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></section>`:`<section class="sec"><h2>How to read it</h2><p>Gray arrows are all possible connections. Click a block to see its connections.</p></section>`}
    </aside>
  </div>`;
  bindGo($("#main"));
  $("#main").querySelector("[data-home]").onclick=()=>{hist(location.pathname);renderOverview()};
  $("#main").querySelectorAll("[data-flow]").forEach(b=>b.onclick=()=>{flow=b.dataset.flow;selNode=null;renderPlaat(false)});
  $("#main").querySelectorAll("[data-pn]").forEach(g=>{const act=()=>{selNode=selNode===g.dataset.pn?null:g.dataset.pn;renderPlaat(false)};g.onclick=act;g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act()}}});
  const u=$("#unsel");if(u)u.onclick=()=>{selNode=null;renderPlaat(false)};
}
